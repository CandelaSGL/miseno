<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miseño · Espacio docente</title>
<meta name="description" content="Espacio docente de Miseño: grupo, situaciones, evidencias e intervenciones pedagógicas.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Miseño · Espacio docente
   Mismo lenguaje que la app del alumno (scan-alumno): IBM Plex Sans/Mono,
   tono "miseno" como base, un tono por materia y los mismos personajes. */
:root{
  /* Tono base de Miseño (igual a data-tono="miseno" en la app del alumno) */
  --fondo:#E8F6FC;--suave:#BEE6F6;--nodo:#36BDE6;--boton:#0B7DA3;--texto:#08374A;
  --blanco:#FFFFFF;--muted:#44687A;--linea:#D6EBF4;
  --ok-bg:#E1F5EE;--ok-tx:#085041;--casi-bg:#FAEEDA;--casi-tx:#633806;--err-bg:#FDEDEF;--err-tx:#9E2234;
  --alumno-bg:#F2EDFF;--alumno-tx:#3D1F80;
  --sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r-tarjeta:24px;--r-control:16px;
  --t-entra:240ms;
  /* tono de materia por defecto = Miseño */
  --s-fondo:var(--fondo);--s-suave:var(--suave);--s-nodo:var(--nodo);--s-boton:var(--boton);--s-texto:var(--texto);
}
/* Tonos por materia: mismos valores que la app del alumno */
[data-tono="mate"]{--s-fondo:#FDEDEF;--s-suave:#F7C6CD;--s-nodo:#E4566A;--s-boton:#B42A3E;--s-texto:#4D0F19}
[data-tono="lengua"]{--s-fondo:#FEF1E6;--s-suave:#F9D0AE;--s-nodo:#EF8638;--s-boton:#A64E0E;--s-texto:#4A2309}
[data-tono="recreo"]{--s-fondo:#FDF7DE;--s-suave:#F4E29C;--s-nodo:#E2B41C;--s-boton:#7E6000;--s-texto:#3B2E00}
[data-tono="dibujo"]{--s-fondo:#F2EDFF;--s-suave:#D9CBFF;--s-nodo:#8A4FFF;--s-boton:#6131D6;--s-texto:#25104F}
[data-tono="gastro"]{--s-fondo:#FFEEF5;--s-suave:#FFC7DD;--s-nodo:#FF5FA2;--s-boton:#C42A6C;--s-texto:#4D0C29}
[data-tono="huerta"]{--s-fondo:#F2F8E4;--s-suave:#D5E9AE;--s-nodo:#8DBF3F;--s-boton:#4D7A12;--s-texto:#1F3307}
[data-tono="ciencias"]{--s-fondo:#EBF7EC;--s-suave:#C0E6C8;--s-nodo:#42BE62;--s-boton:#1D7D3A;--s-texto:#0D3B1C}
/* Materias que todavía no tienen profe en la app del alumno */
[data-tono="historia"]{--s-fondo:#F6EFE7;--s-suave:#E6D2BC;--s-nodo:#B07A45;--s-boton:#7D5226;--s-texto:#3A250F}
[data-tono="musica"]{--s-fondo:#E9F4F4;--s-suave:#BFE3E1;--s-nodo:#2FA9A3;--s-boton:#1B6F6B;--s-texto:#0B3533}
[data-tono="progra"]{--s-fondo:#EEF0FD;--s-suave:#CDD3FA;--s-nodo:#5866E8;--s-boton:#3440B5;--s-texto:#141A4D}
[data-tono="neutro"]{--s-fondo:#EEF3F5;--s-suave:#D3DEE3;--s-nodo:#7C939E;--s-boton:#3E5A66;--s-texto:#1E3640}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:16px/1.55 var(--sans);color:var(--texto);background:var(--fondo);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;min-height:44px}
:focus-visible{outline:3px solid var(--boton);outline-offset:3px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--sans);font-weight:600;line-height:1.2;letter-spacing:-.01em}
h1{font-size:32px}h2{font-size:22px}h3{font-size:18px}
p+p{margin-top:10px}
.muted{color:var(--muted)}
.small{font-size:14px}
.eyebrow{font-family:var(--mono);font-size:13px;color:var(--muted);margin-bottom:8px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:fixed;top:-100px;left:20px;z-index:100;padding:12px;background:#fff;border-radius:12px}
.skip:focus{top:10px}
svg.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* Marca y personajes */
.logo{width:34px;height:auto;display:block}
.pj{display:inline-block;object-fit:contain;flex-shrink:0}
.pj-xs{width:26px;height:26px}.pj-s{width:40px;height:40px}.pj-m{width:64px;height:64px}.pj-l{width:96px;height:96px}
.brand{display:flex;align-items:center;gap:10px;font:600 24px var(--sans);letter-spacing:-.01em}
.brand small{font:400 13px var(--mono);color:var(--muted);margin-left:4px}
.home-mark{background:transparent;border:0;padding:4px 8px;font:600 20px var(--sans);color:var(--texto);display:flex;gap:10px;align-items:center;border-radius:14px}

/* Estructura */
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;z-index:8;display:flex;flex-direction:column;gap:28px;padding:24px 16px;background:var(--blanco);border-right:1.5px solid var(--linea)}
.sidebar-spacer{flex:1}
.sidebar nav{display:flex;flex-direction:column;gap:4px}
nav button{display:flex;align-items:center;gap:10px;white-space:nowrap;background:transparent;border:1.5px solid transparent;border-radius:14px;padding:10px 14px;color:var(--muted);font-weight:500;text-align:left}
nav button .counter{margin-left:auto}
nav button:hover{background:var(--fondo)}
nav button[aria-current]{background:var(--fondo);color:var(--texto);font-weight:600}
nav button[aria-current] .icon{color:var(--boton)}
.counter{font:500 12px var(--mono);background:var(--casi-bg);color:var(--casi-tx);border-radius:99px;padding:1px 8px}
.who{display:flex;align-items:center;gap:10px;font-size:14px;padding:0 6px}
.who .avatar{width:36px;height:36px;font-size:14px}
.brand-sub,.sidebar-bottom{display:none}
.workspace{width:100%;max-width:1440px;margin:0 auto;padding:0 32px 32px;min-width:0}
.launch-mode .sidebar,.launch-mode .footer{display:none}
.launch-mode .app{grid-template-columns:minmax(0,1fr)}

/* Encabezados */
.heading{display:flex;align-items:end;justify-content:space-between;gap:18px;margin:32px 0 24px}
.heading p{margin-top:8px;color:var(--muted)}

/* Botones: mismos que la app del alumno (píldoras) */
.btn{border:1.5px solid transparent;border-radius:99px;background:var(--boton);color:#fff;padding:10px 22px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;transition:background .18s,transform .1s,border-color .18s}
.btn:hover{background:#086887}
.btn:active{transform:scale(.98)}
.btn.secondary{background:var(--blanco);border-color:var(--suave);color:var(--texto)}
.btn.secondary:hover{background:var(--fondo)}
.btn.ghost{background:transparent;border-color:var(--suave);color:var(--texto);font-weight:500}
.btn.ghost:hover{background:#ffffff90}
.btn:disabled{cursor:default;opacity:.6;transform:none}
.link{border:0;background:transparent;color:var(--boton);padding:0;text-align:left;font-weight:600;min-height:32px}
.link:hover{text-decoration:underline}
.close{width:44px;height:44px;border:1.5px solid var(--suave);background:var(--blanco);border-radius:50%;font-size:22px;flex-shrink:0;line-height:1}

/* Superficies */
.card{padding:24px;background:var(--blanco);border-radius:var(--r-tarjeta);min-width:0}
.glass{background:#ffffffb0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.split{display:flex;align-items:center;gap:12px}
.stack{display:flex;flex-direction:column;gap:20px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.empty{text-align:center;padding:40px 15px;color:var(--muted)}
.footer{font:13px var(--mono);color:var(--muted);margin-top:32px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.footer button{font-size:13px}

/* Etiquetas: píldoras en mono, como los metadatos del alumno */
.tag{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border-radius:99px;background:var(--fondo);padding:3px 10px;color:var(--texto);font:500 12px/1.5 var(--mono)}
.tag.amber{background:var(--casi-bg);color:var(--casi-tx)}
.tag.green{background:var(--ok-bg);color:var(--ok-tx)}
.tag.lilac{background:var(--alumno-bg);color:var(--alumno-tx)}
.tag.blue{background:transparent;box-shadow:inset 0 0 0 1.5px var(--suave);color:var(--texto)}
.tag.miseno{background:var(--fondo);color:var(--texto);padding-left:4px}
.tag .pj{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:7px;border-radius:99px;padding:3px 10px 3px 8px;background:var(--s-fondo);color:var(--s-texto);font:500 13px var(--mono);white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--s-nodo);flex-shrink:0}
.chip.plain::before{display:none}

/* Avatares de alumnos: círculo en el tono de su materia, como la "J" del alumno */
.avatar{width:42px;height:42px;border-radius:50%;background:var(--s-suave);color:var(--s-texto);display:grid;place-items:center;font:600 16px var(--sans);flex-shrink:0}

/* Splash: igual a la apertura del alumno */
.splash{position:fixed;inset:0;z-index:200;background:var(--fondo);display:grid;place-items:center;transition:opacity .35s}
.splash[hidden]{display:none}
.splash-logo{display:flex;flex-direction:column;align-items:center;gap:6px;font:600 52px var(--sans);letter-spacing:-.02em}
.splash-logo img{width:150px;animation:pop .9s .1s cubic-bezier(.3,1.4,.5,1) both}
.splash-logo span{animation:sube .5s .45s ease both}
.splash-logo small{font:400 16px var(--mono);color:var(--muted);animation:sube .5s .6s ease both}
@keyframes pop{0%{opacity:0;transform:scale(.6) rotate(-6deg)}100%{opacity:1;transform:none}}
@keyframes sube{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes aparece{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Pantalla de inicio */
.launch-screen{width:100%;max-width:1040px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:40px 0}
.launch-options{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.launch-options button{position:relative;border:2px solid var(--s-suave);border-radius:28px;aspect-ratio:1.15;background:var(--s-fondo);color:var(--s-texto);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:transform .2s,border-color .2s,box-shadow .2s;animation:aparece .5s cubic-bezier(.2,.8,.3,1) both}
.launch-options button:nth-child(2){animation-delay:.07s}.launch-options button:nth-child(3){animation-delay:.14s}
.launch-options button:hover{transform:translateY(-4px);border-color:var(--s-nodo);box-shadow:0 18px 40px -24px var(--s-nodo)}
.launch-options strong{font:500 22px var(--sans)}
.launch-icon{color:var(--s-texto)}
.launch-icon svg{width:64px;height:64px;stroke-width:1.4}
.launch-options .badge{position:absolute;top:18px;right:18px;font:600 13px var(--mono);background:var(--casi-bg);color:var(--casi-tx);border-radius:99px;padding:2px 10px}
/* Grupo: jornada + para acompañar + alumnos */
.group-shell{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;align-items:start}
.group-shell.has-profile{grid-template-columns:200px minmax(0,1fr) 340px}
.group-shell>*,.journey-layout>*,.project-columns>*,.grid>*{min-width:0}
.dia{position:sticky;top:24px}
.dia h2{font:400 13px var(--mono);color:var(--muted);margin-bottom:14px}
.dia ol{list-style:none;margin:0;padding:0}
.dia li{position:relative;padding:0 0 22px 30px}
.dia li::before{content:"";position:absolute;left:8px;top:18px;bottom:0;width:2px;background:var(--s-suave)}
.dia li:last-child::before{display:none}
.dia .pto{position:absolute;left:2px;top:5px;width:14px;height:14px;border-radius:50%;border:2px solid var(--s-nodo);background:var(--fondo)}
.dia li.actual .pto{background:var(--s-nodo);box-shadow:0 0 0 6px color-mix(in srgb,var(--s-nodo) 25%,transparent)}
.dia li.hecho .pto{background:var(--s-nodo)}
.dia strong{display:block;font-weight:600;line-height:1.3}
.dia li:not(.actual) strong{color:var(--muted);font-weight:500}
.dia .hora{display:block;font:13px/1.4 var(--mono);color:var(--muted)}
.dia .profes{display:flex;gap:2px;margin-top:6px}
.dia .nota{font:12px var(--mono);color:var(--muted);margin-top:4px}
.attention{margin-bottom:24px}
.attention-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(270px,100%),1fr));gap:14px;margin-top:14px}
.attention-item{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--blanco);border:2px solid transparent;border-radius:20px;padding:18px;transition:border-color .2s,transform .2s;animation:aparece .45s cubic-bezier(.2,.8,.3,1) both}
.attention-item:hover{border-color:var(--s-suave);transform:translateY(-2px)}
.attention-item .who-line{display:flex;align-items:center;gap:10px}
.attention-item h3{font-size:17px}
.attention-item .from{display:flex;align-items:center;gap:6px;font:12px var(--mono);color:var(--muted)}
.attention-item.done{opacity:.75}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.section-head h2{font-size:20px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{min-height:36px;border:1.5px solid var(--suave);border-radius:99px;background:transparent;padding:4px 12px;font:500 13px var(--mono);display:inline-flex;align-items:center;gap:6px}
.filters button::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--s-nodo)}
.filters button[data-filter="all"]::before{display:none}
.filters button[aria-pressed=true]{background:var(--s-fondo);border-color:var(--s-nodo);color:var(--s-texto)}
.student-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:12px;margin-top:4px}
.student{border:2px solid transparent;border-radius:20px;background:var(--blanco);padding:16px;text-align:left;min-width:0;display:flex;flex-direction:column;gap:10px;transition:border-color .2s,transform .2s}
.student:hover{border-color:var(--s-suave);transform:translateY(-2px)}
.student[aria-expanded=true]{border-color:var(--s-nodo)}
.student p{margin:0;color:var(--muted);font-size:14px}
.student .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;flex-wrap:wrap}
.profile-panel{position:sticky;top:24px}
.profile-panel h2{font-size:22px}
.profile-panel .actions{flex-direction:column}
.profile-hero{display:flex;align-items:center;gap:14px;padding:16px;margin:16px 0 4px;border-radius:18px;background:var(--s-fondo);color:var(--s-texto)}
.profile-hero p{font:13px var(--mono)}
dl{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;font-size:14px;margin:18px 0}
dt{color:var(--muted);font:13px var(--mono)}
dd{margin:0;overflow-wrap:anywhere}

/* Recorridos */
.carousel-row{display:flex;align-items:center;gap:10px;margin:24px 0 20px}
.carousel-row>.btn{width:44px;padding:0;flex:0 0 44px;min-height:44px;background:var(--blanco);border-color:transparent}
.pupil-carousel{display:flex;gap:10px;overflow-x:auto;padding:8px 24px;flex:1;min-width:0;scrollbar-width:none;overscroll-behavior-x:contain;mask-image:linear-gradient(to right,transparent,#000 28px,#000 calc(100% - 28px),transparent);-webkit-mask-image:linear-gradient(to right,transparent,#000 28px,#000 calc(100% - 28px),transparent)}
.pupil-carousel::-webkit-scrollbar{display:none}
.pupil-choice{display:flex;align-items:center;gap:10px;flex:0 0 auto;white-space:nowrap;border:2px solid transparent;border-radius:99px;background:#ffffffa0;padding:5px 16px 5px 5px;font-weight:500;transition:background .2s,border-color .2s}
.pupil-choice .avatar{width:34px;height:34px;font-size:14px}
.pupil-choice:hover{background:var(--blanco)}
.pupil-choice[aria-pressed=true]{background:var(--blanco);border-color:var(--s-nodo)}
.pupil-head{display:flex;align-items:center;gap:18px;padding:20px 24px;border-radius:var(--r-tarjeta);background:var(--s-fondo);color:var(--s-texto);margin-bottom:20px;animation:aparece .3s ease both}
.pupil-head .avatar{width:56px;height:56px;font-size:22px;background:var(--blanco)}
.pupil-head h1{font-size:28px}
.pupil-head .meta{font:13px var(--mono);margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pupil-head .actions{margin:0 0 0 auto}
.pupil-head .btn.secondary{background:var(--blanco);border-color:var(--s-suave);color:var(--s-texto)}
.journey-layout{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:24px;align-items:start}
.tabs{display:flex;gap:6px;margin-bottom:18px;overflow:auto;padding:4px}
.tabs button{white-space:nowrap;background:transparent;border:1.5px solid transparent;border-radius:99px;padding:8px 16px;color:var(--muted);font-weight:500}
.tabs button:hover{background:#ffffff80}
.tabs button[aria-selected=true],.project-tabs button[aria-pressed=true]{background:var(--blanco);border-color:var(--suave);color:var(--texto);font-weight:600}
.insight-capsule{padding:10px 10px 22px;position:sticky;top:24px}
.insight-pills{display:flex;gap:4px;border-radius:99px;background:var(--fondo);padding:4px}
.insight-pills button{display:flex;align-items:center;justify-content:center;gap:8px;flex:1;background:transparent;border:0;border-radius:99px;color:var(--muted);font-weight:500;min-height:40px}
.insight-pills button .pj{width:24px;height:24px}
.insight-pills button[aria-pressed=true]{background:var(--blanco);color:var(--texto);font-weight:600}
.capsule-content{padding:20px 12px 0;animation:aparece .25s ease both}
.capsule-content blockquote,.evidence blockquote{margin:14px 0;font:400 17px/1.5 var(--mono)}
.capsule-divider{border-top:1.5px dashed var(--linea);margin:22px 0}
.guio-says{display:flex;gap:10px;align-items:flex-start;margin-top:12px}
.guio-says p{font:15px/1.5 var(--mono)}
.chat-log{max-height:340px;overflow-y:auto;overscroll-behavior:contain;margin-top:16px;scrollbar-width:thin}
.chat-message{padding:12px 14px;border-radius:18px;background:var(--fondo);margin-bottom:10px;font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.chat-message strong{font:500 12px var(--mono);color:var(--muted)}
.chat-message p{margin-top:4px}
.chat-message.assistant p{font-family:var(--mono)}
.chat-message.user{background:var(--blanco);box-shadow:inset 0 0 0 1.5px var(--suave);margin-left:24px}
.chat-message.assistant{margin-right:12px}
.chat-suggestions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chat-suggestions button{font:500 12px var(--mono);border:1.5px solid var(--suave);border-radius:99px;padding:6px 12px;background:transparent;min-height:36px}
.capsule-content textarea{min-height:80px}
.next-activity{margin-bottom:20px;box-shadow:inset 0 0 0 2px var(--suave)}
.next-activity h2{font-size:22px;margin-top:10px}
.embedded-history{margin-top:20px}

/* Evidencias y fuentes */
.evidence{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.journey-layout .evidence{grid-template-columns:1fr}
.source-card{padding:20px;border-radius:20px;background:var(--alumno-bg);color:var(--alumno-tx)}
.source-card.family{background:var(--ok-bg);color:var(--ok-tx)}
.source-card .tag{background:var(--blanco)}
.source-card .small{opacity:.85;font-family:var(--mono);font-size:13px}
.callout{padding:14px 18px;border-radius:16px;background:var(--fondo);color:var(--texto);margin-top:18px;font-size:14px}
.callout.amber{background:var(--casi-bg);color:var(--casi-tx)}
.alert{box-shadow:inset 0 0 0 2px var(--casi-bg)}

/* Tablas */
.table-wrap{overflow-x:auto;margin-top:16px}
table{border-collapse:collapse;width:100%;text-align:left;font-size:14px}
td,th{padding:14px 12px;border-bottom:1.5px solid var(--linea);vertical-align:top}
th{font:400 12px var(--mono);color:var(--muted)}
td:first-child{font-variant-numeric:tabular-nums}
.table-wrap td .tag{margin-top:6px}

/* Línea de tiempo: nodos como el día del alumno */
.timeline{border-left:2px solid var(--suave);padding-left:24px;margin:22px 0 0 7px}
.event{position:relative;padding-bottom:24px}
.event:before{content:"";position:absolute;left:-33px;top:5px;width:14px;height:14px;background:var(--fondo);border:2px solid var(--nodo);border-radius:50%}
.event p{margin-top:5px;white-space:pre-wrap;overflow-wrap:anywhere}
.note-text{white-space:pre-wrap;overflow-wrap:anywhere}

/* Formularios */
input,select,textarea{border:1.5px solid var(--suave);border-radius:var(--r-control);background:var(--blanco);padding:10px 14px;min-height:46px}
input:focus,select:focus,textarea:focus{border-color:var(--boton)}
input[type=search]{min-width:240px;flex:1;border-radius:99px;padding-left:18px}
textarea{width:100%;min-height:110px;resize:vertical}
label{display:block;font-weight:600;font-size:14px;margin:18px 0 6px}
.check{display:flex;align-items:flex-start;gap:10px;font-weight:400}
.check input{min-height:22px;width:20px;height:20px;margin:0;flex-shrink:0;accent-color:var(--boton)}
.error{color:var(--err-tx);font-size:14px;margin-top:8px}
.error:empty{display:none}

/* Diálogo y aviso */
dialog{border:0;border-radius:28px;background:var(--blanco);color:var(--texto);padding:28px;width:min(660px,calc(100% - 30px));max-height:90vh;box-shadow:0 30px 90px -20px #08374a55}
dialog::backdrop{background:#08374a40;backdrop-filter:blur(4px)}
dialog[open]{animation:aparece .22s ease both}
.toast{position:fixed;bottom:24px;right:24px;z-index:20;max-width:calc(100vw - 48px);background:var(--texto);color:#fff;padding:14px 20px 14px 14px;border-radius:20px;display:flex;align-items:center;gap:10px;font-size:15px;animation:aparece .25s ease both}
.toast[hidden]{display:none}
.toast img{width:34px;height:34px}

/* Situaciones y estados */
.status-grid{display:grid;gap:12px;margin:18px 0}
.status-grid>div{padding-bottom:12px;border-bottom:1.5px solid var(--linea)}
.status-grid strong{display:block;margin-bottom:4px}
.situation{display:flex;gap:20px;align-items:center;justify-content:space-between;padding:20px 0;border-top:1.5px solid var(--linea)}
.situation h3{margin:8px 0}
.subject{display:flex;gap:16px;align-items:center;padding:16px 0;border-top:1.5px solid var(--linea)}
.subject .track{margin-left:auto;width:120px}
.bar{height:8px;background:var(--s-fondo);border-radius:99px;margin-top:6px}
.bar i{display:block;height:100%;background:var(--s-nodo);border-radius:99px}
.breadcrumb{margin:24px 0 0;display:flex;align-items:center;gap:9px;font-size:14px}

/* Proyectos */
.project-brief{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px;margin-bottom:18px}
.project-brief p{margin-top:8px}
.project-visual{height:140px;background:var(--s-fondo);border-radius:18px;display:grid;place-items:center;margin-bottom:20px}
.project-members{display:flex;gap:8px;margin:16px 0}
.project-columns{display:grid;grid-template-columns:290px minmax(0,1fr);gap:24px;align-items:start}
.project-roster{display:grid;gap:10px;margin-top:18px}
.team-select{display:flex;flex-direction:column;gap:4px;padding:14px 16px;text-align:left;border:2px solid transparent;background:var(--fondo);border-radius:18px;transition:background .2s,border-color .2s}
.team-select:hover{border-color:var(--suave)}
.team-select[aria-pressed=true]{border-color:var(--boton);background:var(--blanco)}
.team-select strong{font:600 18px var(--sans)}
.project-member-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}
.project-member-cards .student{background:var(--fondo)}
.project-member-cards .student p{margin-bottom:0}
.project-checkpoints{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:22px;padding-bottom:20px;border-bottom:1.5px solid var(--linea)}
.project-checkpoints p{margin-top:8px}
.incident-list{display:grid;gap:18px;margin-top:22px}
.incident-card{padding:20px;background:var(--fondo);border-radius:20px}
.incident-card>.small{margin-top:10px}
.incident-card .timeline:empty{display:none}
.member-picker{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:270px;overflow:auto;padding:8px;border:1.5px solid var(--suave);border-radius:var(--r-control)}
.member-picker .check{margin:0;padding:8px;font-size:14px}
.member-picker small{display:block;font:12px var(--mono);color:var(--muted)}
#team-name,#incident-title{width:100%}
#project-panel{min-height:350px}
.project-profes{display:flex;align-items:center;gap:6px;font:13px var(--mono);color:var(--muted)}

/* Ficha del alumno */
.back{display:inline-flex;align-items:center;gap:6px;margin:24px 0 14px;font-weight:500;color:var(--muted)}
.back .icon{width:18px;height:18px}
.ficha-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:28px;align-items:center;background:var(--blanco);border-radius:var(--r-tarjeta);padding:28px}
.anillo{width:132px;height:132px;border-radius:50%;padding:6px;background:conic-gradient(from 200deg,var(--s-nodo),var(--nodo),#8DBF3F,var(--s-nodo))}
.anillo span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--s-fondo);color:var(--s-texto);font:600 48px var(--sans);border:5px solid var(--blanco)}
.ficha-id h1{font-size:34px}
.datos{display:flex;flex-wrap:wrap;gap:6px 28px;margin:10px 0 0}
.datos div{display:flex;gap:8px;align-items:baseline}
.datos dt{font:12px var(--mono);color:var(--muted)}
.datos dd{margin:0;font-size:15px}
.datos.col{flex-direction:column}
.ficha-actions{flex-direction:column;margin:0}
.ficha-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;margin-top:20px;align-items:start}
.ficha-main{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.ficha-side{display:grid;gap:20px;position:sticky;top:24px}
.ficha h2{font-size:18px;display:flex;align-items:center;gap:8px}
.fuente{font:12px/1.5 var(--mono);color:var(--muted);margin-top:14px}
.hobbies{display:flex;gap:12px;align-items:baseline;margin:14px 0 6px;font-weight:600}
.hobbies span{font:12px var(--mono);color:var(--muted);font-weight:400;width:92px}
.int-row{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:center;padding:7px 0;font-size:14px}
.int-bar{height:8px;border-radius:99px;background:var(--fondo);overflow:hidden}
.int-bar i{display:block;height:100%;border-radius:99px;background:var(--boton)}
.arbol{width:100%;max-width:380px;display:block;margin:6px auto 0}
.arbol .tronco{stroke:var(--texto);stroke-width:7;fill:none;stroke-linecap:round}
.arbol .rama{stroke:var(--texto);stroke-width:3.5;fill:none;stroke-linecap:round}
.arbol .hoja{fill:var(--blanco);stroke:var(--s-suave);stroke-width:2}
.arbol .hoja.on{fill:var(--s-nodo);stroke:var(--s-nodo)}
.arbol .rama-tx{font:11px var(--mono);fill:var(--muted)}
.amigos{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px}
.amigo{display:flex;flex-direction:column;align-items:center;gap:8px;background:transparent;border:0;padding:6px;border-radius:16px;font-size:14px;font-weight:500}
.amigo:hover{background:var(--fondo)}
.amigo .avatar{width:58px;height:58px;font-size:20px}
.curva{width:100%;display:block;margin-top:14px}
.curva .linea{fill:none;stroke:var(--texto);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.curva .pto{fill:var(--blanco);stroke:var(--texto);stroke-width:2}
.curva .pto.ult{fill:var(--boton);stroke:var(--boton)}
.curva-ejes{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--muted)}
.restringido{background:#ffffffb0;box-shadow:inset 0 0 0 1.5px var(--suave)}
/* Reuniones */
.meet-layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px;align-items:start}
.meet-list{display:grid;gap:10px}
.meet-list .eyebrow{margin:0}
.meet-card{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;text-align:left;background:var(--blanco);border:2px solid transparent;border-radius:20px;padding:12px}
.meet-card:hover{border-color:var(--s-suave)}
.meet-card[aria-pressed=true]{border-color:var(--s-nodo)}
.meet-card strong{display:block}
.meet-card .small{display:block}
.meet-card .tag{margin-top:6px}
.fecha{display:grid;place-items:center;width:56px;height:56px;border-radius:16px;background:var(--s-fondo);color:var(--s-texto);font:500 12px var(--mono);line-height:1.1}
.fecha b{font:600 22px var(--sans)}
.meet-detail{position:sticky;top:24px}
.meet-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.meet-why{margin-top:18px;font-size:17px}
.meet-agenda{margin-top:20px;padding:18px 20px;border-radius:20px;background:var(--fondo)}
.meet-agenda ol{margin:12px 0 0;padding-left:22px;font:15px/1.6 var(--mono)}
.meet-agenda li+li{margin-top:6px}


/* Botones de ícono con etiqueta flotante */
.ib{position:relative;width:44px;height:44px;min-height:44px;border-radius:50%;border:1.5px solid var(--suave);background:var(--blanco);color:var(--texto);display:inline-grid;place-items:center;padding:0;flex-shrink:0;transition:background .15s,border-color .15s}
.ib:hover{background:var(--fondo);border-color:var(--nodo)}
.ib .icon{width:20px;height:20px}
.ib.quiet{border-color:transparent;background:transparent}
.small-ib{width:36px;height:36px;min-height:36px}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--texto);color:#fff;font:500 12px var(--mono);padding:5px 10px;border-radius:10px;white-space:nowrap;z-index:40;pointer-events:none;animation:aparece .15s ease both}
.ficha-actions{flex-direction:row;align-items:center}
.from{display:inline-flex}

/* Árbol de aprendizaje */
.arbol-card .row{margin-bottom:6px}
.arbol-mini{display:block;width:100%;background:transparent;border:0;padding:0;border-radius:16px}
.arbol-mini:hover{background:var(--fondo)}
.arbol{width:100%;display:block}
.arbol.grande{max-width:none;margin:0}
.arbol .tronco{stroke:var(--texto);stroke-width:18;fill:none;stroke-linecap:round}
.arbol .rama{stroke:color-mix(in srgb,var(--s-nodo) 55%,var(--texto));fill:none;stroke-linecap:round;stroke-linejoin:round}
.arbol .rama.antes{stroke:var(--suave);stroke-width:2.5;stroke-dasharray:4 6}
.arbol .hoja circle{fill:var(--blanco);stroke:var(--s-suave);stroke-width:1.5;transition:transform .15s}
.arbol .hoja.logrado circle{fill:var(--s-nodo);stroke:var(--s-nodo)}
.arbol .hoja.curso circle{fill:var(--s-suave);stroke:var(--s-nodo);stroke-width:3}
.arbol .hoja.refuerzo circle{fill:var(--s-nodo);stroke:var(--s-nodo)}
.arbol .hoja .anillo-ref{fill:none!important;stroke:#D99A12!important;stroke-width:3!important;stroke-dasharray:4 3}
.arbol.grande .hoja{cursor:pointer;outline:none}
.arbol.grande .hoja:hover circle:first-child,.arbol.grande .hoja:focus-visible circle:first-child{stroke:var(--texto);stroke-width:3}
.arbol.grande .hoja.sel circle:first-child{stroke:var(--texto);stroke-width:4}
.arbol .rama-tx{font:600 22px var(--sans);fill:var(--texto)}
.arbol .rama-tx.chico{font:500 34px var(--mono);fill:var(--muted)}
.arbol .grado-tx{font:500 13px var(--mono);fill:var(--muted);text-anchor:middle}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 16px;font:12px var(--mono);color:var(--muted);margin-top:10px}
.ley{display:inline-flex;align-items:center;gap:6px}
.ley i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--nodo);background:var(--blanco)}
.ley.logrado i{background:var(--nodo)}
.ley.curso i{background:var(--suave);border-width:3px}
.ley.refuerzo i{background:var(--nodo);box-shadow:0 0 0 2px var(--blanco),0 0 0 3.5px #D99A12}
.ley.futuro i{border-color:var(--suave)}
.arbol-page{padding-top:24px}
.arbol-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.arbol-top h1{font-size:28px}
.arbol-top .leyenda{margin:0 0 0 auto}
.arbol-layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.arbol-lienzo{padding:16px}
.hoja-panel{position:sticky;top:24px}
.hoja-panel h2{font-size:22px;margin:14px 0 6px}
.hoja-panel .timeline{list-style:none;margin-top:18px}
.est-logrado{background:var(--ok-bg);color:var(--ok-tx)}
.est-curso{background:var(--fondo)}
.est-refuerzo{background:var(--casi-bg);color:var(--casi-tx)}
.est-futuro{background:transparent;box-shadow:inset 0 0 0 1.5px var(--suave)}

/* Responsive */
@media(min-width:1450px){.journey-layout .evidence{grid-template-columns:1fr 1fr}}
@media(max-width:1180px){
  .arbol-layout{grid-template-columns:1fr}
  .hoja-panel{position:static}
  .ficha-main{grid-template-columns:1fr}
  .ficha-grid{grid-template-columns:minmax(0,1fr) 300px}
  .group-shell.has-profile{grid-template-columns:200px minmax(0,1fr)}
  .group-shell.has-profile>#student-profile{grid-column:2;grid-row:1}
  .profile-panel{position:static}
  .journey-layout{grid-template-columns:minmax(0,1fr) 320px;gap:16px}
}
@media(max-width:1000px){
  .grid,.project-brief{grid-template-columns:1fr}
  .project-columns{grid-template-columns:240px minmax(0,1fr)}
  .project-checkpoints{grid-template-columns:1fr}
}
@media(max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar>*{min-width:0}
  .sidebar{position:sticky;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px;border-right:0;border-bottom:1.5px solid var(--linea)}
  .sidebar nav{flex-direction:row;width:100%;overflow:auto}
  .sidebar-spacer{display:none}
  .ficha-head{grid-template-columns:auto 1fr;gap:18px;padding:20px}
  .anillo{width:92px;height:92px}.anillo span{font-size:34px}
  .ficha-actions{grid-column:1/-1}
  .arbol-top .leyenda{margin-left:0;width:100%}
  .arbol-lienzo{overflow-x:auto}
  .arbol.grande{min-width:760px}
  .ficha-grid,.meet-layout{grid-template-columns:1fr}
  .ficha-side,.meet-detail{position:static}
  .who{display:none}
  .workspace{padding:0 16px 24px}
  .group-shell,.group-shell.has-profile{grid-template-columns:1fr}
  .group-shell.has-profile>#student-profile{grid-column:1;grid-row:auto}
  .dia{position:static}
  .dia ol{display:flex;gap:4px;overflow-x:auto}
  .dia li{padding:24px 16px 4px 0;min-width:104px}
  .dia li::before{left:16px;right:0;top:6px;bottom:auto;width:auto;height:2px}
  .dia .pto{left:0;top:0}
  .journey-layout{grid-template-columns:1fr}
  .insight-capsule{position:static}
  .launch-screen{padding:24px 16px}
  .launch-options{grid-template-columns:1fr;gap:16px}
  .launch-options button{aspect-ratio:auto;min-height:140px}
  .launch-icon svg{width:44px;height:44px}
  .pupil-head{flex-wrap:wrap}
  .pupil-head .actions{margin-left:0;width:100%}
}
@media(max-width:760px){
  .project-columns{grid-template-columns:1fr}
  .project-roster,.project-member-cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .heading{flex-direction:column;align-items:start;margin:24px 0 18px}
  h1{font-size:28px}
}
@media(max-width:560px){
  .evidence,.member-picker,.project-member-cards,.project-roster{grid-template-columns:1fr}
  .student-list,.attention-list{grid-template-columns:1fr}
  .situation{flex-direction:column;align-items:start}
  .track{display:none}
  .toolbar input{min-width:0;width:100%}
  .row{align-items:flex-start}
  .card{padding:20px}
  dl{grid-template-columns:100px 1fr}
  .toast{bottom:16px;right:16px;max-width:calc(100vw - 32px)}
  .sidebar nav button{padding:8px 12px}
  .sidebar nav .icon{display:none}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

<body><div id="splash" class="splash" role="status" aria-label="Cargando Miseño"><div class="splash-logo"><img src="img/logo.webp" alt=""><span>Miseño</span><small>Espacio docente</small></div></div><a class="skip" href="#main">Ir al contenido</a><div class="app"><header class="sidebar"><button class="home-mark brand" data-page="launch" aria-label="Miseño · Volver al inicio"><img class="logo" src="img/logo.webp" alt="">Miseño</button><nav aria-label="Navegación principal" id="nav"></nav><div class="sidebar-spacer"></div><div class="who"><span class="avatar" data-tono="neutro">CL</span><div><strong>Clara López</strong><div class="small muted">Grupo A · Primaria</div></div></div></header><div class="workspace"><main id="main" tabindex="-1"></main></div></div><dialog id="dialog" aria-labelledby="dialog-title"></dialog><div id="toast" class="toast" hidden role="status"></div>
<script>
'use strict';
const $=s=>document.querySelector(s), KEY='miseno-docentes-v1';
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial=()=>({notes:[],review:false,planReview:false,academic:false,started:false});
let selectedProfile=null;
let state=initial(),page='launch',student='tomi',tab='activities',query='',groupFilter='all',situationFilter='all',toastTimer;
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.notes))state={...initial(),...s}}catch(e){}
const pupils=[{id:'tomi',name:'Tomás',short:'Tomi',initial:'T',subject:'Matemática',activity:'Fracciones · Situaciones de fútbol',color:'#eee9fa',status:'Revisar adaptación'},{id:'joaquin',name:'Joaquín',short:'Joaquín',initial:'J',subject:'Matemática',activity:'Fracciones · Apoyo visual',color:'#e2eff4',status:'Necesita acompañamiento'},{id:'sofia',name:'Sofía',short:'Sofía',initial:'S',subject:'Ciencias',activity:'Las plantas · Proyecto de huerta',color:'#e0f1e8',status:'Actividad en curso'},{id:'bruno',name:'Bruno',short:'Bruno',initial:'B',subject:'Lengua',activity:'La arquera · Comprensión del cuento',color:'#f7e8df',status:'Actividad en curso'},{id:'emma',name:'Emma',short:'Emma',initial:'E',subject:'Historia',activity:'La colonia · Exploración guiada',color:'#e9e6f8',status:'Actividad en curso'},{id:'mateo',name:'Mateo',short:'Mateo',initial:'M',subject:'Ciencias',activity:'Las plantas · Observación',color:'#e0eee8',status:'Sin nuevos registros'}];

// Materias: mismo tono y mismo profe que en la app del alumno.
const SUBJ={'Matemática':{t:'mate',p:'numi',n:'Numi'},'Lengua':{t:'lengua',p:'otto',n:'Otto'},'Ciencias':{t:'ciencias',p:'fini',n:'Fini'},'Dibujo':{t:'dibujo',p:'dona',n:'Dona'},'Gastronomía':{t:'gastro',p:'rolo',n:'Rolo'},'Huerta':{t:'huerta',p:'fini',n:'Numi y Fini'},'Recreo':{t:'recreo'},'Historia':{t:'historia'},'Música':{t:'musica'},'Programación':{t:'progra'}};
const JORNADA=[['Matemática','8:30','numi','hecho'],['Lengua','9:30','otto','actual'],['Recreo','10:20',null,''],['Huerta','10:40','numi,fini','']];
function tone(subject){return (SUBJ[subject]||SUBJ[String(subject).split(' ')[0]]||{t:'neutro'}).t}
function pj(name,size='s',mood='reposo'){return name?`<img class="pj pj-${size}" src="img/${name}-${mood==='reposo'?'reposo':mood}.webp" alt="" onerror="this.remove()">`:''}
function profe(subject){const d=SUBJ[subject];return d&&d.p?d:null}
function chip(subject){return `<span class="chip" data-tono="${tone(subject)}">${esc(subject)}</span>`}
function miseTag(text){return `<span class="tag miseno">${pj('guio','xs')}${text}</span>`}

// Ficha del alumno (visión de Candela). Joaquín, Sofía y Bruno usan los datos de la app del alumno.

function toast(t){$('#toast').innerHTML=pj('guio','s','habla')+'<span>'+esc(t)+'</span>';$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,5500)}
function pending(){return Number(!state.review)+Number(!state.academic)}
function nav(){const names={group:'Grupo',paths:'Recorridos',meetings:'Reuniones',projects:'Proyectos'},n=attentionItems().filter(i=>!i.done).length;$('#nav').innerHTML=Object.entries(names).map(([id,name])=>`<button data-page="${id}" ${page===id||((page==='ficha'||page==='arbol')&&id==='group')?'aria-current="page"':''}>${icon(id)}${name}${id==='group'&&n?`<span class="counter" aria-label="${n} para acompañar">${n}</span>`:''}</button>`).join('')}

function title(a,b,extra=''){return `<div class="heading"><h1 id="page-title" tabindex="-1">${a}</h1>${extra}</div>`}
function pupil(id=student){return pupils.find(p=>p.id===id)||pupils[0]}
function avatar(p){return `<span class="avatar" data-tono="${tone(p.subject)}" aria-hidden="true">${p.initial}</span>`}
function status(p){if(p.id==='tomi')return state.review?'En revisión':state.started?'En atención':p.status;if(p.id==='joaquin'&&state.academic)return 'Intervención realizada';return p.status}
function openPupil(id){student=id;page='paths';tab='activities';render(true)}
function attentionItems(){const items=[{id:'tomi',from:'numi',title:'Dificultad persistente · Revisar adaptación',label:state.review?'En revisión':state.started?'En atención':'Pendiente',done:state.review},{id:'joaquin',from:'numi',title:'Numi pide acompañamiento presencial con fracciones',label:state.academic?'Intervención realizada':'Pendiente',done:state.academic}];pupils.filter(p=>p.status==='Necesita acompañamiento'&&!items.some(i=>i.id===p.id)).forEach(p=>{const pr=profe(p.subject);items.push({id:p.id,from:pr?pr.p:'guio',title:'Necesita acompañamiento · '+p.activity,label:state.notes.some(n=>n.student===p.id)?'Intervención realizada':'Pendiente',done:state.notes.some(n=>n.student===p.id)})});return items}
function jornada(){return `<aside class="dia" aria-label="La jornada de hoy"><h2>Hoy · Grupo A</h2><ol>${JORNADA.map(([m,h,who,st])=>`<li class="${st}" data-tono="${tone(m)}"><span class="pto" aria-hidden="true"></span><strong>${m}</strong><span class="hora">${h}${st==='actual'?' · ahora':''}</span>${who?`<div class="profes">${who.split(',').map(w=>pj(w,'xs')).join('')}</div>`:''}</li>`).join('')}</ol></aside>`}
function group(){const subjects=[...new Set(pupils.map(p=>p.subject))];const list=pupils.filter(p=>(groupFilter==='all'||p.subject===groupFilter)&&(p.name+' '+p.short+' '+p.subject+' '+p.activity).toLowerCase().includes(query.toLowerCase()));const att=attentionItems();const open=att.filter(i=>!i.done).length;return title('Grupo A',open?`${open} ${open===1?'situación espera':'situaciones esperan'} tu mirada. El resto del grupo sigue su recorrido.`:'No hay situaciones pendientes. Podés sumar observaciones cuando quieras.')+`<div class="group-shell">${jornada()}<div><section class="attention" aria-labelledby="att-title"><div class="section-head"><h2 id="att-title">Para acompañar</h2></div><div class="attention-list">${att.map(i=>{const p=pupil(i.id);return `<button class="attention-item ${i.done?'done':''}" data-tono="${tone(p.subject)}" data-student="${p.id}"><span class="who-line">${avatar(p)}<span><strong>${p.name}</strong><br>${chip(p.subject)}</span></span><h3>${i.title}</h3><span class="row"><span class="from" title="Derivó ${i.from==='guio'?'Guio':SUBJ[p.subject]?.n||'Miseño'}">${pj(i.from,'s')}</span><span class="tag ${i.done?'green':'amber'}">${i.label}</span></span></button>`}).join('')}</div></section><section aria-labelledby="students-title"><div class="section-head" style="margin-bottom:12px"><h2 id="students-title">Todo el grupo</h2><span class="small muted">${list.length} de ${pupils.length} alumnos</span></div><div class="toolbar"><input type="search" id="search" aria-label="Buscar alumno, materia o actividad" placeholder="Buscar alumno, materia o actividad" value="${esc(query)}"><div class="filters" role="group" aria-label="Filtrar por materia"><button data-filter="all" aria-pressed="${groupFilter==='all'}">Todas</button>${subjects.map(m=>`<button data-filter="${esc(m)}" data-tono="${tone(m)}" aria-pressed="${groupFilter===m}">${esc(m)}</button>`).join('')}</div></div><div class="student-list">${list.map(p=>`<button class="student" data-tono="${tone(p.subject)}" data-ficha="${p.id}"><span class="split">${avatar(p)}<span><strong>${p.name}</strong><br>${chip(p.subject)}</span></span><p>${p.activity}</p><span class="foot"><span class="tag ${/acompañamiento|Revisar|Pendiente/.test(status(p))?'amber':/realizada/.test(status(p))?'green':''}">${status(p)}</span>${pj(profe(p.subject)?.p,'xs')}</span></button>`).join('')||'<p class="empty">No hay alumnos que coincidan con la búsqueda.</p>'}</div></section></div></div>`}
function bars(int){return Object.entries(int).map(([k,v])=>`<div class="int-row"><span>${k}</span><span class="int-bar" role="img" aria-label="${k}: ${v} de 5"><i style="width:${v*20}%"></i></span></div>`).join('')}
function tree(ramas){const keys=Object.keys(ramas).slice(0,5);const cx=170;const L={1:[[150,170,40]],2:[[170,70,70],[160,270,70]],3:[[185,55,105],[150,170,40],[175,285,105]],4:[[195,50,135],[160,110,55],[150,230,55],[185,290,135]],5:[[200,45,150],[170,85,75],[145,170,35],[170,255,75],[200,295,150]]}[keys.length];let g=`<path d="M${cx} 262 L${cx} ${Math.min(...L.map(l=>l[0]))-6}" class="tronco"/>`;keys.forEach((k,i)=>{const [sy,ex,ey]=L[i];const dx=ex-cx,dy=ey-sy,len=Math.hypot(dx,dy),nx=-dy/len,ny=dx/len;g+=`<path d="M${cx} ${sy} Q${cx+dx*.35} ${sy+dy*.75} ${ex} ${ey}" class="rama"/>`;for(let j=0;j<5;j++){const f=.34+j*.15,side=j%2?1:-1;const lx=cx+dx*f+nx*13*side,ly=sy+dy*f+ny*13*side;const on=j<ramas[k];g+=`<circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="${on?8:6.5}" data-tono="${tone(k)}" class="hoja ${on?'on':''}"/>`}g+=`<text x="${ex}" y="${ey-16}" text-anchor="middle" class="rama-tx">${k} · ${ramas[k]}/5</text>`});return `<svg viewBox="-34 0 408 270" class="arbol" role="img" aria-label="Árbol de aprendizaje: ${keys.map(k=>k+' '+ramas[k]+' de 5 logros').join(', ')}">${g}</svg>`}
function progreso(v){const W=300,H=110,max=Math.max(...v)+8,min=Math.min(...v)-8;const pts=v.map((y,i)=>[12+i*(W-24)/(v.length-1),H-14-(y-min)/(max-min)*(H-30)]);const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');return `<svg viewBox="0 0 ${W} ${H}" class="curva" role="img" aria-label="Su avance en las últimas seis semanas: ${v[v.length-1]>v[0]?'sube':'se mantiene'}"><path d="${d}" class="linea"/>${pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===pts.length-1?5:3}" class="pto ${i===pts.length-1?'ult':''}"/>`).join('')}</svg><div class="curva-ejes"><span>Hace 6 semanas</span><span>Esta semana</span></div>`}
function fichaPage(){const p=pupil(),f=ficha(p.id),pr=profe(p.subject),st=status(p),mt=MEETINGS.find(m=>m.student===p.id&&!m.done);return `<div class="ficha" data-tono="${tone(p.subject)}"><button class="link back" data-page="group">${icon('back')}Grupo A</button><section class="ficha-head"><div class="anillo" aria-hidden="true"><span>${p.initial}</span></div><div class="ficha-id"><h1 id="page-title" tabindex="-1">${p.name}</h1><dl class="datos"><div><dt>Edad</dt><dd>${f.edad} años</dd></div><div><dt>Cumpleaños</dt><dd>${f.cumple}</dd></div><div><dt>Familia</dt><dd>${f.familia}</dd></div></dl><div class="split" style="flex-wrap:wrap;margin-top:12px">${chip(p.subject)}${pr?`<span class="project-profes">${pj(pr.p,'xs')}con ${pr.n}</span>`:''}<span class="tag ${/acompañamiento|Revisar|Pendiente|atención/.test(st)?'amber':/realizada|revisión/.test(st)?'green':''}">${st}</span></div></div><div class="actions ficha-actions"><button class="btn" data-student="${p.id}">Ver recorrido</button><button class="ib" data-meeting-for="${p.id}" aria-label="${mt?'Ver reunión':'Agendar reunión'}" data-tip="${mt?'Ver reunión':'Agendar reunión'}">${icon(mt?'meetings':'calplus')}</button></div></section><div class="ficha-grid"><div class="ficha-main"><section class="card"><h2>Intereses</h2><p class="hobbies"><span>Hobbies</span>${esc(f.hobbies)}</p>${bars(f.int)}</section><section class="card arbol-card"><div class="row"><h2>Aprendizaje</h2><button class="ib" data-arbol="${p.id}" aria-label="Ver árbol completo" data-tip="Ver árbol completo">${icon('expand')}</button></div><button class="arbol-mini" data-arbol="${p.id}" aria-label="Abrir el árbol de aprendizaje">${arbol(p.id,false)}</button>${leyenda()}</section><section class="card"><h2>Amigos principales</h2><div class="amigos">${f.amigos.map(a=>{const q=pupil(a);return `<button class="amigo" data-ficha="${q.id}">${avatar(q)}<span>${q.name}</span></button>`}).join('')}</div></section><section class="card"><h2>Su progreso</h2>${progreso(f.prog)}</section></div><aside class="ficha-side"><section class="card"><h2>Estado sensorial</h2>${f.sensor?`<p class="eyebrow" style="margin:10px 0 4px">Hoy</p><dl class="datos col"><div><dt>Ánimo</dt><dd>${f.sensor.animo}</dd></div><div><dt>Sueño</dt><dd>${f.sensor.sueno}</dd></div></dl><div class="guio-says">${pj('guio','s','habla')}<p>“${esc(f.sensor.dicho)}”</p></div>${f.sensor.malo?'<p class="callout amber">Hoy puede necesitar ir más despacio.</p>':''}`:'<p class="muted" style="margin-top:10px">Todavía no hizo el check-in de hoy.</p>'}</section><section class="card restringido"><div class="row"><h2>Información médica</h2><span class="ib quiet" tabindex="0" aria-label="Solo la carga la familia o el equipo de orientación" data-tip="Solo familia u orientación">${icon('lock')}</span></div><p class="tag" style="margin-top:12px">Sin datos</p></section>${mt?`<section class="card"><h2>Próxima reunión</h2><p class="eyebrow" style="margin:10px 0 4px">${mt.when}</p><p>${esc(mt.why)}</p><button class="ib" style="margin-top:10px" data-meeting="${mt.id}" aria-label="Preparar reunión" data-tip="Preparar reunión">${icon('arrow')}</button></section>`:''}</aside></div></div>`}
function meetings(){const list=MEETINGS.filter(m=>!m.done),past=MEETINGS.filter(m=>m.done);const m=MEETINGS.find(x=>x.id===meetingId)||list[0];const sp=m.student&&pupil(m.student);const saved=(state.meetingNotes||{})[m.id];return title('Reuniones','Encuentros con familias y con el equipo. Miseño prepara los temas; vos decidís qué hablar.',`<button class="ib" data-action="new-meeting" aria-label="Agendar reunión" data-tip="Agendar reunión">${icon('calplus')}</button>`)+`<div class="meet-layout"><div class="meet-list"><h2 class="eyebrow">Próximas</h2>${list.map(x=>meetCard(x)).join('')}<h2 class="eyebrow" style="margin-top:18px">Pasadas</h2>${past.map(x=>meetCard(x)).join('')}</div><section class="card meet-detail" ${sp?`data-tono="${tone(sp.subject)}"`:''} aria-labelledby="meet-title"><div class="meet-top"><div><p class="eyebrow">${m.when}</p><h2 id="meet-title">${m.who}</h2>${sp?`<div class="split" style="margin-top:10px">${avatar(sp)}${chip(sp.subject)}<button class="ib" data-ficha="${sp.id}" aria-label="Ver ficha" data-tip="Ver ficha">${icon('user')}</button></div>`:''}</div>${m.done||saved?'<span class="tag green">Acuerdos registrados</span>':'<span class="tag">Por hacer</span>'}</div><p class="meet-why">${esc(m.why)}</p><div class="meet-agenda"><div class="split">${pj('guio','s','piensa')}<h3>Temas</h3></div><ol>${m.agenda.map(a=>`<li>${esc(a)}</li>`).join('')}</ol></div>${m.done?`<h3 style="margin-top:22px">Acuerdos</h3><p class="note-text" style="margin-top:8px">${esc(m.done)}</p>`:`<form id="meeting-form" data-id="${m.id}"><label for="meeting-notes">Acuerdos de la reunión</label><textarea id="meeting-notes" maxlength="2000" placeholder="Qué se acordó, quién hace qué y cuándo lo revisamos.">${esc(saved||'')}</textarea><div id="meeting-error" class="error" role="alert"></div><div class="actions"><button class="btn" type="submit">Guardar acuerdos</button></div></form>`}</section></div>`}
function meetCard(x){const sp=x.student&&pupil(x.student);const saved=(state.meetingNotes||{})[x.id];return `<button class="meet-card" data-meeting="${x.id}" aria-pressed="${x.id===meetingId}" ${sp?`data-tono="${tone(sp.subject)}"`:''}><span class="fecha"><b>${x.day}</b>${x.mon}</span><span><strong>${x.who}</strong><span class="small muted">${x.when.split(' · ')[1]} · ${x.kind==='equipo'?'Equipo':'Familia'}</span>${x.done||saved?'<span class="tag green">Acuerdos</span>':''}</span></button>`}

function profilePanel(p){const pr=profe(p.subject);return `<section class="card profile-panel" data-tono="${tone(p.subject)}"><div class="row"><div class="split">${avatar(p)}<h2 id="profile-heading" tabindex="-1">${p.name}</h2></div><button class="close" data-action="close-profile" aria-label="Cerrar ficha del alumno">×</button></div><div class="profile-hero">${pr?pj(pr.p,'m'):''}<div><strong>${p.subject}</strong><p>${pr?'Con '+pr.n+' · ':''}${p.activity}</p></div></div><dl><dt>Nombre de uso</dt><dd>${p.short}</dd><dt>Grupo</dt><dd>Grupo A · Primaria</dd><dt>Estado</dt><dd>${status(p)}</dd><dt>Datos personales</dt><dd class="muted">Sin cargar</dd></dl><div class="actions"><button class="btn" data-student="${p.id}">Ver recorrido</button><button class="ib" data-history="${p.id}" aria-label="Ver historial" data-tip="Ver historial">${icon('history')}</button></div></section>`}

function situations(){const items=[{id:'tomi',title:'Dificultad persistente · Revisar adaptación',desc:'Contrastar las fuentes utilizadas para personalizar sus actividades.',state:state.review?'review':state.started?'active':'pending',label:state.review?'En revisión':state.started?'En atención':'Pendiente'},{id:'joaquin',title:'El tutor solicita acompañamiento',desc:'Necesita apoyo con fracciones después de varios métodos de explicación.',state:state.academic?'done':'pending',label:state.academic?'Intervención realizada':'Pendiente'}].filter(i=>situationFilter==='all'||i.state===situationFilter);return title('Situaciones para acompañar','Revisá el contexto antes de decidir cómo intervenir.')+`<div class="toolbar"><label for="situation-filter" style="margin:0">Mostrar</label><select id="situation-filter"><option value="all">Todas las situaciones</option><option value="pending">Pendientes</option><option value="active">En atención</option><option value="review">En revisión</option><option value="done">Intervenciones realizadas</option></select></div><section class="card"><h2>Seguimiento del grupo</h2>${items.map(i=>`<article class="situation"><div><span class="tag ${i.state==='done'?'green':'amber'}">${i.label}</span><h3>${pupil(i.id).name} · ${i.title}</h3><p class="muted">${i.desc}</p><p class="small muted">10 nov · Registro de Miseño</p></div><button class="btn secondary" data-student="${i.id}">Abrir situación</button></article>`).join('')||'<p class="empty">No hay situaciones con este estado.</p>'}</section>`}
function sourcePanel(){return `<section class="card"><div class="row"><h2>Información utilizada</h2><span class="tag amber">Versiones diferentes</span></div><div class="evidence"><article class="source-card family"><span class="tag green">Familia · Declaración</span><blockquote>${esc(learningData.tomi.family)}</blockquote><p class="small">2 nov · Aporte familiar<br>Contexto: intereses en casa.</p></article><article class="source-card"><span class="tag lilac">Alumno · Declaración explícita</span><blockquote>${esc(learningData.tomi.child)}</blockquote><p class="small">${esc(learningData.tomi.context)}<br>Contexto: actividad de fracciones.</p></article></div><div class="callout">Ninguna versión reemplaza a la otra. La fecha y el contexto pueden ayudar a entender la diferencia.</div><h3 style="margin-top:24px">Cómo lo está interpretando Miseño</h3><div class="guio-says">${pj('guio','s','piensa')}<p>“Usé situaciones de fútbol a partir del interés que declaró la familia. Registré necesidad de apoyo en varias actividades”.</p></div><div class="callout amber"><strong>Explicación incompleta</strong><br>No está disponible cómo se ponderó la declaración posterior del alumno ni por qué se mantuvo esa temática. La causa de la dificultad sigue abierta.</div></section>`}
function activities(){const tomi=student==='tomi';return `<section class="card"><h2>Actividades y apoyos utilizados</h2><p class="muted" style="margin-top:10px">${tomi?'La temática utilizada puede ser un aspecto a revisar. Estos resultados no explican por sí solos la dificultad.':'El tutor probó apoyos distintos y solicitó intervención presencial.'}</p><div class="table-wrap"><table><thead><tr><th>Actividad</th><th>Registro</th><th>Apoyos utilizados</th></tr></thead><tbody><tr><td>10 nov · Fracciones<br>Un tercio de 90 minutos</td><td>Respondió 45; luego pidió ayuda.</td><td>Pista verbal y barra visual del partido.</td></tr><tr><td>9 nov · Repartir goles<br>Tres cuartos de 12</td><td>Necesitó pasos guiados.</td><td>Grupos visuales y descomposición.</td></tr><tr><td>8 nov · Partes iguales</td><td>Completó con acompañamiento.</td><td>Objetos y explicación del tutor.</td></tr></tbody></table></div><div class="callout">Estos registros no constituyen un diagnóstico ni una comparación con otros alumnos.</div></section>`}
function history(){const notes=state.notes.filter(n=>n.student===student);return `<section class="card"><h2>Historial de miradas e intervenciones</h2><div class="timeline">${notes.map(n=>`<article class="event"><span class="tag blue">Docente · Clara López</span><p class="small muted">${esc(new Date(n.date).toLocaleString('es-AR'))}</p><h3 style="margin-top:8px">${esc(n.action)}</h3><p class="note-text">${esc(n.text)}</p><p class="small muted">Contexto: ${esc(n.context)}<br>Seguimiento: ${esc(n.followup)}</p><p class="small muted">Evidencias asociadas: ${esc(n.evidence)}</p></article>`).join('')}${student==='tomi'&&state.review?'<article class="event"><span class="tag amber">Revisión de adaptación</span><h3 style="margin-top:8px">Solicitud de revisión registrada</h3><p class="muted">La discrepancia permanece abierta. El plan actual no se modificó.</p></article>':''}${student==='tomi'?'<article class="event"><span class="tag lilac">Alumno · 9 nov</span><p>Expresó que no le gusta la temática de fútbol durante una actividad.</p></article><article class="event"><span class="tag green">Familia · 2 nov</span><p>Compartió fútbol y autitos como intereses. Se conserva el aporte original.</p></article>':'<article class="event"><span class="tag">Miseño · 10 nov</span><p>Se abrió la ficha con registros de su actividad escolar.</p></article>'}</div></section>`}
function detailLegacy(){const p=pupil(),isT=student==='tomi',isJ=student==='joaquin';let content=tab==='history'?history():tab==='activities'?activities():isT?sourcePanel():isJ?activities():`<section class="card"><h2>Su actividad actual</h2><p style="margin-top:15px">${p.activity}</p><div class="callout">${p.id==='mateo'?'Sin nuevos registros. La lectura de la pulsera no está disponible; no se infiere su estado ni el acompañamiento familiar.':'No hay una situación pendiente de revisión.'}</div><h3 style="margin-top:24px">Contexto de la familia</h3><p class="muted" style="margin-top:8px">Sin nuevos aportes familiares.</p></section>`;return `<div class="breadcrumb"><button class="link" data-page="group">Mi grupo</button><span class="muted">/</span>${p.name}</div>`+title(isT?'Entender lo que le pasa a Tomi':`Una mirada a ${p.name}`,isT?'Dificultad persistente · Revisar la adaptación de sus actividades.':p.activity,`<button class="btn" data-action="note">Registrar intervención</button>`)+`<div class="tabs" role="tablist" aria-label="Detalle del alumno">${[['activities','Actividades'],['evidence','Contexto y fuentes'],['interventions','Intervenciones']].map(([id,t])=>`<button role="tab" id="tab-${id}" aria-controls="detail-panel" aria-selected="${tab===id}" tabindex="${tab===id?0:-1}" data-tab="${id}">${t}</button>`).join('')}</div><div class="grid"><div id="detail-panel" role="tabpanel" aria-labelledby="tab-${tab}">${content}</div><aside class="stack"><section class="card"><div class="split">${avatar(p)}<div><h3>${p.name}</h3><p class="small muted">Grupo A · Primaria</p></div></div><div class="status-grid"><div><strong class="small">${isT?'Discrepancia':'Situación'}</strong><span class="tag amber">${status(p)}</span></div><div><strong class="small">Intervención docente</strong><span class="muted small">${state.notes.some(n=>n.student===student)?'Registrada · Ver historial':'Sin registrar'}</span></div><div><strong class="small">Aprendizaje</strong><span class="muted small">${isT||isJ?'Dificultad en seguimiento':'Actividad en seguimiento'}</span></div></div>${isT?`<button class="btn secondary" data-action="start" ${state.started||state.review?'disabled':''}>${state.review?'Discrepancia en revisión':state.started?'Situación en atención':'Comenzar atención'}</button><div class="actions"><button class="btn" data-action="review" ${state.review?'disabled':''}>${state.review?'Revisión registrada':'Solicitar revisión'}</button></div><p class="small muted" style="margin-top:14px">La solicitud queda registrada. El plan permanece sin cambios.</p>`:isJ?'':''}</section><section class="card glass"><h3>Intervención docente</h3></section></aside></div>`}
function pathsLegacy(){return title('Recorridos de aprendizaje','Temas, apoyos y cambios del plan, con contexto individual.')+`<div class="toolbar"><label for="path-student" style="margin:0">Alumno</label><select id="path-student">${pupils.map(p=>`<option value="${p.id}" ${p.id===student?'selected':''}>${p.name}</option>`).join('')}</select></div><div class="grid"><section class="card"><div class="row"><h2>El recorrido de ${pupil().name}</h2><span class="tag">Vista por temas</span></div>${[['Matemática','Fracciones','Apoyo visual y pasos guiados',60],['Lengua','Comprensión de cuentos','Lectura acompañada',40],['Ciencias','Las plantas','Proyecto grupal de huerta',50],['Historia','La colonia','Exploración guiada',35],['Música','Flauta','En pausa en el plan',25]].map(([name,topic,desc,n])=>`<article class="subject"><div class="avatar" style="background:${name==='Música'?'#e9eceb':'#e8edf7'}">${name==='Matemática'?'½':name==='Ciencias'?'✿':name[0]}</div><div><h3>${name} · ${topic}</h3><p class="small muted">${desc}</p></div><div class="track"><span class="small muted">${name==='Música'?'En pausa':n+'% del tema'}</span><div class="bar" role="progressbar" aria-label="Avance en ${name}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${n}"><i style="width:${n}%"></i></div></div></article>`).join('')}</section><aside class="stack"><section class="card alert"><span class="tag amber">Cambio del plan</span><h2 style="margin-top:15px">Más bloques de Matemática</h2><p class="muted" style="margin-top:12px">El plan suma dos bloques semanales y deja Música en pausa.</p><button class="btn secondary" data-action="plan" style="margin-top:20px">Consultar el cambio</button></section><section class="card"><h3>Lo que podés hacer</h3></section></aside></div>`}

function render(focus=false){if(page==='detail'||page==='situations')page='paths';if(page==='students')page='group';document.body.classList.toggle('launch-mode',page==='launch');nav();$('#main').innerHTML=({launch,group,paths,projects,meetings,ficha:fichaPage,arbol:arbolPage}[page])();if(page==='paths'){const c=$('.pupil-carousel');if(c){c.scrollLeft=carouselPosition;c.onscroll=()=>{carouselPosition=c.scrollLeft}}}if(page==='paths'&&$('#situation-filter'))$('#situation-filter').value=situationFilter;if(focus){$('#page-title').focus();window.scrollTo(0,0)}}

function modal(title,body){$('#dialog').innerHTML=`<div class="row"><h2 id="dialog-title">${title}</h2><button class="close" data-action="close" aria-label="Cerrar">×</button></div>${body}`;$('#dialog').showModal()}
function note(){const p=pupil();modal(`Intervención · ${p.name}`,`<form id="note-form"><label for="observation">Tu observación</label><textarea id="observation" required maxlength="2500" aria-describedby="note-error" placeholder="Por ejemplo: conversamos sobre sus intereses. Prefiere problemas con plantas y animales."></textarea><div id="note-error" class="error" role="alert"></div><label for="context">Contexto</label><select id="context"><option>Conversación presencial con el alumno</option><option>Observación durante la actividad</option><option>Conversación con la familia</option><option>Actividad grupal</option></select><label for="action">Acción realizada</label><select id="action"><option>Conversé con el alumno</option><option>Acompañé el ejercicio presencialmente</option><option>Contrasté los registros disponibles</option><option>Observé la actividad grupal</option></select><label for="followup">Seguimiento</label><select id="followup"><option>Continuar observando</option><option>Revisar adaptación con el equipo pedagógico</option><option>Retomar conversación con la familia</option></select><div class="callout">Evidencias asociadas: ${student==='tomi'?'aporte familiar del 2 nov, declaración del alumno del 9 nov y actividades del 8 al 10 nov.':'registros de actividad del alumno.'}</div><label class="check"><input type="checkbox" id="attended" checked><span>Registrar la intervención como realizada. La dificultad continúa en seguimiento.</span></label><div class="actions"><button class="btn" type="submit">Guardar intervención</button><button class="btn ghost" type="button" data-action="close">Cancelar</button></div></form>`)}
const actions={close:()=>$('#dialog').close(),note,start:()=>{state.started=true;persist();render();toast('Situación en atención. Los registros originales se conservan.')},review:()=>modal('Revisar la adaptación de Tomi',`<p style="margin-top:18px">Se registrará una solicitud para contrastar los intereses utilizados y revisar la propuesta de actividades.</p><div class="callout amber">La discrepancia quedará “En revisión”. El plan actual permanece igual.</div><p class="muted small" style="margin-top:15px">Responsable y plazo de resolución: pendientes de asignación.</p><div class="actions"><button class="btn" data-action="confirm-review">Registrar solicitud</button><button class="btn ghost" data-action="close">Volver</button></div>`),'confirm-review':()=>{state.review=true;state.started=true;const ok=persist();$('#dialog').close();render();if(ok)toast('Revisión registrada. El plan no cambió.')},plan:()=>modal('Revisión del cambio de plan',`<p style="margin-top:18px">${pupil().name} · Matemática suma dos bloques y Música queda en pausa.</p><div class="callout"><strong>Explicación de Miseño</strong><p>“Se eligió el mejor camino según cómo aprende el alumno”.</p></div><p class="muted" style="margin-top:15px">No se detalla qué datos justificaron este cambio. La autoridad para aprobar o suspenderlo sigue pendiente de definición.</p><div class="actions"><button class="btn" data-action="plan-review" ${state.planReview?'disabled':''}>${state.planReview?'Solicitud registrada':'Registrar pedido de revisión'}</button></div>`),'plan-review':()=>{state.planReview=true;const ok=persist();$('#dialog').close();if(ok)toast('Pedido de revisión del plan guardado.')},project:()=>modal('Organizar la huerta',`<p style="margin-top:18px">Grupo propuesto: Joaquín, Sofía y Bruno.</p><ul><li>Reunir al grupo y preparar tierra, semillas y recipientes.</li><li>Conversar cómo se repartirán las tareas.</li><li>Observar la participación y los acuerdos entre compañeros.</li></ul><div class="actions"><button class="btn" data-action="project-note">Registrar observación de Joaquín</button></div>`),'project-note':()=>{$('#dialog').close();student='joaquin';note();$('#context').value='Actividad grupal';$('#action').value='Observé la actividad grupal'},reset:()=>modal('Reiniciar el ejemplo',`<p style="margin-top:18px">Se eliminarán únicamente las intervenciones y solicitudes guardadas por este prototipo de Miseño en este navegador.</p><div class="actions"><button class="ib" data-action="confirm-reset" aria-label="Reiniciar demo" data-tip="Reiniciar demo">${icon('reset')}</button><button class="btn ghost" data-action="close">Cancelar</button></div>`),'confirm-reset':()=>{state=initial();persist();$('#dialog').close();page='group';query='';groupFilter='all';situationFilter='all';render(true);toast('Demo reiniciada.') }};

ron la misma regla al mismo tiempo. No quedó acordado cómo compartir el material.',status:'followup',recommendation:'Reunir a los representantes de ambos equipos, acordar un orden de uso y verificarlo al cierre.'}];}

function followProjectPanel(){const team=chosenTeam(),events=state.projectEvents.filter(e=>e.project===projectId&&e.studentIds.some(id=>team.members.includes(id)));return `<div class="project-columns"><aside class="card"><h2>Seleccionar equipo</h2>${projectRoster()}</aside><section class="card"><div class="row"><h2>Seguimiento · ${esc(team.name)}</h2><button class="ib" data-project-action="observe" aria-label="Registrar observación" data-tip="Registrar observación">${icon('plus')}</button></div><p class="muted" style="margin-top:12px">${esc(memberNames(team.members))}</p><div class="project-checkpoints"><div><strong>Participación</strong></div><div><strong>Organización</strong></div><div><strong>Aprendizaje</strong></div></div><div class="timeline">${events.length?events.map(projectEventCard).join(''):'<p class="empty">Todavía no hay observaciones registradas para este equipo.</p>'}</div></section></div>`}

function recordProjectEvent(data){ensureProjects();const event={id:'project-event-'+Date.now()+'-'+state.projectEvents.length,project:projectId,date:new Date().toISOString(),...data};event.studentIds=[...new Set(event.studentIds)];state.projectEvents.unshift(event);persist();return event}
function applyTeamEdit(id,name,members,criterion){const groups=projectTeams();name=name.trim();if(!name)return 'Escribí un nombre para el grupo.';if(members.length<2||members.length>6)return 'Elegí entre 2 y 6 integrantes.';if(new Set(members).size!==members.length||members.some(m=>!pupils.some(p=>p.id===m)))return 'Revisá la selección de alumnos.';const target=groups.find(t=>t.id===id);if(groups.some(t=>t.id!==id&&t.name.toLowerCase()===name.toLowerCase()))return 'Ya hay un grupo con ese nombre.';const others=groups.filter(t=>t.id!==id).map(t=>({...t,members:t.members.filter(m=>!members.includes(m))}));if(others.some(t=>t.members.length===1))return 'El cambio dejaría un equipo con un solo alumno. Elegí otra combinación o reorganizá los grupos.';const affected=[...(target?.members||[]),...members],newId=id||'team-'+Date.now();state.projectGroups[projectId]=[...others.filter(t=>t.members.length),{id:newId,name,members:[...members],criterion:criterion.trim()||'Agrupamiento definido por la docente.'}];selectedTeam=newId;recordProjectEvent({type:target?'Cambio de integrantes':'Creación de grupo',studentIds:affected,text:`${name}: ${memberNames(members)}. ${target?'Equipo anterior: '+memberNames(target.members)+'. ':''}Criterio: ${criterion.trim()||'Definición docente.'}`,followup:'Revisar participación y acuerdos durante la próxima actividad.'});return ''}
function editTeamForm(create=false){const team=create?null:chosenTeam();modal(create?'Crear grupo':'Editar · '+team.name,`<form id="team-edit-form" data-team-id="${team?.id||''}"><label for="team-name">Nombre del grupo</label><input id="team-name" maxlength="50" required value="${esc(team?.name||'')}"><label>Integrantes · Entre 2 y 6</label><div class="member-picker">${pupils.map(p=>`<label class="check"><input type="checkbox" name="team-member" value="${p.id}" ${team?.members.includes(p.id)?'checked':''}><span>${p.name}<small class="muted">${esc(projectTeams().find(t=>t.members.includes(p.id))?.name||'Sin grupo')}</small></span></label>`).join('')}</div><label for="team-criterion">Criterio de organización</label><textarea id="team-criterion" maxlength="1000">${esc(team?.criterion||'')}</textarea><div id="team-error" class="error" role="alert"></div><div class="actions"><button class="btn" type="submit">Confirmar integrantes</button><button class="btn ghost" type="button" data-action="close">Cancelar</button></div></form>`)}

function projectObservation(incidentId=null){const incident=state.projectIncidents.find(i=>i.id===incidentId),team=chosenTeam();modal(incident?'Intervención de convivencia':'Observación · '+team.name,`<p class="muted" style="margin-top:12px">${esc(memberNames(incident?incident.studentIds:team.members))}</p>${incident?`<div class="callout"><strong>${esc(incident.title)}</strong><p>${esc(incident.description)}</p><p><strong>Propuesta de Miseño:</strong> ${esc(incident.recommendation)}</p></div>`:''}<form id="project-observation-form" data-incident-id="${incidentId||''}"><label for="project-observation">${incident?'Qué hiciste y qué acuerdos se alcanzaron':'Qué observaste y qué apoyo diste'}</label><textarea id="project-observation" required maxlength="2000" placeholder="Describí lo observado sin atribuir intenciones."></textarea><label for="project-followup">Próximo seguimiento</label><textarea id="project-followup" required maxlength="1000" placeholder="Cuándo lo retomarás y qué vas a observar."></textarea>${incident?`<label for="incident-status">Estado de la situación</label><select id="incident-status"><option value="followup" selected>En seguimiento</option><option value="open">Pendiente de intervención</option><option value="resolved">Cerrar con acuerdos registrados</option></select>`:''}<div id="project-observation-error" class="error" role="alert"></div><div class="actions"><button class="btn" type="submit">Guardar intervención</button><button class="btn ghost" type="button" data-action="close">Cancelar</button></div></form>`)}
function saveProjectObservation(text,followup,incidentId=null,status='followup'){text=text.trim();followup=followup.trim();if(!text||!followup)return 'Completá la observación y el próximo seguimiento.';const incident=state.projectIncidents.find(i=>i.id===incidentId);if(incidentId&&!incident)return 'La situación no está disponible.';if(incident&&!Object.keys(incidentLabels).includes(status))return 'Elegí un estado válido.';recordProjectEvent({type:incident?'Intervención de convivencia':'Observación de equipo',text,followup,studentIds:incident?incident.studentIds:chosenTeam().members,incidentId:incident?.id||null,status:incident?status:null});if(incident){incident.status=status;persist()}return ''}

function saveIncident(title,text,ids){title=title.trim();text=text.trim();if(!title||!text||ids.length<2)return 'Completá el título, lo ocurrido y al menos dos alumnos.';if(ids.some(id=>!pupils.some(p=>p.id===id)))return 'Revisá los alumnos seleccionados.';const incident={id:'incident-'+Date.now(),project:projectId,title,description:text,studentIds:[...new Set(ids)],date:new Date().toLocaleString('es-AR'),source:'Docente · Clara López',status:'open',recommendation:'Escuchar a las personas involucradas por separado si hace falta, reconstruir lo ocurrido y acordar una acción concreta con seguimiento.'};state.projectIncidents.unshift(incident);recordProjectEvent({type:'Situación de convivencia registrada',studentIds:incident.studentIds,text:title+': '+text,followup:'Preparar una intervención docente.',incidentId:incident.id});return ''}

document.addEventListener('submit',e=>{const f=e.target;if(!['team-edit-form','project-observation-form','new-incident-form'].includes(f.id))return;e.preventDefault();let error='';if(f.id==='team-edit-form')error=applyTeamEdit(f.dataset.teamId||null,$('#team-name').value,[...f.querySelectorAll('[name="team-member"]:checked')].map(x=>x.value),$('#team-criterion').value);if(f.id==='project-observation-form')error=saveProjectObservation($('#project-observation').value,$('#project-followup').value,f.dataset.incidentId||null,$('#incident-status')?.value||'followup');if(f.id==='new-incident-form')error=saveIncident($('#incident-title').value,$('#incident-description').value,[...f.querySelectorAll('[name="incident-member"]:checked')].map(x=>x.value));if(error){$(f.id==='team-edit-form'?'#team-error':f.id==='project-observation-form'?'#project-observation-error':'#incident-error').textContent=error;return}$('#dialog').close();updateProjectPanel();toast('Guardado en el proyecto y vinculado a los alumnos.')});

render();
setTimeout(()=>{const splash=$('#splash');splash.hidden=true;},1400);
</script>
</body>
</html>
