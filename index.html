<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miseño · Espacio docente</title>
<meta name="description" content="Espacio docente de Miseño: grupo, situaciones, evidencias e intervenciones pedagógicas.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Miseño · Espacio docente
   Mismo lenguaje que la app del alumno (scan-alumno): IBM Plex Sans/Mono,
   tono "miseno" como base, un tono por materia y los mismos personajes. */
:root{
  /* Tono base de Miseño (igual a data-tono="miseno" en la app del alumno) */
  --fondo:#E8F6FC;--suave:#BEE6F6;--nodo:#36BDE6;--boton:#0B7DA3;--texto:#08374A;
  --blanco:#FFFFFF;--muted:#44687A;--linea:#D6EBF4;
  --ok-bg:#E1F5EE;--ok-tx:#085041;--casi-bg:#FAEEDA;--casi-tx:#633806;--err-bg:#FDEDEF;--err-tx:#9E2234;
  --alumno-bg:#F2EDFF;--alumno-tx:#3D1F80;
  --sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r-tarjeta:24px;--r-control:16px;
  --t-entra:240ms;
  /* tono de materia por defecto = Miseño */
  --s-fondo:var(--fondo);--s-suave:var(--suave);--s-nodo:var(--nodo);--s-boton:var(--boton);--s-texto:var(--texto);
}
/* Tonos por materia: mismos valores que la app del alumno */
[data-tono="mate"]{--s-fondo:#FDEDEF;--s-suave:#F7C6CD;--s-nodo:#E4566A;--s-boton:#B42A3E;--s-texto:#4D0F19}
[data-tono="lengua"]{--s-fondo:#FEF1E6;--s-suave:#F9D0AE;--s-nodo:#EF8638;--s-boton:#A64E0E;--s-texto:#4A2309}
[data-tono="recreo"]{--s-fondo:#FDF7DE;--s-suave:#F4E29C;--s-nodo:#E2B41C;--s-boton:#7E6000;--s-texto:#3B2E00}
[data-tono="dibujo"]{--s-fondo:#F2EDFF;--s-suave:#D9CBFF;--s-nodo:#8A4FFF;--s-boton:#6131D6;--s-texto:#25104F}
[data-tono="gastro"]{--s-fondo:#FFEEF5;--s-suave:#FFC7DD;--s-nodo:#FF5FA2;--s-boton:#C42A6C;--s-texto:#4D0C29}
[data-tono="huerta"]{--s-fondo:#F2F8E4;--s-suave:#D5E9AE;--s-nodo:#8DBF3F;--s-boton:#4D7A12;--s-texto:#1F3307}
[data-tono="ciencias"]{--s-fondo:#EBF7EC;--s-suave:#C0E6C8;--s-nodo:#42BE62;--s-boton:#1D7D3A;--s-texto:#0D3B1C}
/* Materias que todavía no tienen profe en la app del alumno */
[data-tono="neutro"]{--s-fondo:#EEF3F5;--s-suave:#D3DEE3;--s-nodo:#7C939E;--s-boton:#3E5A66;--s-texto:#1E3640}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:16px/1.55 var(--sans);color:var(--texto);background:var(--fondo);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;min-height:44px}
:focus-visible{outline:3px solid var(--boton);outline-offset:3px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--sans);font-weight:600;line-height:1.2;letter-spacing:-.01em}
h1{font-size:32px}h2{font-size:22px}h3{font-size:18px}
p+p{margin-top:10px}
.muted{color:var(--muted)}
.small{font-size:14px}
.eyebrow{font-family:var(--mono);font-size:13px;color:var(--muted);margin-bottom:8px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:fixed;top:-100px;left:20px;z-index:100;padding:12px;background:#fff;border-radius:12px}
.skip:focus{top:10px}
svg.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* Marca y personajes */
.logo{width:34px;height:auto;display:block}
.pj{display:inline-block;object-fit:contain;flex-shrink:0}
.pj-xs{width:26px;height:26px}.pj-s{width:40px;height:40px}.pj-m{width:64px;height:64px}.pj-l{width:96px;height:96px}
.brand{display:flex;align-items:center;gap:10px;font:600 24px var(--sans);letter-spacing:-.01em}
.brand small{font:400 13px var(--mono);color:var(--muted);margin-left:4px}
.home-mark{background:transparent;border:0;padding:4px 6px;font:600 20px var(--sans);color:var(--texto);display:flex;gap:10px;align-items:center;border-radius:14px}

/* Estructura */
.app{display:block;min-height:100vh}
.sidebar{position:sticky;top:0;z-index:8;display:flex;align-items:center;gap:24px;padding:14px 32px;background:var(--fondo);border-bottom:1.5px solid var(--linea)}
.sidebar nav{display:flex;gap:6px;margin-left:auto;overflow:auto}
nav button{display:flex;align-items:center;gap:8px;white-space:nowrap;background:transparent;border:1.5px solid transparent;border-radius:99px;padding:8px 16px;color:var(--muted);font-weight:500}
nav button:hover{background:#ffffff80}
nav button[aria-current]{background:var(--blanco);border-color:var(--suave);color:var(--texto);font-weight:600}
.counter{font:500 12px var(--mono);background:var(--casi-bg);color:var(--casi-tx);border-radius:99px;padding:1px 8px}
.who{display:flex;align-items:center;gap:10px;font-size:14px}
.who .avatar{width:36px;height:36px;font-size:14px}
.brand-sub,.sidebar-bottom{display:none}
.workspace{max-width:1440px;margin:auto;padding:0 32px 32px;min-width:0}
.launch-mode .sidebar,.launch-mode .footer{display:none}

/* Encabezados */
.heading{display:flex;align-items:end;justify-content:space-between;gap:18px;margin:32px 0 24px}
.heading p{margin-top:8px;color:var(--muted)}

/* Botones: mismos que la app del alumno (píldoras) */
.btn{border:1.5px solid transparent;border-radius:99px;background:var(--boton);color:#fff;padding:10px 22px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;transition:background .18s,transform .1s,border-color .18s}
.btn:hover{background:#086887}
.btn:active{transform:scale(.98)}
.btn.secondary{background:var(--blanco);border-color:var(--suave);color:var(--texto)}
.btn.secondary:hover{background:var(--fondo)}
.btn.ghost{background:transparent;border-color:var(--suave);color:var(--texto);font-weight:500}
.btn.ghost:hover{background:#ffffff90}
.btn:disabled{cursor:default;opacity:.6;transform:none}
.link{border:0;background:transparent;color:var(--boton);padding:0;text-align:left;font-weight:600;min-height:32px}
.link:hover{text-decoration:underline}
.close{width:44px;height:44px;border:1.5px solid var(--suave);background:var(--blanco);border-radius:50%;font-size:22px;flex-shrink:0;line-height:1}

/* Superficies */
.card{padding:24px;background:var(--blanco);border-radius:var(--r-tarjeta);min-width:0}
.glass{background:#ffffffb0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.split{display:flex;align-items:center;gap:12px}
.stack{display:flex;flex-direction:column;gap:20px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.empty{text-align:center;padding:40px 15px;color:var(--muted)}
.footer{font:13px var(--mono);color:var(--muted);margin-top:32px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.footer button{font-size:13px}

/* Etiquetas: píldoras en mono, como los metadatos del alumno */
.tag{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border-radius:99px;background:var(--fondo);padding:3px 10px;color:var(--texto);font:500 12px/1.5 var(--mono)}
.tag.amber{background:var(--casi-bg);color:var(--casi-tx)}
.tag.green{background:var(--ok-bg);color:var(--ok-tx)}
.tag.lilac{background:var(--alumno-bg);color:var(--alumno-tx)}
.tag.blue{background:transparent;box-shadow:inset 0 0 0 1.5px var(--suave);color:var(--texto)}
.tag.miseno{background:var(--fondo);color:var(--texto);padding-left:4px}
.tag .pj{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:7px;border-radius:99px;padding:3px 10px 3px 8px;background:var(--s-fondo);color:var(--s-texto);font:500 13px var(--mono);white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--s-nodo);flex-shrink:0}
.chip.plain::before{display:none}

/* Avatares de alumnos: círculo en el tono de su materia, como la "J" del alumno */
.avatar{width:42px;height:42px;border-radius:50%;background:var(--s-suave);color:var(--s-texto);display:grid;place-items:center;font:600 16px var(--sans);flex-shrink:0}

/* Splash: igual a la apertura del alumno */
.splash{position:fixed;inset:0;z-index:200;background:var(--fondo);display:grid;place-items:center;transition:opacity .35s}
.splash[hidden]{display:none}
.splash-logo{display:flex;flex-direction:column;align-items:center;gap:6px;font:600 52px var(--sans);letter-spacing:-.02em}
.splash-logo img{width:150px;animation:pop .9s .1s cubic-bezier(.3,1.4,.5,1) both}
.splash-logo span{animation:sube .5s .45s ease both}
.splash-logo small{font:400 16px var(--mono);color:var(--muted);animation:sube .5s .6s ease both}
@keyframes pop{0%{opacity:0;transform:scale(.6) rotate(-6deg)}100%{opacity:1;transform:none}}
@keyframes sube{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes aparece{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Pantalla de inicio */
.launch-screen{max-width:980px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:28px;padding:40px 0}
.launch-screen>.brand{justify-content:center;font-size:40px;gap:14px}
.launch-screen>.brand .logo{width:58px}
.voz{display:grid;grid-template-columns:96px minmax(0,1fr);gap:18px;align-items:center;max-width:720px;margin:0 auto;width:100%}
.voz .quien{font:400 13px var(--mono);color:var(--muted)}
.voz p{font:400 22px/1.45 var(--mono);margin-top:4px}
.launch-screen h1#page-title{font:400 13px var(--mono);color:var(--muted)}
.launch-options{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.launch-options button{border:2px solid transparent;border-radius:var(--r-tarjeta);min-height:200px;background:var(--blanco);padding:32px 18px 24px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;gap:12px;transition:transform .2s,border-color .2s;animation:aparece .5s cubic-bezier(.2,.8,.3,1) both}
.launch-options button:nth-child(2){animation-delay:.06s}.launch-options button:nth-child(3){animation-delay:.12s}
.launch-options button:hover{transform:translateY(-4px);border-color:var(--suave)}
.launch-options strong{font:600 22px var(--sans)}
.launch-options .desc{font:400 13px var(--mono);color:var(--muted);text-align:center}
.launch-icon{width:60px;height:60px;border-radius:50%;background:var(--fondo);color:var(--boton);display:grid;place-items:center;position:relative}
.launch-icon svg{width:26px;height:26px}
.launch-icon .badge{position:absolute;top:-4px;right:-8px;font:600 12px var(--mono);background:var(--casi-bg);color:var(--casi-tx);border-radius:99px;padding:1px 7px}

/* Grupo: jornada + para acompañar + alumnos */
.group-shell{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;align-items:start}
.group-shell.has-profile{grid-template-columns:200px minmax(0,1fr) 340px}
.group-shell>*,.journey-layout>*,.project-columns>*,.grid>*{min-width:0}
.dia{position:sticky;top:96px}
.dia h2{font:400 13px var(--mono);color:var(--muted);margin-bottom:14px}
.dia ol{list-style:none;margin:0;padding:0}
.dia li{position:relative;padding:0 0 22px 30px}
.dia li::before{content:"";position:absolute;left:8px;top:18px;bottom:0;width:2px;background:var(--s-suave)}
.dia li:last-child::before{display:none}
.dia .pto{position:absolute;left:2px;top:5px;width:14px;height:14px;border-radius:50%;border:2px solid var(--s-nodo);background:var(--fondo)}
.dia li.actual .pto{background:var(--s-nodo);box-shadow:0 0 0 6px color-mix(in srgb,var(--s-nodo) 25%,transparent)}
.dia li.hecho .pto{background:var(--s-nodo)}
.dia strong{display:block;font-weight:600;line-height:1.3}
.dia li:not(.actual) strong{color:var(--muted);font-weight:500}
.dia .hora{display:block;font:13px/1.4 var(--mono);color:var(--muted)}
.dia .profes{display:flex;gap:2px;margin-top:6px}
.dia .nota{font:12px var(--mono);color:var(--muted);margin-top:4px}
.attention{margin-bottom:24px}
.attention-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(270px,100%),1fr));gap:14px;margin-top:14px}
.attention-item{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--blanco);border:2px solid transparent;border-radius:20px;padding:18px;transition:border-color .2s,transform .2s;animation:aparece .45s cubic-bezier(.2,.8,.3,1) both}
.attention-item:hover{border-color:var(--s-suave);transform:translateY(-2px)}
.attention-item .who-line{display:flex;align-items:center;gap:10px}
.attention-item h3{font-size:17px}
.attention-item .from{display:flex;align-items:center;gap:6px;font:12px var(--mono);color:var(--muted)}
.attention-item.done{opacity:.75}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.section-head h2{font-size:20px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{min-height:36px;border:1.5px solid var(--suave);border-radius:99px;background:transparent;padding:4px 12px;font:500 13px var(--mono);display:inline-flex;align-items:center;gap:6px}
.filters button::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--s-nodo)}
.filters button[data-filter="all"]::before{display:none}
.filters button[aria-pressed=true]{background:var(--s-fondo);border-color:var(--s-nodo);color:var(--s-texto)}
.student-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:12px;margin-top:4px}
.student{border:2px solid transparent;border-radius:20px;background:var(--blanco);padding:16px;text-align:left;min-width:0;display:flex;flex-direction:column;gap:10px;transition:border-color .2s,transform .2s}
.student:hover{border-color:var(--s-suave);transform:translateY(-2px)}
.student[aria-expanded=true]{border-color:var(--s-nodo)}
.student p{margin:0;color:var(--muted);font-size:14px}
.student .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;flex-wrap:wrap}
.profile-panel{position:sticky;top:96px}
.profile-panel h2{font-size:22px}
.profile-panel .actions{flex-direction:column}
.profile-hero{display:flex;align-items:center;gap:14px;padding:16px;margin:16px 0 4px;border-radius:18px;background:var(--s-fondo);color:var(--s-texto)}
.profile-hero p{font:13px var(--mono)}
dl{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;font-size:14px;margin:18px 0}
dt{color:var(--muted);font:13px var(--mono)}
dd{margin:0;overflow-wrap:anywhere}

/* Recorridos */
.carousel-row{display:flex;align-items:center;gap:10px;margin:24px 0 20px}
.carousel-row>.btn{width:44px;padding:0;flex:0 0 44px;min-height:44px;background:var(--blanco);border-color:transparent}
.pupil-carousel{display:flex;gap:10px;overflow-x:auto;padding:8px 24px;flex:1;min-width:0;scrollbar-width:none;overscroll-behavior-x:contain;mask-image:linear-gradient(to right,transparent,#000 28px,#000 calc(100% - 28px),transparent);-webkit-mask-image:linear-gradient(to right,transparent,#000 28px,#000 calc(100% - 28px),transparent)}
.pupil-carousel::-webkit-scrollbar{display:none}
.pupil-choice{display:flex;align-items:center;gap:10px;flex:0 0 auto;white-space:nowrap;border:2px solid transparent;border-radius:99px;background:#ffffffa0;padding:5px 16px 5px 5px;font-weight:500;transition:background .2s,border-color .2s}
.pupil-choice .avatar{width:34px;height:34px;font-size:14px}
.pupil-choice:hover{background:var(--blanco)}
.pupil-choice[aria-pressed=true]{background:var(--blanco);border-color:var(--s-nodo)}
.pupil-head{display:flex;align-items:center;gap:18px;padding:20px 24px;border-radius:var(--r-tarjeta);background:var(--s-fondo);color:var(--s-texto);margin-bottom:20px;animation:aparece .3s ease both}
.pupil-head .avatar{width:56px;height:56px;font-size:22px;background:var(--blanco)}
.pupil-head h1{font-size:28px}
.pupil-head .meta{font:13px var(--mono);margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pupil-head .actions{margin:0 0 0 auto}
.pupil-head .btn.secondary{background:var(--blanco);border-color:var(--s-suave);color:var(--s-texto)}
.journey-layout{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:24px;align-items:start}
.tabs{display:flex;gap:6px;margin-bottom:18px;overflow:auto;padding:4px}
.tabs button{white-space:nowrap;background:transparent;border:1.5px solid transparent;border-radius:99px;padding:8px 16px;color:var(--muted);font-weight:500}
.tabs button:hover{background:#ffffff80}
.tabs button[aria-selected=true],.project-tabs button[aria-pressed=true]{background:var(--blanco);border-color:var(--suave);color:var(--texto);font-weight:600}
.insight-capsule{padding:10px 10px 22px;position:sticky;top:96px}
.insight-pills{display:flex;gap:4px;border-radius:99px;background:var(--fondo);padding:4px}
.insight-pills button{display:flex;align-items:center;justify-content:center;gap:8px;flex:1;background:transparent;border:0;border-radius:99px;color:var(--muted);font-weight:500;min-height:40px}
.insight-pills button .pj{width:24px;height:24px}
.insight-pills button[aria-pressed=true]{background:var(--blanco);color:var(--texto);font-weight:600}
.capsule-content{padding:20px 12px 0;animation:aparece .25s ease both}
.capsule-content blockquote,.evidence blockquote{margin:14px 0;font:400 17px/1.5 var(--mono)}
.capsule-divider{border-top:1.5px dashed var(--linea);margin:22px 0}
.guio-says{display:flex;gap:10px;align-items:flex-start;margin-top:12px}
.guio-says p{font:15px/1.5 var(--mono)}
.chat-log{max-height:340px;overflow-y:auto;overscroll-behavior:contain;margin-top:16px;scrollbar-width:thin}
.chat-message{padding:12px 14px;border-radius:18px;background:var(--fondo);margin-bottom:10px;font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.chat-message strong{font:500 12px var(--mono);color:var(--muted)}
.chat-message p{margin-top:4px}
.chat-message.assistant p{font-family:var(--mono)}
.chat-message.user{background:var(--blanco);box-shadow:inset 0 0 0 1.5px var(--suave);margin-left:24px}
.chat-message.assistant{margin-right:12px}
.chat-suggestions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chat-suggestions button{font:500 12px var(--mono);border:1.5px solid var(--suave);border-radius:99px;padding:6px 12px;background:transparent;min-height:36px}
.capsule-content textarea{min-height:80px}
.next-activity{margin-bottom:20px;box-shadow:inset 0 0 0 2px var(--suave)}
.next-activity h2{font-size:22px;margin-top:10px}
.embedded-history{margin-top:20px}

/* Evidencias y fuentes */
.evidence{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.journey-layout .evidence{grid-template-columns:1fr}
.source-card{padding:20px;border-radius:20px;background:var(--alumno-bg);color:var(--alumno-tx)}
.source-card.family{background:var(--ok-bg);color:var(--ok-tx)}
.source-card .tag{background:var(--blanco)}
.source-card .small{opacity:.85;font-family:var(--mono);font-size:13px}
.callout{padding:14px 18px;border-radius:16px;background:var(--fondo);color:var(--texto);margin-top:18px;font-size:14px}
.callout.amber{background:var(--casi-bg);color:var(--casi-tx)}
.alert{box-shadow:inset 0 0 0 2px var(--casi-bg)}

/* Tablas */
.table-wrap{overflow-x:auto;margin-top:16px}
table{border-collapse:collapse;width:100%;text-align:left;font-size:14px}
td,th{padding:14px 12px;border-bottom:1.5px solid var(--linea);vertical-align:top}
th{font:400 12px var(--mono);color:var(--muted)}
td:first-child{font-variant-numeric:tabular-nums}
.table-wrap td .tag{margin-top:6px}

/* Línea de tiempo: nodos como el día del alumno */
.timeline{border-left:2px solid var(--suave);padding-left:24px;margin:22px 0 0 7px}
.event{position:relative;padding-bottom:24px}
.event:before{content:"";position:absolute;left:-33px;top:5px;width:14px;height:14px;background:var(--fondo);border:2px solid var(--nodo);border-radius:50%}
.event p{margin-top:5px;white-space:pre-wrap;overflow-wrap:anywhere}
.note-text{white-space:pre-wrap;overflow-wrap:anywhere}

/* Formularios */
input,select,textarea{border:1.5px solid var(--suave);border-radius:var(--r-control);background:var(--blanco);padding:10px 14px;min-height:46px}
input:focus,select:focus,textarea:focus{border-color:var(--boton)}
input[type=search]{min-width:240px;flex:1;border-radius:99px;padding-left:18px}
textarea{width:100%;min-height:110px;resize:vertical}
label{display:block;font-weight:600;font-size:14px;margin:18px 0 6px}
.check{display:flex;align-items:flex-start;gap:10px;font-weight:400}
.check input{min-height:22px;width:20px;height:20px;margin:0;flex-shrink:0;accent-color:var(--boton)}
.error{color:var(--err-tx);font-size:14px;margin-top:8px}
.error:empty{display:none}

/* Diálogo y aviso */
dialog{border:0;border-radius:28px;background:var(--blanco);color:var(--texto);padding:28px;width:min(660px,calc(100% - 30px));max-height:90vh;box-shadow:0 30px 90px -20px #08374a55}
dialog::backdrop{background:#08374a40;backdrop-filter:blur(4px)}
dialog[open]{animation:aparece .22s ease both}
.toast{position:fixed;bottom:24px;right:24px;z-index:20;max-width:calc(100vw - 48px);background:var(--texto);color:#fff;padding:14px 20px 14px 14px;border-radius:20px;display:flex;align-items:center;gap:10px;font-size:15px;animation:aparece .25s ease both}
.toast[hidden]{display:none}
.toast img{width:34px;height:34px}

/* Situaciones y estados */
.status-grid{display:grid;gap:12px;margin:18px 0}
.status-grid>div{padding-bottom:12px;border-bottom:1.5px solid var(--linea)}
.status-grid strong{display:block;margin-bottom:4px}
.situation{display:flex;gap:20px;align-items:center;justify-content:space-between;padding:20px 0;border-top:1.5px solid var(--linea)}
.situation h3{margin:8px 0}
.subject{display:flex;gap:16px;align-items:center;padding:16px 0;border-top:1.5px solid var(--linea)}
.subject .track{margin-left:auto;width:120px}
.bar{height:8px;background:var(--s-fondo);border-radius:99px;margin-top:6px}
.bar i{display:block;height:100%;background:var(--s-nodo);border-radius:99px}
.breadcrumb{margin:24px 0 0;display:flex;align-items:center;gap:9px;font-size:14px}

/* Proyectos */
.project-brief{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px;margin-bottom:18px}
.project-brief p{margin-top:8px}
.project-visual{height:140px;background:var(--s-fondo);border-radius:18px;display:grid;place-items:center;margin-bottom:20px}
.project-members{display:flex;gap:8px;margin:16px 0}
.project-columns{display:grid;grid-template-columns:290px minmax(0,1fr);gap:24px;align-items:start}
.project-roster{display:grid;gap:10px;margin-top:18px}
.team-select{display:flex;flex-direction:column;gap:4px;padding:14px 16px;text-align:left;border:2px solid transparent;background:var(--fondo);border-radius:18px;transition:background .2s,border-color .2s}
.team-select:hover{border-color:var(--suave)}
.team-select[aria-pressed=true]{border-color:var(--boton);background:var(--blanco)}
.team-select strong{font:600 18px var(--sans)}
.project-member-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}
.project-member-cards .student{background:var(--fondo)}
.project-member-cards .student p{margin-bottom:0}
.project-checkpoints{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:22px;padding-bottom:20px;border-bottom:1.5px solid var(--linea)}
.project-checkpoints p{margin-top:8px}
.incident-list{display:grid;gap:18px;margin-top:22px}
.incident-card{padding:20px;background:var(--fondo);border-radius:20px}
.incident-card>.small{margin-top:10px}
.incident-card .timeline:empty{display:none}
.member-picker{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:270px;overflow:auto;padding:8px;border:1.5px solid var(--suave);border-radius:var(--r-control)}
.member-picker .check{margin:0;padding:8px;font-size:14px}
.member-picker small{display:block;font:12px var(--mono);color:var(--muted)}
#team-name,#incident-title{width:100%}
#project-panel{min-height:350px}
.project-profes{display:flex;align-items:center;gap:6px;font:13px var(--mono);color:var(--muted)}

/* Responsive */
@media(min-width:1450px){.journey-layout .evidence{grid-template-columns:1fr 1fr}}
@media(max-width:1180px){
  .group-shell.has-profile{grid-template-columns:200px minmax(0,1fr)}
  .group-shell.has-profile>#student-profile{grid-column:2;grid-row:1}
  .profile-panel{position:static}
  .journey-layout{grid-template-columns:minmax(0,1fr) 320px;gap:16px}
}
@media(max-width:1000px){
  .grid,.project-brief{grid-template-columns:1fr}
  .project-columns{grid-template-columns:240px minmax(0,1fr)}
  .project-checkpoints{grid-template-columns:1fr}
}
@media(max-width:900px){
  .sidebar{flex-wrap:wrap;gap:10px;padding:12px 16px}
  .sidebar nav{margin-left:0;width:100%}
  .who{display:none}
  .workspace{padding:0 16px 24px}
  .group-shell,.group-shell.has-profile{grid-template-columns:1fr}
  .group-shell.has-profile>#student-profile{grid-column:1;grid-row:auto}
  .dia{position:static}
  .dia ol{display:flex;gap:4px;overflow-x:auto}
  .dia li{padding:24px 16px 4px 0;min-width:104px}
  .dia li::before{left:16px;right:0;top:6px;bottom:auto;width:auto;height:2px}
  .dia .pto{left:0;top:0}
  .journey-layout{grid-template-columns:1fr}
  .insight-capsule{position:static}
  .launch-options{grid-template-columns:1fr}
  .launch-options button{min-height:120px;flex-direction:row;justify-content:flex-start;padding:18px 22px;text-align:left}
  .launch-options .desc{text-align:left}
  .voz{grid-template-columns:64px minmax(0,1fr)}.voz .pj-l{width:64px;height:64px}
  .voz p{font-size:18px}
  .pupil-head{flex-wrap:wrap}
  .pupil-head .actions{margin-left:0;width:100%}
}
@media(max-width:760px){
  .project-columns{grid-template-columns:1fr}
  .project-roster,.project-member-cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .heading{flex-direction:column;align-items:start;margin:24px 0 18px}
  h1{font-size:28px}
}
@media(max-width:560px){
  .evidence,.member-picker,.project-member-cards,.project-roster{grid-template-columns:1fr}
  .student-list,.attention-list{grid-template-columns:1fr}
  .situation{flex-direction:column;align-items:start}
  .track{display:none}
  .toolbar input{min-width:0;width:100%}
  .row{align-items:flex-start}
  .card{padding:20px}
  dl{grid-template-columns:100px 1fr}
  .toast{bottom:16px;right:16px;max-width:calc(100vw - 32px)}
  .sidebar nav button{padding:8px 12px}
  .sidebar nav .icon{display:none}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body><div id="splash" class="splash" role="status" aria-label="Cargando Miseño"><div class="splash-logo"><img src="img/logo.webp" alt=""><span>Miseño</span><small>Espacio docente</small></div></div><a class="skip" href="#main">Ir al contenido</a><div class="app"><header class="sidebar"><button class="home-mark brand" data-page="launch" aria-label="Miseño · Volver al inicio"><img class="logo" src="img/logo.webp" alt="">Miseño<small>docentes</small></button><nav aria-label="Navegación principal" id="nav"></nav><div class="who"><span class="avatar" data-tono="neutro">CL</span><div><strong>Clara López</strong><div class="small muted">Grupo A · Primaria</div></div></div></header><div class="workspace"><main id="main" tabindex="-1"></main></div></div><dialog id="dialog" aria-labelledby="dialog-title"></dialog><div id="toast" class="toast" hidden role="status"></div>
<script>
'use strict';
const $=s=>document.querySelector(s), KEY='miseno-docentes-v1';
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial=()=>({notes:[],review:false,planReview:false,academic:false,started:false});
let selectedProfile=null;
let state=initial(),page='launch',student='tomi',tab='activities',query='',groupFilter='all',situationFilter='all',toastTimer;
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.notes))state={...initial(),...s}}catch(e){}
const pupils=[{id:'tomi',name:'Tomás',short:'Tomi',initial:'T',subject:'Matemática',activity:'Fracciones · Situaciones de fútbol',color:'#eee9fa',status:'Revisar adaptación'},{id:'joaquin',name:'Joaquín',short:'Joaquín',initial:'J',subject:'Matemática',activity:'Fracciones · Apoyo visual',color:'#e2eff4',status:'Necesita acompañamiento'},{id:'sofia',name:'Sofía',short:'Sofía',initial:'S',subject:'Ciencias',activity:'Las plantas · Proyecto de huerta',color:'#e0f1e8',status:'Actividad en curso'},{id:'bruno',name:'Bruno',short:'Bruno',initial:'B',subject:'Lengua',activity:'La arquera · Comprensión del cuento',color:'#f7e8df',status:'Actividad en curso'},{id:'emma',name:'Emma',short:'Emma',initial:'E',subject:'Historia',activity:'La colonia · Exploración guiada',color:'#e9e6f8',status:'Actividad en curso'},{id:'mateo',name:'Mateo',short:'Mateo',initial:'M',subject:'Ciencias',activity:'Las plantas · Observación',color:'#e0eee8',status:'Sin nuevos registros'}];

// Materias: mismo tono y mismo profe que en la app del alumno.
const SUBJ={'Matemática':{t:'mate',p:'numi',n:'Numi'},'Lengua':{t:'lengua',p:'otto',n:'Otto'},'Ciencias':{t:'ciencias',p:'fini',n:'Fini'},'Dibujo':{t:'dibujo',p:'dona',n:'Dona'},'Gastronomía':{t:'gastro',p:'rolo',n:'Rolo'},'Huerta':{t:'huerta',p:'fini',n:'Numi y Fini'},'Recreo':{t:'recreo'},'Historia':{t:'neutro'},'Música':{t:'neutro'}};
const JORNADA=[['Matemática','8:30','numi','hecho'],['Lengua','9:30','otto','actual'],['Recreo','10:20',null,''],['Huerta','10:40','numi,fini','']];
function tone(subject){return (SUBJ[subject]||SUBJ[String(subject).split(' ')[0]]||{t:'neutro'}).t}
function pj(name,size='s',mood='reposo'){return name?`<img class="pj pj-${size}" src="img/${name}-${mood==='reposo'?'reposo':mood}.webp" alt="" onerror="this.remove()">`:''}
function profe(subject){const d=SUBJ[subject];return d&&d.p?d:null}
function chip(subject){return `<span class="chip" data-tono="${tone(subject)}">${esc(subject)}</span>`}
function miseTag(text){return `<span class="tag miseno">${pj('guio','xs')}${text}</span>`}
const iconPaths={group:'<circle cx="9" cy="7" r="3"/><path d="M3 20v-3a6 6 0 0 1 12 0v3M16 4a3 3 0 0 1 0 6m2 4a5 5 0 0 1 3 5"/>',situations:'<rect x="4" y="3" width="16" height="18" rx="4"/><path d="M8 8h8m-8 4h5m-5 4h8"/>',paths:'<circle cx="6" cy="5" r="2"/><circle cx="18" cy="19" r="2"/><path d="M6 7v7a5 5 0 0 0 5 5h5M8 5h5a5 5 0 0 1 5 5v7"/>',projects:'<rect x="3" y="4" width="7" height="7" rx="2"/><rect x="14" y="4" width="7" height="7" rx="2"/><rect x="3" y="15" width="7" height="7" rx="2"/><path d="M14 18h7m-3-3v7"/>'};
function icon(id){return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${iconPaths[id]||iconPaths.situations}</svg>`}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){toast('No se pudo guardar en el navegador. Se conserva durante esta sesión.');return false}}
function toast(t){$('#toast').innerHTML=pj('guio','s','habla')+'<span>'+esc(t)+'</span>';$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,5500)}
function pending(){return Number(!state.review)+Number(!state.academic)}
function nav(){const names={group:'Grupo',paths:'Recorridos',projects:'Proyectos'},n=attentionItems().filter(i=>!i.done).length;$('#nav').innerHTML=Object.entries(names).map(([id,name])=>`<button data-page="${id}" ${page===id?'aria-current="page"':''}>${icon(id)}${name}${id==='group'&&n?`<span class="counter" aria-label="${n} para acompañar">${n}</span>`:''}</button>`).join('')}

function title(a,b,extra=''){return `<div class="heading"><div><div class="eyebrow">Miseño · Grupo A</div><h1 id="page-title" tabindex="-1">${a}</h1><p>${b}</p></div>${extra}</div>`}
function pupil(id=student){return pupils.find(p=>p.id===id)||pupils[0]}
function avatar(p){return `<span class="avatar" data-tono="${tone(p.subject)}" aria-hidden="true">${p.initial}</span>`}
function status(p){if(p.id==='tomi')return state.review?'En revisión':state.started?'En atención':p.status;if(p.id==='joaquin'&&state.academic)return 'Intervención realizada';return p.status}
function openPupil(id){student=id;page='paths';tab='activities';render(true)}
function attentionItems(){const items=[{id:'tomi',from:'numi',title:'Dificultad persistente · Revisar adaptación',label:state.review?'En revisión':state.started?'En atención':'Pendiente',done:state.review},{id:'joaquin',from:'numi',title:'Numi pide acompañamiento presencial con fracciones',label:state.academic?'Intervención realizada':'Pendiente',done:state.academic}];pupils.filter(p=>p.status==='Necesita acompañamiento'&&!items.some(i=>i.id===p.id)).forEach(p=>{const pr=profe(p.subject);items.push({id:p.id,from:pr?pr.p:'guio',title:'Necesita acompañamiento · '+p.activity,label:state.notes.some(n=>n.student===p.id)?'Intervención realizada':'Pendiente',done:state.notes.some(n=>n.student===p.id)})});return items}
function jornada(){return `<aside class="dia" aria-label="La jornada de hoy"><h2>Hoy · Grupo A</h2><ol>${JORNADA.map(([m,h,who,st])=>`<li class="${st}" data-tono="${tone(m)}"><span class="pto" aria-hidden="true"></span><strong>${m}</strong><span class="hora">${h}${st==='actual'?' · ahora':''}</span>${who?`<div class="profes">${who.split(',').map(w=>pj(w,'xs')).join('')}</div>`:''}</li>`).join('')}</ol><p class="nota">Es el mismo día que ven los alumnos en su app.</p></aside>`}
function group(){const subjects=[...new Set(pupils.map(p=>p.subject))];const list=pupils.filter(p=>(groupFilter==='all'||p.subject===groupFilter)&&(p.name+' '+p.short+' '+p.subject+' '+p.activity).toLowerCase().includes(query.toLowerCase()));const att=attentionItems();const open=att.filter(i=>!i.done).length;return title('Grupo A',open?`${open} ${open===1?'situación espera':'situaciones esperan'} tu mirada. El resto del grupo sigue su recorrido.`:'No hay situaciones pendientes. Podés sumar observaciones cuando quieras.')+`<div class="group-shell ${selectedProfile?'has-profile':''}">${jornada()}<div><section class="attention" aria-labelledby="att-title"><div class="section-head"><h2 id="att-title">Para acompañar</h2><span class="small muted">Derivaciones de Miseño y de los profes</span></div><div class="attention-list">${att.map(i=>{const p=pupil(i.id);return `<button class="attention-item ${i.done?'done':''}" data-tono="${tone(p.subject)}" data-student="${p.id}"><span class="who-line">${avatar(p)}<span><strong>${p.name}</strong><br>${chip(p.subject)}</span></span><h3>${i.title}</h3><span class="row"><span class="from">${pj(i.from,'xs')}Derivó ${i.from==='guio'?'Guio':SUBJ[p.subject]?.n||'Miseño'}</span><span class="tag ${i.done?'green':'amber'}">${i.label}</span></span></button>`}).join('')}</div></section><section aria-labelledby="students-title"><div class="section-head" style="margin-bottom:12px"><h2 id="students-title">Todo el grupo</h2><span class="small muted">${list.length} de ${pupils.length} alumnos</span></div><div class="toolbar"><input type="search" id="search" aria-label="Buscar alumno, materia o actividad" placeholder="Buscar alumno, materia o actividad" value="${esc(query)}"><div class="filters" role="group" aria-label="Filtrar por materia"><button data-filter="all" aria-pressed="${groupFilter==='all'}">Todas</button>${subjects.map(m=>`<button data-filter="${esc(m)}" data-tono="${tone(m)}" aria-pressed="${groupFilter===m}">${esc(m)}</button>`).join('')}</div></div><div class="student-list">${list.map(p=>`<button class="student" data-tono="${tone(p.subject)}" data-profile="${p.id}" aria-expanded="${selectedProfile===p.id}" aria-controls="student-profile"><span class="split">${avatar(p)}<span><strong>${p.name}</strong><br>${chip(p.subject)}</span></span><p>${p.activity}</p><span class="foot"><span class="tag ${/acompañamiento|Revisar|Pendiente/.test(status(p))?'amber':/realizada/.test(status(p))?'green':''}">${status(p)}</span>${pj(profe(p.subject)?.p,'xs')}</span></button>`).join('')||'<p class="empty">No hay alumnos que coincidan con la búsqueda.</p>'}</div></section></div><aside id="student-profile" aria-label="Ficha del alumno" ${selectedProfile?'':'hidden'}>${selectedProfile?profilePanel(pupil(selectedProfile)):''}</aside></div>`}
function profilePanel(p){const pr=profe(p.subject);return `<section class="card profile-panel" data-tono="${tone(p.subject)}"><div class="row"><div class="split">${avatar(p)}<h2 id="profile-heading" tabindex="-1">${p.name}</h2></div><button class="close" data-action="close-profile" aria-label="Cerrar ficha del alumno">×</button></div><div class="profile-hero">${pr?pj(pr.p,'m'):''}<div><strong>${p.subject}</strong><p>${pr?'Con '+pr.n+' · ':''}${p.activity}</p></div></div><dl><dt>Nombre de uso</dt><dd>${p.short}</dd><dt>Grupo</dt><dd>Grupo A · Primaria</dd><dt>Estado</dt><dd>${status(p)}</dd><dt>Datos personales</dt><dd class="muted">Sin cargar</dd></dl><div class="actions"><button class="btn" data-student="${p.id}">Ver recorrido</button><button class="btn ghost" data-history="${p.id}">Ver historial</button></div></section>`}

function situations(){const items=[{id:'tomi',title:'Dificultad persistente · Revisar adaptación',desc:'Contrastar las fuentes utilizadas para personalizar sus actividades.',state:state.review?'review':state.started?'active':'pending',label:state.review?'En revisión':state.started?'En atención':'Pendiente'},{id:'joaquin',title:'El tutor solicita acompañamiento',desc:'Necesita apoyo con fracciones después de varios métodos de explicación.',state:state.academic?'done':'pending',label:state.academic?'Intervención realizada':'Pendiente'}].filter(i=>situationFilter==='all'||i.state===situationFilter);return title('Situaciones para acompañar','Revisá el contexto antes de decidir cómo intervenir.')+`<div class="toolbar"><label for="situation-filter" style="margin:0">Mostrar</label><select id="situation-filter"><option value="all">Todas las situaciones</option><option value="pending">Pendientes</option><option value="active">En atención</option><option value="review">En revisión</option><option value="done">Intervenciones realizadas</option></select></div><section class="card"><h2>Seguimiento del grupo</h2>${items.map(i=>`<article class="situation"><div><span class="tag ${i.state==='done'?'green':'amber'}">${i.label}</span><h3>${pupil(i.id).name} · ${i.title}</h3><p class="muted">${i.desc}</p><p class="small muted">10 nov · Registro de Miseño</p></div><button class="btn secondary" data-student="${i.id}">Abrir situación</button></article>`).join('')||'<p class="empty">No hay situaciones con este estado.</p>'}</section>`}
function sourcePanel(){return `<section class="card"><div class="row"><h2>Información utilizada</h2><span class="tag amber">Versiones diferentes</span></div><p class="muted" style="margin-top:10px">Estos registros refieren al mismo interés, desde momentos y contextos distintos.</p><div class="evidence"><article class="source-card family"><span class="tag green">Familia · Declaración</span><blockquote>${esc(learningData.tomi.family)}</blockquote><p class="small">2 nov · Aporte familiar<br>Contexto: intereses en casa.</p></article><article class="source-card"><span class="tag lilac">Alumno · Declaración explícita</span><blockquote>${esc(learningData.tomi.child)}</blockquote><p class="small">${esc(learningData.tomi.context)}<br>Contexto: actividad de fracciones.</p></article></div><div class="callout">Ninguna versión reemplaza a la otra. La fecha y el contexto pueden ayudar a entender la diferencia.</div><h3 style="margin-top:24px">Cómo lo está interpretando Miseño</h3><div class="guio-says">${pj('guio','s','piensa')}<p>“Usé situaciones de fútbol a partir del interés que declaró la familia. Registré necesidad de apoyo en varias actividades”.</p></div><div class="callout amber"><strong>Explicación incompleta</strong><br>No está disponible cómo se ponderó la declaración posterior del alumno ni por qué se mantuvo esa temática. La causa de la dificultad sigue abierta.</div></section>`}
function activities(){const tomi=student==='tomi';return `<section class="card"><h2>Actividades y apoyos utilizados</h2><p class="muted" style="margin-top:10px">${tomi?'La temática utilizada puede ser un aspecto a revisar. Estos resultados no explican por sí solos la dificultad.':'El tutor probó apoyos distintos y solicitó intervención presencial.'}</p><div class="table-wrap"><table><thead><tr><th>Actividad</th><th>Registro</th><th>Apoyos utilizados</th></tr></thead><tbody><tr><td>10 nov · Fracciones<br>Un tercio de 90 minutos</td><td>Respondió 45; luego pidió ayuda.</td><td>Pista verbal y barra visual del partido.</td></tr><tr><td>9 nov · Repartir goles<br>Tres cuartos de 12</td><td>Necesitó pasos guiados.</td><td>Grupos visuales y descomposición.</td></tr><tr><td>8 nov · Partes iguales</td><td>Completó con acompañamiento.</td><td>Objetos y explicación del tutor.</td></tr></tbody></table></div><div class="callout">Estos registros no constituyen un diagnóstico ni una comparación con otros alumnos.</div></section>`}
function history(){const notes=state.notes.filter(n=>n.student===student);return `<section class="card"><h2>Historial de miradas e intervenciones</h2><div class="timeline">${notes.map(n=>`<article class="event"><span class="tag blue">Docente · Clara López</span><p class="small muted">${esc(new Date(n.date).toLocaleString('es-AR'))}</p><h3 style="margin-top:8px">${esc(n.action)}</h3><p class="note-text">${esc(n.text)}</p><p class="small muted">Contexto: ${esc(n.context)}<br>Seguimiento: ${esc(n.followup)}</p><p class="small muted">Evidencias asociadas: ${esc(n.evidence)}</p></article>`).join('')}${student==='tomi'&&state.review?'<article class="event"><span class="tag amber">Revisión de adaptación</span><h3 style="margin-top:8px">Solicitud de revisión registrada</h3><p class="muted">La discrepancia permanece abierta. El plan actual no se modificó.</p></article>':''}${student==='tomi'?'<article class="event"><span class="tag lilac">Alumno · 9 nov</span><p>Expresó que no le gusta la temática de fútbol durante una actividad.</p></article><article class="event"><span class="tag green">Familia · 2 nov</span><p>Compartió fútbol y autitos como intereses. Se conserva el aporte original.</p></article>':'<article class="event"><span class="tag">Miseño · 10 nov</span><p>Se abrió la ficha con registros de su actividad escolar.</p></article>'}</div></section>`}
function detailLegacy(){const p=pupil(),isT=student==='tomi',isJ=student==='joaquin';let content=tab==='history'?history():tab==='activities'?activities():isT?sourcePanel():isJ?activities():`<section class="card"><h2>Su actividad actual</h2><p style="margin-top:15px">${p.activity}</p><div class="callout">${p.id==='mateo'?'Sin nuevos registros. La lectura de la pulsera no está disponible; no se infiere su estado ni el acompañamiento familiar.':'No hay una situación pendiente de revisión.'}</div><h3 style="margin-top:24px">Contexto de la familia</h3><p class="muted" style="margin-top:8px">Sin nuevos aportes familiares.</p></section>`;return `<div class="breadcrumb"><button class="link" data-page="group">Mi grupo</button><span class="muted">/</span>${p.name}</div>`+title(isT?'Entender lo que le pasa a Tomi':`Una mirada a ${p.name}`,isT?'Dificultad persistente · Revisar la adaptación de sus actividades.':p.activity,`<button class="btn" data-action="note">Registrar intervención</button>`)+`<div class="tabs" role="tablist" aria-label="Detalle del alumno">${[['activities','Actividades'],['evidence','Contexto y fuentes'],['interventions','Intervenciones']].map(([id,t])=>`<button role="tab" id="tab-${id}" aria-controls="detail-panel" aria-selected="${tab===id}" tabindex="${tab===id?0:-1}" data-tab="${id}">${t}</button>`).join('')}</div><div class="grid"><div id="detail-panel" role="tabpanel" aria-labelledby="tab-${tab}">${content}</div><aside class="stack"><section class="card"><div class="split">${avatar(p)}<div><h3>${p.name}</h3><p class="small muted">Grupo A · Primaria</p></div></div><div class="status-grid"><div><strong class="small">${isT?'Discrepancia':'Situación'}</strong><span class="tag amber">${status(p)}</span></div><div><strong class="small">Intervención docente</strong><span class="muted small">${state.notes.some(n=>n.student===student)?'Registrada · Ver historial':'Sin registrar'}</span></div><div><strong class="small">Aprendizaje</strong><span class="muted small">${isT||isJ?'Dificultad en seguimiento':'Actividad en seguimiento'}</span></div></div>${isT?`<button class="btn secondary" data-action="start" ${state.started||state.review?'disabled':''}>${state.review?'Discrepancia en revisión':state.started?'Situación en atención':'Comenzar atención'}</button><div class="actions"><button class="btn" data-action="review" ${state.review?'disabled':''}>${state.review?'Revisión registrada':'Solicitar revisión'}</button></div><p class="small muted" style="margin-top:14px">La solicitud queda registrada. El plan permanece sin cambios.</p>`:isJ?'<p class="small muted">Registrá el acompañamiento antes de marcar la intervención como realizada.</p>':'<p class="small muted">Podés sumar una observación aunque no haya una alerta.</p>'}</section><section class="card glass"><h3>Intervención docente</h3><p class="muted small" style="margin-top:12px">Conversá con el alumno y contrastá lo que ves con los registros. Atender la situación no implica dar la dificultad por resuelta.</p></section></aside></div>`}
function pathsLegacy(){return title('Recorridos de aprendizaje','Temas, apoyos y cambios del plan, con contexto individual.')+`<div class="toolbar"><label for="path-student" style="margin:0">Alumno</label><select id="path-student">${pupils.map(p=>`<option value="${p.id}" ${p.id===student?'selected':''}>${p.name}</option>`).join('')}</select></div><div class="grid"><section class="card"><div class="row"><h2>El recorrido de ${pupil().name}</h2><span class="tag">Vista por temas</span></div><p class="muted small" style="margin-top:9px">Los indicadores representan el avance dentro del tema.</p>${[['Matemática','Fracciones','Apoyo visual y pasos guiados',60],['Lengua','Comprensión de cuentos','Lectura acompañada',40],['Ciencias','Las plantas','Proyecto grupal de huerta',50],['Historia','La colonia','Exploración guiada',35],['Música','Flauta','En pausa en el plan',25]].map(([name,topic,desc,n])=>`<article class="subject"><div class="avatar" style="background:${name==='Música'?'#e9eceb':'#e8edf7'}">${name==='Matemática'?'½':name==='Ciencias'?'✿':name[0]}</div><div><h3>${name} · ${topic}</h3><p class="small muted">${desc}</p></div><div class="track"><span class="small muted">${name==='Música'?'En pausa':n+'% del tema'}</span><div class="bar" role="progressbar" aria-label="Avance en ${name}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${n}"><i style="width:${n}%"></i></div></div></article>`).join('')}</section><aside class="stack"><section class="card alert"><span class="tag amber">Cambio del plan</span><h2 style="margin-top:15px">Más bloques de Matemática</h2><p class="muted" style="margin-top:12px">El plan suma dos bloques semanales y deja Música en pausa.</p><button class="btn secondary" data-action="plan" style="margin-top:20px">Consultar el cambio</button></section><section class="card"><h3>Lo que podés hacer</h3><p class="muted small" style="margin-top:12px">Consultar el recorrido y dejar una revisión registrada. La edición directa del plan sigue pendiente de definición.</p></section></aside></div>`}

function render(focus=false){if(page==='detail'||page==='situations')page='paths';if(page==='students')page='group';document.body.classList.toggle('launch-mode',page==='launch');nav();$('#main').innerHTML=({launch,group,paths,projects}[page])();if(page==='paths'){const c=$('.pupil-carousel');if(c){c.scrollLeft=carouselPosition;c.onscroll=()=>{carouselPosition=c.scrollLeft}}}if(page==='paths'&&$('#situation-filter'))$('#situation-filter').value=situationFilter;if(focus){$('#page-title').focus();window.scrollTo(0,0)}}

function modal(title,body){$('#dialog').innerHTML=`<div class="row"><h2 id="dialog-title">${title}</h2><button class="close" data-action="close" aria-label="Cerrar">×</button></div>${body}`;$('#dialog').showModal()}
function note(){const p=pupil();modal(`Intervención · ${p.name}`,`<p class="muted" style="margin-top:12px">Registrá qué observaste y cómo acompañaste la situación.</p><form id="note-form"><label for="observation">Tu observación</label><textarea id="observation" required maxlength="2500" aria-describedby="note-error" placeholder="Por ejemplo: conversamos sobre sus intereses. Prefiere problemas con plantas y animales."></textarea><div id="note-error" class="error" role="alert"></div><label for="context">Contexto</label><select id="context"><option>Conversación presencial con el alumno</option><option>Observación durante la actividad</option><option>Conversación con la familia</option><option>Actividad grupal</option></select><label for="action">Acción realizada</label><select id="action"><option>Conversé con el alumno</option><option>Acompañé el ejercicio presencialmente</option><option>Contrasté los registros disponibles</option><option>Observé la actividad grupal</option></select><label for="followup">Seguimiento</label><select id="followup"><option>Continuar observando</option><option>Revisar adaptación con el equipo pedagógico</option><option>Retomar conversación con la familia</option></select><div class="callout">Evidencias asociadas: ${student==='tomi'?'aporte familiar del 2 nov, declaración del alumno del 9 nov y actividades del 8 al 10 nov.':'registros de actividad del alumno.'}</div><label class="check"><input type="checkbox" id="attended" checked><span>Registrar la intervención como realizada. La dificultad continúa en seguimiento.</span></label><p class="small muted">No modifica el plan ni resuelve automáticamente una discrepancia.</p><div class="actions"><button class="btn" type="submit">Guardar intervención</button><button class="btn ghost" type="button" data-action="close">Cancelar</button></div></form>`)}
const actions={close:()=>$('#dialog').close(),note,start:()=>{state.started=true;persist();render();toast('Situación en atención. Los registros originales se conservan.')},review:()=>modal('Revisar la adaptación de Tomi',`<p style="margin-top:18px">Se registrará una solicitud para contrastar los intereses utilizados y revisar la propuesta de actividades.</p><div class="callout amber">La discrepancia quedará “En revisión”. El plan actual permanece igual.</div><p class="muted small" style="margin-top:15px">Responsable y plazo de resolución: pendientes de asignación.</p><div class="actions"><button class="btn" data-action="confirm-review">Registrar solicitud</button><button class="btn ghost" data-action="close">Volver</button></div>`),'confirm-review':()=>{state.review=true;state.started=true;const ok=persist();$('#dialog').close();render();if(ok)toast('Revisión registrada. El plan no cambió.')},plan:()=>modal('Revisión del cambio de plan',`<p style="margin-top:18px">${pupil().name} · Matemática suma dos bloques y Música queda en pausa.</p><div class="callout"><strong>Explicación de Miseño</strong><p>“Se eligió el mejor camino según cómo aprende el alumno”.</p></div><p class="muted" style="margin-top:15px">No se detalla qué datos justificaron este cambio. La autoridad para aprobar o suspenderlo sigue pendiente de definición.</p><div class="actions"><button class="btn" data-action="plan-review" ${state.planReview?'disabled':''}>${state.planReview?'Solicitud registrada':'Registrar pedido de revisión'}</button></div><p class="small muted" style="margin-top:15px">La solicitud no modifica el recorrido.</p>`),'plan-review':()=>{state.planReview=true;const ok=persist();$('#dialog').close();if(ok)toast('Pedido de revisión del plan guardado.')},project:()=>modal('Organizar la huerta',`<p style="margin-top:18px">Grupo propuesto: Joaquín, Sofía y Bruno.</p><ul><li>Reunir al grupo y preparar tierra, semillas y recipientes.</li><li>Conversar cómo se repartirán las tareas.</li><li>Observar la participación y los acuerdos entre compañeros.</li></ul><p class="muted">Cambiar integrantes requiere definir primero la autoridad docente sobre los agrupamientos.</p><div class="actions"><button class="btn" data-action="project-note">Registrar observación de Joaquín</button></div>`),'project-note':()=>{$('#dialog').close();student='joaquin';note();$('#context').value='Actividad grupal';$('#action').value='Observé la actividad grupal'},reset:()=>modal('Reiniciar el ejemplo',`<p style="margin-top:18px">Se eliminarán únicamente las intervenciones y solicitudes guardadas por este prototipo de Miseño en este navegador.</p><div class="actions"><button class="btn" data-action="confirm-reset">Reiniciar demo</button><button class="btn ghost" data-action="close">Cancelar</button></div>`),'confirm-reset':()=>{state=initial();persist();$('#dialog').close();page='group';query='';groupFilter='all';situationFilter='all';render(true);toast('Demo reiniciada.') }};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render(true)}else if(b.dataset.student){openPupil(b.dataset.student)}else if(b.dataset.tab){selectJourneyTab(b.dataset.tab)}else if(b.dataset.action&&actions[b.dataset.action])actions[b.dataset.action]()});
document.addEventListener('change',e=>{if(e.target.id==='group-filter'){groupFilter=e.target.value;render()}if(e.target.id==='situation-filter'){situationFilter=e.target.value;render()}if(e.target.id==='path-student'){student=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){const pos=e.target.selectionStart;query=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)}});
document.addEventListener('keydown',e=>{if(e.target.getAttribute('role')!=='tab'||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const ids=['activities','evidence','interventions'],i=ids.indexOf(tab);tab=e.key==='Home'?ids[0]:e.key==='End'?ids[2]:ids[(i+(e.key==='ArrowRight'?1:2))%3];selectJourneyTab(tab)});
document.addEventListener('submit',e=>{if(e.target.id!=='note-form')return;e.preventDefault();const text=$('#observation').value.trim();if(!text){$('#note-error').textContent='Escribí qué observaste antes de guardar.';$('#observation').focus();return}const attended=$('#attended').checked;state.notes.unshift({student,text,context:$('#context').value,action:$('#action').value,followup:$('#followup').value,date:new Date().toISOString(),attended,evidence:student==='tomi'?'Familia 2 nov; alumno 9 nov; actividades 8–10 nov':'Registros de actividad del alumno'});if(student==='joaquin'&&attended)state.academic=true;if(student==='tomi')state.started=true;const ok=persist();$('#dialog').close();page='paths';tab='interventions';render(true);if(ok)toast('Intervención guardada en el historial. La dificultad sigue en seguimiento.')});

function launch(){const n=attentionItems().filter(i=>!i.done).length;const h=new Date().getHours();const saludo=h<13?'Buen día':h<20?'Buenas tardes':'Buenas noches';return `<div class="launch-screen"><div class="brand"><img class="logo" src="img/logo.webp" alt="">Miseño</div><div class="voz">${pj('guio','l','habla')}<div><div class="quien">Guio · tutor de Miseño</div><p>${saludo}, Clara. ${n?`Hoy ${n===1?'hay una situación':'hay '+n+' situaciones'} para acompañar. Lo demás puede esperar.`:'Hoy no hay situaciones pendientes.'}</p></div></div><h1 id="page-title" tabindex="-1">Espacio docente · ¿Por dónde empezamos?</h1><div class="launch-options">${[['group','Grupo','La jornada y quién necesita tu mirada',n],['paths','Recorridos','Actividades, fuentes e intervenciones',0],['projects','Proyectos','Equipos, seguimiento y convivencia',0]].map(([id,t,d,c])=>`<button data-page="${id}"><span class="launch-icon">${icon(id)}${c?`<span class="badge">${c}</span>`:''}</span><span><strong>${t}</strong><br><span class="desc">${d}</span></span></button>`).join('')}</div></div>`}

function recommendations(){const p=pupil();return `<section class="card" style="margin-top:22px"><div class="row"><h2>Recomendaciones de la IA</h2>${miseTag('Miseño · Propuesta')}</div><p style="margin-top:14px">${student==='tomi'?'Contrastar los intereses con Tomi y probar una actividad con otra temática antes de atribuir una causa a las dificultades.':student==='joaquin'?'Retomar el ejercicio con acompañamiento presencial y registrar qué parte necesita otra explicación.':'Registrar observaciones de la actividad actual antes de proponer nuevos ajustes.'}</p><div class="callout">${student==='tomi'?'Fundamento: diferencia entre la declaración familiar y la expresión del alumno; necesidad de apoyo en las actividades.':'Fundamento: registros de la actividad actual.'} La propuesta requiere revisión docente; no se aplica automáticamente.</div><div class="actions"><button class="btn secondary" data-action="edit-adaptation">Proponer ajuste</button></div>${(state.adjustments||[]).filter(a=>a.student===student).map(a=>`<div class="callout"><strong>Propuesta docente · ${esc(a.theme)}</strong><p>${esc(a.support)}</p><span>Registrada · Plan sin modificar</span></div>`).join('')}</section>`}

actions['close-profile']=()=>{const id=selectedProfile;selectedProfile=null;render();const trigger=document.querySelector('[data-profile="'+id+'"]');if(trigger)trigger.focus()};
actions['edit-adaptation']=()=>modal('Proponer ajuste · '+pupil().name,`<p class="muted" style="margin-top:15px">Registrá una propuesta para este alumno. No se aplica al plan automáticamente.</p><form id="adjust-form"><label for="adjust-theme">Temática a explorar</label><select id="adjust-theme"><option>Plantas y animales</option><option>Situaciones cotidianas</option><option>Fútbol</option><option>Consultar intereses con el alumno</option></select><label for="adjust-support">Apoyo y motivo del ajuste</label><textarea id="adjust-support" required maxlength="1500" placeholder="Qué cambiarías y qué observación fundamenta la propuesta"></textarea><div id="adjust-error" class="error" role="alert"></div><div class="actions"><button class="btn" type="submit">Guardar propuesta</button><button class="btn ghost" type="button" data-action="close">Cancelar</button></div></form>`);
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.profile){e.stopImmediatePropagation();student=b.dataset.profile;selectedProfile=b.dataset.profile;page='group';render();$('#profile-heading').focus()}if(b.dataset.history){e.stopImmediatePropagation();student=b.dataset.history;page='paths';tab='interventions';render(true)}if(b.dataset.carousel){e.stopImmediatePropagation();const c=$('.pupil-carousel');if(c)c.scrollBy({left:Number(b.dataset.carousel)*260,behavior:'smooth'})}},true);
document.addEventListener('submit',e=>{if(e.target.id!=='adjust-form')return;e.preventDefault();const support=$('#adjust-support').value.trim();if(!support){$('#adjust-error').textContent='Escribí el motivo del ajuste.';return}state.adjustments=state.adjustments||[];state.adjustments.unshift({student,theme:$('#adjust-theme').value,support,date:new Date().toISOString()});const ok=persist();$('#dialog').close();render();if(ok)toast('Propuesta guardada. El plan no se modificó.')});

function compactInsights(){const d=learningData[student];return `<aside class="insight-capsule card"><div class="insight-pills" role="group" aria-label="Aportes y recomendaciones"><button data-insight="family" aria-pressed="${insightTab==='family'}">Familia</button><button data-insight="ai" aria-pressed="${insightTab==='ai'}">${pj('guio','xs')} Miseño</button></div>${insightTab==='family'?`<div class="capsule-content"><span class="tag green">Familia · ${d.date}</span><blockquote>${esc(d.family)}</blockquote><p class="small muted">Aporte conservado con su fuente y fecha.</p><div class="capsule-divider"></div><span class="tag lilac">Alumno · Declaración explícita</span><blockquote>${esc(d.child)}</blockquote><p class="small muted">${esc(d.context)}</p></div>`:`<div class="capsule-content">${miseTag('Interpretación de Miseño')}<div class="guio-says">${pj('guio','s','piensa')}<p>${esc(d.finding)}</p></div><h3 style="margin-top:22px">Recomendación</h3><p style="margin-top:10px">${esc(d.recommend)}</p>${recommendationActions()}<div class="capsule-divider"></div><h3>Conversar con Miseño</h3><p class="small muted" style="margin-top:6px">Conversación simulada sobre ${pupil().name}.</p><div class="chat-log" role="log" aria-label="Conversación sobre ${pupil().name}">${(state.chats?.[student]||[]).map(m=>`<div class="chat-message ${m.role}"><strong>${m.role==='user'?'Vos':'Miseño'}</strong><p>${esc(m.text)}</p></div>`).join('')||'<p class="small muted">Consultá los registros o pedí un cambio en la propuesta.</p>'}</div><div class="chat-suggestions"><button data-prompt="¿Qué le está costando?">¿Qué le cuesta?</button><button data-prompt="¿Por qué recomendás esta actividad?">¿Por qué?</button><button data-prompt="Quiero cambiar la temática">Pedir un cambio</button></div><form id="chat-form"><label for="chat-input" class="small">Mensaje para Miseño</label><textarea id="chat-input" maxlength="1500" rows="2" required placeholder="Preguntá por el alumno o pedí un cambio…"></textarea><div id="chat-error" class="error" role="alert"></div><button class="btn" style="margin-top:10px" type="submit">Enviar</button></form>${(state.chatRequests||[]).filter(r=>r.student===student).map(r=>`<div class="callout"><strong>Pedido de cambio registrado</strong><p>${esc(r.text)}</p><span class="small">Pendiente de revisión · Plan sin modificar</span></div>`).join('')}</div>`}</aside>`}
function legacyStudentRecords(){const d=learningData[student];if(tab==='history')return history()+`<section class="card" style="margin-top:22px"><h2>Observaciones anteriores</h2><div class="timeline">${d.observations.map(([date,text])=>`<article class="event"><span class="small muted">${date}</span><p>${esc(text)}</p></article>`).join('')}</div></section>`;if(tab==='activities')return `<section class="card"><h2>Actividades y apoyos utilizados</h2><div class="table-wrap"><table><thead><tr><th>Fecha y actividad</th><th>Registro</th><th>Apoyo</th></tr></thead><tbody>${d.sessions.map(([date,activity,result,support])=>`<tr><td>${date}<br>${esc(activity)}</td><td>${esc(result)}</td><td>${esc(support)}</td></tr>`).join('')}</tbody></table></div></section>`;return student==='tomi'?sourcePanel():`<section class="card"><div class="row"><h2>Contexto de ${pupil().name}</h2><span class="tag">${status(pupil())}</span></div><div class="callout"><strong>Actividad actual</strong><p>${pupil().activity}</p></div><h3 style="margin-top:24px">Lo que expresó el alumno</h3><p style="margin-top:12px">${esc(d.child)}</p><p class="small muted">${esc(d.context)}</p><h3 style="margin-top:24px">Últimas observaciones</h3><div class="timeline">${d.observations.map(([date,text])=>`<article class="event"><span class="small muted">${date}</span><p>${esc(text)}</p></article>`).join('')}</div></section>`}
function interventionRecords(){const d=learningData[student],notes=state.notes.filter(n=>n.student===student);return `<section class="card"><div class="row"><div><h2>Intervenciones docentes</h2><p class="small muted" style="margin-top:8px">${pupil().name} · Acciones y seguimiento</p></div><button class="btn" data-action="note">Nueva intervención</button></div><div class="timeline">${notes.map(n=>`<article class="event"><span class="tag blue">Docente · Clara López</span><p class="small muted">${esc(new Date(n.date).toLocaleString('es-AR'))}</p><h3 style="margin-top:10px">${esc(n.action)}</h3><p>${esc(n.text)}</p><p class="small muted">Contexto: ${esc(n.context)}<br>Seguimiento: ${esc(n.followup)}</p><span class="tag ${n.attended?'green':''}">${n.attended?'Intervención realizada':'Registro de observación'}</span></article>`).join('')}${d.observations.filter(([date])=>date.includes('Docente')).map(([date,text])=>`<article class="event"><span class="small muted">${date} · Clara López</span><h3 style="margin-top:10px">Acompañamiento en el aula</h3><p>${esc(text)}</p><p class="small muted">Seguimiento: retomar en la próxima actividad.</p><span class="tag green">Intervención realizada</span></article>`).join('')}</div></section>`}
function studentRecords(){if(tab==='activities')return activitiesWithRecords();if(tab==='interventions')return interventionRecords();if(tab==='activities')return legacyStudentRecords()+`<section class="card embedded-history"><h2>Seguimiento de actividades</h2><div class="timeline">${learningData[student].sessions.map(([date,name,result,support])=>`<article class="event"><span class="small muted">${date} · ${esc(name)}</span><p>${esc(result)}</p><p class="small muted">Apoyo utilizado: ${esc(support)}</p></article>`).join('')}</div></section>`;return legacyStudentRecords()+`<section class="card embedded-history"><div class="row"><h2>Registro de contexto y decisiones</h2>${student==='tomi'?`<button class="btn secondary" data-action="review" ${state.review?'disabled':''}>${state.review?'En revisión':'Solicitar revisión'}</button>`:''}</div><div class="timeline">${learningData[student].observations.map(([date,text])=>`<article class="event"><span class="small muted">${esc(date)}</span><p>${esc(text)}</p></article>`).join('')}${student==='tomi'&&state.review?'<article class="event"><span class="tag amber">Discrepancia en revisión</span><p>Solicitud registrada. El plan permanece sin cambios.</p></article>':''}${(state.chatRequests||[]).filter(r=>r.student===student).map(r=>`<article class="event"><span class="tag blue">Pedido docente vía Miseño</span><p>${esc(r.text)}</p><p class="small muted">${esc(new Date(r.date).toLocaleString('es-AR'))} · Pendiente de revisión</p></article>`).join('')}</div></section>`}

function paths(){return `<h2 id="page-title" tabindex="-1" class="sr-only">Recorridos</h2><div class="carousel-row"><button class="btn ghost" data-carousel="-1" aria-label="Desplazar alumnos hacia la izquierda">←</button><div class="pupil-carousel" tabindex="0" aria-label="Carrusel de alumnos">${pupils.map(p=>`<button data-student="${p.id}" aria-pressed="${student===p.id}" class="pupil-choice" data-tono="${tone(p.subject)}">${avatar(p)}<span>${p.name}</span></button>`).join('')}</div><button class="btn ghost" data-carousel="1" aria-label="Desplazar alumnos hacia la derecha">→</button></div>${pupilHead()}<div class="journey-layout"><div><div class="tabs" role="tablist" aria-label="Detalle del alumno">${[['activities','Actividades'],['evidence','Contexto y fuentes'],['interventions','Intervenciones']].map(([id,t])=>`<button role="tab" id="tab-${id}" aria-controls="detail-panel" aria-selected="${tab===id}" tabindex="${tab===id?0:-1}" data-tab="${id}">${t}</button>`).join('')}</div><div id="detail-panel" role="tabpanel" aria-labelledby="tab-${tab}">${studentRecords()}</div>${(state.adjustments||[]).filter(a=>a.student===student).map(a=>`<div class="callout"><strong>Propuesta docente · ${esc(a.theme)}</strong><p>${esc(a.support)}</p><span>Registrada · Plan sin modificar</span></div>`).join('')}</div>${compactInsights()}</div>`}
function pupilHead(){const p=pupil(),pr=profe(p.subject),st=status(p),isT=p.id==='tomi';return `<section class="pupil-head" data-tono="${tone(p.subject)}" aria-label="Alumno seleccionado">${avatar(p)}<div><h1>${p.name}</h1><div class="meta">${pr?pj(pr.p,'xs'):''}${p.subject}${pr?' con '+pr.n:''} · ${esc(p.activity)} <span class="tag ${/acompañamiento|Revisar|Pendiente|atención/.test(st)?'amber':/realizada|revisión/.test(st)?'green':''}">${st}</span></div></div><div class="actions">${isT&&!state.started&&!state.review?'<button class="btn secondary" data-action="start">Comenzar atención</button>':''}<button class="btn" data-action="note">Registrar intervención</button></div></section>`}
function sendChat(text){text=text.trim();if(!text)return false;const d=learningData[student], normalized=text.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');let answer;
if(/cambi|modific|ajust|reemplaz|agreg|quita|mas tiempo|menos tiempo|aument|reduc|prefier|usar |usemos|quiero que/.test(normalized)){state.chatRequests=state.chatRequests||[];state.chatRequests.unshift({student,text,date:new Date().toISOString()});answer=`Registré tu pedido para ${pupil().name}: “${text}”. La propuesta actual es trabajar ${d.theme.toLowerCase()} con ${d.support.toLowerCase()}. Podemos usar este pedido para preparar una revisión; el plan todavía no se modificó.`}
else if(/famil|casa|padre|madre/.test(normalized))answer=`La familia informó el ${d.date}: ${d.family} El alumno expresó: ${d.child} Conviene considerar ambos contextos antes de decidir un ajuste.`;
else if(/por que|recom|actividad|ayud|apoyo/.test(normalized))answer=`Recomiendo: ${d.recommend} Me baso en estos registros: ${d.finding} Es una propuesta para revisar con tu observación docente.`;
else if(/historial|avan|progres|ultim/.test(normalized))answer=`En los últimos registros: ${d.sessions.map(s=>s[0]+': '+s[2]).join('; ')}. La observación docente más reciente dice: ${d.observations[0][1]}`;
else if(/cuesta|dific|como|que|situacion/.test(normalized))answer=`Sobre ${pupil().name}: ${d.finding} Propongo ${d.recommend.charAt(0).toLowerCase()+d.recommend.slice(1)}`;
else answer=`Puedo consultar los registros de ${pupil().name}, explicar la recomendación o registrar un pedido de cambio. Para esta consulta no tengo más información que las actividades, las observaciones y los aportes que aparecen en su ficha.`;
state.chats=state.chats||{};state.chats[student]=state.chats[student]||[];state.chats[student].push({role:'user',text},{role:'assistant',text:answer});persist();insightTab='ai';render();const log=$('.chat-log');if(log)log.scrollTop=log.scrollHeight;return true;}
document.addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;groupFilter=b.dataset.filter;render();const again=document.querySelector('[data-filter="'+CSS.escape(groupFilter)+'"]');if(again)again.focus()});
document.addEventListener('wheel',e=>{const c=e.target.closest('.pupil-carousel');if(!c||e.ctrlKey)return;const delta=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;const pixels=delta*(e.deltaMode===1?20:e.deltaMode===2?c.clientWidth:1);const canMove=pixels<0?c.scrollLeft>0:c.scrollLeft<c.scrollWidth-c.clientWidth-1;if(canMove){e.preventDefault();c.scrollLeft+=pixels;carouselPosition=c.scrollLeft}},{passive:false});
document.addEventListener('keydown',e=>{if(!e.target.classList?.contains('pupil-carousel'))return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();e.target.scrollBy({left:e.key==='ArrowRight'?220:-220,behavior:'smooth'})}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.insight){selectInsight(b.dataset.insight)}if(b.dataset.prompt)sendChat(b.dataset.prompt)});

function activityProposal(id=student){const d=learningData[id];return id==='joaquin'?{title:'Repartimos piezas en partes iguales',objective:'Reconocer que el denominador indica en cuántas partes iguales se divide el entero.',instruction:'Armá un entero con 12 piezas. Dividilo en 3 grupos iguales. Señalá un tercio y explicá qué indica el 3. Después repartí las mismas piezas en 4 grupos y compará un tercio con un cuarto.',duration:12,support:'12 piezas manipulables, barra de fracciones y preguntas guiadas.',reason:'En dos registros Joaquín confundió numerador y denominador. Las respuestas mejoraron al utilizar piezas y apoyos visuales.',slot:'Próximo bloque de Matemática'}:{title:'Práctica guiada · '+d.theme,objective:'Retomar el aspecto observado en '+pupil(id).subject+' con apoyo específico.',instruction:d.recommend,duration:15,support:d.support,reason:d.finding,slot:'Próximo bloque de '+pupil(id).subject}}

function activitiesWithRecords(){const d=learningData[student],reviewed=state.reviewedRecords?.[student]||[];return proposedActivityCard()+`<section class="card" style="margin-top:22px"><h2>Actividades realizadas</h2><p class="small muted" style="margin-top:10px">Consultá las respuestas y los apoyos antes de decidir la próxima práctica.</p><div class="table-wrap"><table><thead><tr><th>Fecha y actividad</th><th>Resultado registrado</th><th>Apoyos</th><th>Detalle</th></tr></thead><tbody>${d.sessions.map(([date,name,result,support],i)=>`<tr><td>${date}<br>${esc(name)}</td><td>${esc(result)}</td><td>${esc(support)}</td><td><button class="link" data-record="${i}">Ver registro</button>${reviewed.includes(i)?'<span class="tag green">Consultado</span>':''}</td></tr>`).join('')}</tbody></table></div></section><section class="card embedded-history"><h2>Seguimiento de actividades</h2><div class="timeline">${d.sessions.map(([date,name,result,support])=>`<article class="event"><span class="small muted">${date} · ${esc(name)}</span><p>${esc(result)}</p><p class="small muted">Apoyo: ${esc(support)}</p></article>`).join('')}</div></section>`}
function showActivityRecord(index){const row=learningData[student].sessions[index];if(!row)return;state.reviewedRecords=state.reviewedRecords||{};state.reviewedRecords[student]=state.reviewedRecords[student]||[];if(!state.reviewedRecords[student].includes(index))state.reviewedRecords[student].push(index);persist();selectJourneyTab('activities');let details;
if(student==='joaquin'&&index===0)details='<h3 style="margin-top:20px">Consigna presentada</h3><p>Hay 12 piezas divididas en 3 grupos iguales. ¿Qué indica el 3 de la fracción 1/3?</p><h3 style="margin-top:20px">Respuesta del alumno</h3><p>“Las piezas que me quedo”. Confundió la cantidad de grupos con la parte seleccionada.</p><h3 style="margin-top:20px">Después del apoyo</h3><p>Al repartir las piezas presencialmente, reconoció los tres grupos. Todavía necesitó una pregunta guiada para explicar el denominador.</p>';

else details=`<h3 style="margin-top:20px">Registro de la actividad</h3><p>${esc(row[2])}</p><p class="muted" style="margin-top:10px">${esc(learningData[student].finding)}</p>`;

actions['preview-activity']=()=>{const p=activityProposal(),accepted=state.nextActivities?.[student],count=state.reviewedRecords?.[student]?.length||0;modal(p.title,`${accepted?'<span class="tag green">Aceptada por Clara López</span>':miseTag('Sugerencia de Miseño')}<h3 style="margin-top:20px">Objetivo</h3><p>${esc(p.objective)}</p><h3 style="margin-top:20px">Consigna</h3><p>${esc(p.instruction)}</p><div class="callout"><strong>${p.duration} minutos · ${esc(p.slot)}</strong><p>Apoyos: ${esc(p.support)}</p></div><h3 style="margin-top:20px">Por qué se propone</h3><p>${esc(p.reason)}</p>${accepted?`<p class="callout">Aceptada el ${esc(new Date(accepted.acceptedAt).toLocaleString('es-AR'))}. Quedó programada como próxima actividad, sin modificar las actividades ya realizadas.</p><div class="actions"><button class="btn secondary" data-action="close">Volver</button></div>`:`<p class="small muted" style="margin-top:15px">${count?count+' registro(s) consultado(s) en Actividades.':'Aún no consultaste el detalle de las actividades.'}</p><form id="accept-activity-form"><label class="check"><input id="activity-evidence-confirm" type="checkbox" required><span>Contrasté la sugerencia con las actividades y considero adecuada esta práctica.</span></label><div id="accept-error" class="error" role="alert"></div><div class="actions"><button class="btn" type="submit">Aceptar como próxima actividad</button><button class="btn secondary" type="button" data-action="preview-to-records">Revisar actividades</button><button class="btn ghost" type="button" data-action="preview-to-adjust">Pedir un ajuste</button></div><p class="small muted" style="margin-top:12px">Al aceptar, reemplaza la próxima propuesta de práctica de esta materia. Las demás actividades se conservan.</p></form>`}`)};
