100%;max-width:none;gap:5px}.pupil-carousel{padding-left:22px;padding-right:22px;mask-image:linear-gradient(to right,transparent,#000 24px,#000 calc(100% - 24px),transparent);-webkit-mask-image:linear-gradient(to right,transparent,#000 24px,#000 calc(100% - 24px),transparent)}}


.journey-layout,#detail-panel,.capsule-content{animation:none!important}

.next-activity{margin-bottom:22px;border:1px solid #cdd9f0}.table-wrap td .tag{margin-top:5px}.next-activity h2{font-size:23px}

.project-brief{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px;margin-bottom:20px}.project-brief p{margin-top:10px}.project-tabs button[aria-pressed=true]{border-bottom-color:var(--blue);color:#294fae;font-weight:700}.project-columns{display:grid;grid-template-columns:290px minmax(0,1fr);gap:24px;align-items:start}.project-roster{display:grid;gap:10px;margin-top:20px}.team-select{display:flex;flex-direction:column;gap:6px;padding:15px;text-align:left;border:1px solid #d5dfe1;background:#ffffff66;border-radius:12px;transition:background .2s,border-color .2s}.team-select[aria-pressed=true]{border-color:#315dce;background:#e8eef9bb}.team-select strong{font-family:var(--display);font-size:20px;font-weight:400}.project-member-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:20px}.project-checkpoints{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:24px;padding-bottom:20px;border-bottom:1px solid var(--line)}.project-checkpoints p{margin-top:8px}.incident-list{display:grid;gap:20px;margin-top:24px}.incident-card{padding:22px;border:1px solid #ddded4;background:#fff9;border-radius:14px}.incident-card>.small{margin-top:10px}.member-picker{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-height:270px;overflow:auto;padding:8px;border:1px solid var(--line);border-radius:12px;background:#fff8}.member-picker .check{margin:0;padding:9px;font-size:14px}.member-picker small{display:block;font-size:12px}#team-name,#incident-title{width:100%}#project-panel{min-height:350px}.incident-card .timeline:empty{display:none}.project-member-cards .student p{margin-bottom:0}@media(max-width:1000px){.project-columns{grid-template-columns:240px minmax(0,1fr)}.project-brief{grid-template-columns:1fr}.project-checkpoints{grid-template-columns:1fr}}@media(max-width:760px){.project-columns{grid-template-columns:1fr}.project-roster{grid-template-columns:repeat(2,minmax(0,1fr))}.project-member-cards{grid-template-columns:repeat(2,minmax(0,1fr))}.project-tabs{gap:3px}.project-tabs button{padding:12px}.incident-card{padding:16px}}@media(max-width:480px){.member-picker,.project-member-cards,.project-roster{grid-template-columns:1fr}.project-tabs button{font-size:14px}.incident-card>.row{flex-direction:column}.project-columns>.card>.row{flex-wrap:wrap}}

<body><div id="splash" class="splash" role="status" aria-label="Cargando Miseño"><div class="splash-logo"><span class="orb" aria-hidden="true"></span>Miseño</div></div><a class="skip" href="#main">Ir al contenido</a><div class="app"><aside class="sidebar"><div class="brand"><button class="home-mark" data-page="launch" aria-label="Miseño · Volver a categorías"><span class="orb" aria-hidden="true"></span>Miseño</button></div><div class="brand-sub">Espacio docente</div><nav aria-label="Navegación principal" id="nav"></nav><div class="sidebar-bottom"><div class="user"><div class="avatar">CL</div><div><strong>Clara López</strong><div class="small muted">Docente · Primaria</div></div></div><p class="small muted">Cada mirada aporta<br>otra forma de entender.</p></div></aside><div class="workspace"><main id="main" tabindex="-1"></main></div></div><dialog id="dialog" aria-labelledby="dialog-title"></dialog><div id="toast" class="toast" hidden role="status"></div>
<script>
'use strict';
const $=s=>document.querySelector(s), KEY='miseno-docentes-v1';
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial=()=>({notes:[],review:false,planReview:false,academic:false,started:false});
let selectedProfile=null;
let state=initial(),page='launch',student='tomi',tab='activities',query='',groupFilter='all',situationFilter='all',toastTimer;
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.notes))state={...initial(),...s}}catch(e){}
const pupils=[{id:'tomi',name:'Tomás',short:'Tomi',initial:'T',subject:'Matemática',activity:'Fracciones · Situaciones de fútbol',color:'#eee9fa',status:'Revisar adaptación'},{id:'joaquin',name:'Joaquín',short:'Joaquín',initial:'J',subject:'Matemática',activity:'Fracciones · Apoyo visual',color:'#e2eff4',status:'Necesita acompañamiento'},{id:'sofia',name:'Sofía',short:'Sofía',initial:'S',subject:'Ciencias',activity:'Las plantas · Proyecto de huerta',color:'#e0f1e8',status:'Actividad en curso'},{id:'bruno',name:'Bruno',short:'Bruno',initial:'B',subject:'Lengua',activity:'La arquera · Comprensión del cuento',color:'#f7e8df',status:'Actividad en curso'},{id:'emma',name:'Emma',short:'Emma',initial:'E',subject:'Historia',activity:'La colonia · Exploración guiada',color:'#e9e6f8',status:'Actividad en curso'},{id:'mateo',name:'Mateo',short:'Mateo',initial:'M',subject:'Ciencias',activity:'Las plantas · Observación',color:'#e0eee8',status:'Sin nuevos registros'}];
const iconPaths={group:'<circle cx="9" cy="7" r="3"/><path d="M3 20v-3a6 6 0 0 1 12 0v3M16 4a3 3 0 0 1 0 6m2 4a5 5 0 0 1 3 5"/>',situations:'<rect x="4" y="3" width="16" height="18" rx="4"/><path d="M8 8h8m-8 4h5m-5 4h8"/>',paths:'<circle cx="6" cy="5" r="2"/><circle cx="18" cy="19" r="2"/><path d="M6 7v7a5 5 0 0 0 5 5h5M8 5h5a5 5 0 0 1 5 5v7"/>',projects:'<rect x="3" y="4" width="7" height="7" rx="2"/><rect x="14" y="4" width="7" height="7" rx="2"/><rect x="3" y="15" width="7" height="7" rx="2"/><path d="M14 18h7m-3-3v7"/>'};
function icon(id){return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${iconPaths[id]||iconPaths.situations}</svg>`}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){toast('No se pudo guardar en el navegador. Se conserva durante esta sesión.');return false}}
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,5500)}
function pending(){return Number(!state.review)+Number(!state.academic)}
function nav(){const names={group:'Grupo',paths:'Recorridos',projects:'Proyectos'};$('#nav').innerHTML=Object.entries(names).map(([id,name])=>`<button data-page="${id}" ${page===id?'aria-current="page"':''}>${icon(id==='students'?'group':id)}${name}</button>`).join('')}

function title(a,b,extra=''){return `<div class="heading"><div><div class="eyebrow">Miseño · Grupo A</div><h1 id="page-title" tabindex="-1">${a}</h1><p>${b}</p></div>${extra}</div>`}
function pupil(id=student){return pupils.find(p=>p.id===id)||pupils[0]}
function avatar(p){return `<span class="avatar" style="background:${p.color}">${p.initial}</span>`}
function status(p){if(p.id==='tomi')return state.review?'En revisión':state.started?'En atención':p.status;if(p.id==='joaquin'&&state.academic)return 'Intervención realizada';return p.status}
function openPupil(id){student=id;page='paths';tab='activities';render(true)}
function group(){const list=pupils.filter(p=>(p.name+' '+p.short+' '+p.subject).toLowerCase().includes(query.toLowerCase()));return title('Grupo A','Actividades actuales y datos de los alumnos.')+`<div class="group-layout ${selectedProfile?'has-profile':''}"><section class="card"><div class="toolbar"><input type="search" id="search" aria-label="Buscar alumno o materia" placeholder="Buscar alumno o materia" value="${esc(query)}"></div><div class="student-list">${list.map(p=>`<button class="student" data-profile="${p.id}" aria-expanded="${selectedProfile===p.id}" aria-controls="student-profile"><div class="split">${avatar(p)}<div><strong>${p.name}</strong><div class="small muted">${p.subject}</div></div></div><p>${p.activity}</p><span class="tag">${status(p)}</span></button>`).join('')||'<p class="empty">No hay alumnos que coincidan con la búsqueda.</p>'}</div></section><aside id="student-profile" aria-label="Ficha del alumno" ${selectedProfile?'':'hidden'}>${selectedProfile?profilePanel(pupil(selectedProfile)):''}</aside></div>`}
function profilePanel(p){return `<section class="card profile-panel"><div class="row"><div class="split">${avatar(p)}<h2 id="profile-heading" tabindex="-1">${p.name}</h2></div><button class="close" data-action="close-profile" aria-label="Cerrar ficha del alumno">×</button></div><dl><dt>Nombre de uso</dt><dd>${p.short}</dd><dt>Grupo</dt><dd>Grupo A · Primaria</dd><dt>Actividad actual</dt><dd>${p.activity}</dd><dt>Estado</dt><dd>${status(p)}</dd></dl><p class="small muted">Otros datos personales: sin cargar.</p><div class="actions"><button class="btn secondary" data-student="${p.id}">Ver recorrido</button><button class="btn ghost" data-history="${p.id}">Ver historial</button></div></section>`}

function situations(){const items=[{id:'tomi',title:'Dificultad persistente · Revisar adaptación',desc:'Contrastar las fuentes utilizadas para personalizar sus actividades.',state:state.review?'review':state.started?'active':'pending',label:state.review?'En revisión':state.started?'En atención':'Pendiente'},{id:'joaquin',title:'El tutor solicita acompañamiento',desc:'Necesita apoyo con fracciones después de varios métodos de explicación.',state:state.academic?'done':'pending',label:state.academic?'Intervención realizada':'Pendiente'}].filter(i=>situationFilter==='all'||i.state===situationFilter);return title('Situaciones para acompañar','Revisá el contexto antes de decidir cómo intervenir.')+`<div class="toolbar"><label for="situation-filter" style="margin:0">Mostrar</label><select id="situation-filter"><option value="all">Todas las situaciones</option><option value="pending">Pendientes</option><option value="active">En atención</option><option value="review">En revisión</option><option value="done">Intervenciones realizadas</option></select></div><section class="card"><h2>Seguimiento del grupo</h2>${items.map(i=>`<article class="situation"><div><span class="tag ${i.state==='done'?'green':'amber'}">${i.label}</span><h3>${pupil(i.id).name} · ${i.title}</h3><p class="muted">${i.desc}</p><p class="small muted">10 nov · Registro de Miseño</p></div><button class="btn secondary" data-student="${i.id}">Abrir situación</button></article>`).join('')||'<p class="empty">No hay situaciones con este estado.</p>'}</section>`}
function sourcePanel(){return `<section class="card"><div class="row"><h2>Información utilizada</h2><span class="tag amber">Versiones diferentes</span></div><p class="muted" style="margin-top:10px">Estos registros refieren al mismo interés, desde momentos y contextos distintos.</p><div class="evidence"><article class="source-card family"><span class="tag green">Familia · Declaración</span><blockquote>“A Tomi le gusta el fútbol y jugar con autitos”.</blockquote><p class="small">2 nov · Aporte familiar<br>Contexto: intereses en casa.</p></article><article class="source-card"><span class="tag lilac">Alumno · Declaración explícita</span><blockquote>“No me gusta el fútbol. ¿Podemos hacer otra cosa?”.</blockquote><p class="small">9 nov · Conversación con el tutor<br>Contexto: actividad de fracciones.</p></article></div><div class="callout">Ninguna versión reemplaza a la otra. La fecha y el contexto pueden ayudar a entender la diferencia.</div><h3 style="margin-top:24px">Cómo lo está interpretando Miseño</h3><p class="muted" style="margin-top:10px">“Se utilizaron situaciones de fútbol a partir del interés declarado por la familia. Se registró necesidad de apoyo en varias actividades”.</p><div class="callout amber"><strong>Explicación incompleta</strong><br>No está disponible cómo se ponderó la declaración posterior del alumno ni por qué se mantuvo esa temática. La causa de la dificultad sigue abierta.</div></section>`}
function activities(){const tomi=student==='tomi';return `<section class="card"><h2>Actividades y apoyos utilizados</h2><p class="muted" style="margin-top:10px">${tomi?'La temática utilizada puede ser un aspecto a revisar. Estos resultados no explican por sí solos la dificultad.':'El tutor probó apoyos distintos y solicitó intervención presencial.'}</p><div class="table-wrap"><table><thead><tr><th>Actividad</th><th>Registro</th><th>Apoyos utilizados</th></tr></thead><tbody><tr><td>10 nov · Fracciones<br>Un tercio de 90 minutos</td><td>Respondió 45; luego pidió ayuda.</td><td>Pista verbal y barra visual del partido.</td></tr><tr><td>9 nov · Repartir goles<br>Tres cuartos de 12</td><td>Necesitó pasos guiados.</td><td>Grupos visuales y descomposición.</td></tr><tr><td>8 nov · Partes iguales</td><td>Completó con acompañamiento.</td><td>Objetos y explicación del tutor.</td></tr></tbody></table></div><div class="callout">Estos registros no constituyen un diagnóstico ni una comparación con otros alumnos.</div></section>`}
function history(){const notes=state.notes.filter(n=>n.student===student);return `<section class="card"><h2>Historial de miradas e intervenciones</h2><div class="timeline">${notes.map(n=>`<article class="event"><span class="tag blue">Docente · Clara López</span><p class="small muted">${esc(new Date(n.date).toLocaleString('es-AR'))}</p><h3 style="margin-top:8px">${esc(n.action)}</h3><p class="note-text">${esc(n.text)}</p><p class="small muted">Contexto: ${esc(n.context)}<br>Seguimiento: ${esc(n.followup)}</p><p class="small muted">Evidencias asociadas: ${esc(n.evidence)}</p></article>`).join('')}${student==='tomi'&&state.review?'<article class="event"><span class="tag amber">Revisión de adaptación</span><h3 style="margin-top:8px">Solicitud de revisión registrada</h3><p class="muted">La discrepancia permanece abierta. El plan actual no se modificó.</p></article>':''}${student==='tomi'?'<article class="event"><span class="tag lilac">Alumno · 9 nov</span><p>Expresó que no le gusta la temática de fútbol durante una actividad.</p></article><article class="event"><span class="tag green">Familia · 2 nov</span><p>Compartió fútbol y autitos como intereses. Se conserva el aporte original.</p></article>':'<article class="event"><span class="tag">Miseño · 10 nov</span><p>Se abrió la ficha con registros de su actividad escolar.</p></article>'}</div></section>`}
function detailLegacy(){const p=pupil(),isT=student==='tomi',isJ=student==='joaquin';let content=tab==='history'?history():tab==='activities'?activities():isT?sourcePanel():isJ?activities():`<section class="card"><h2>Su actividad actual</h2><p style="margin-top:15px">${p.activity}</p><div class="callout">${p.id==='mateo'?'Sin nuevos registros. La lectura de la pulsera no está disponible; no se infiere su estado ni el acompañamiento familiar.':'No hay una situación pendiente de revisión.'}</div><h3 style="margin-top:24px">Contexto de la familia</h3><p class="muted" style="margin-top:8px">Sin nuevos aportes familiares.</p></section>`;return `<div class="breadcrumb"><button class="link" data-page="group">Mi grupo</button><span class="muted">/</span>${p.name}</div>`+title(isT?'Entender lo que le pasa a Tomi':`Una mirada a ${p.name}`,isT?'Dificultad persistente · Revisar la adaptación de sus actividades.':p.activity,`<button class="btn" data-action="note">Registrar intervención</button>`)+`<div class="tabs" role="tablist" aria-label="Detalle del alumno">${[['activities','Actividades'],['evidence','Contexto y fuentes'],['interventions','Intervenciones']].map(([id,t])=>`<button role="tab" id="tab-${id}" aria-controls="detail-panel" aria-selected="${tab===id}" tabindex="${tab===id?0:-1}" data-tab="${id}">${t}</button>`).join('')}</div><div class="grid"><div id="detail-panel" role="tabpanel" aria-labelledby="tab-${tab}">${content}</div><aside class="stack"><section class="card"><div class="split">${avatar(p)}<div><h3>${p.name}</h3><p class="small muted">Grupo A · Primaria</p></div></div><div class="status-grid"><div><strong class="small">${isT?'Discrepancia':'Situación'}</strong><span class="tag amber">${status(p)}</span></div><div><strong class="small">Intervención docente</strong><span class="muted small">${state.notes.some(n=>n.student===student)?'Registrada · Ver historial':'Sin registrar'}</span></div><div><strong class="small">Aprendizaje</strong><span class="muted small">${isT||isJ?'Dificultad en seguimiento':'Actividad en seguimiento'}</span></div></div>${isT?`<button class="btn secondary" data-action="start" ${state.started||state.review?'disabled':''}>${state.review?'Discrepancia en revisión':state.started?'Situación en atención':'Comenzar atención'}</button><div class="actions"><button class="btn" data-action="review" ${state.review?'disabled':''}>${state.review?'Revisión registrada':'Solicitar revisión'}</button></div><p class="small muted" style="margin-top:14px">La solicitud queda registrada. El plan permanece sin cambios.</p>`:isJ?'<p class="small muted">Registrá el acompañamiento antes de marcar la intervención como realizada.</p>':'<p class="small muted">Podés sumar una observación aunque no haya una alerta.</p>'}</section><section class="card glass"><h3>Intervención docente</h3><p class="muted small" style="margin-top:12px">Conversá con el alumno y contrastá lo que ves con los registros. Atender la situación no implica dar la dificultad por resuelta.</p></section></aside></div>`}
function pathsLegacy(){return title('Recorridos de aprendizaje','Temas, apoyos y cambios del plan, con contexto individual.')+`<div class="toolbar"><label for="path-student" style="margin:0">Alumno</label><select id="path-student">${pupils.map(p=>`<option value="${p.id}" ${p.id===student?'selected':''}>${p.name}</option>`).join('')}</select></div><div class="grid"><section class="card"><div class="row"><h2>El recorrido de ${pupil().name}</h2><span class="tag">Vista por temas</span></div><p class="muted small" style="margin-top:9px">Los indicadores representan el avance dentro del tema.</p>${[['Matemática','Fracciones','Apoyo visual y pasos guiados',60],['Lengua','Comprensión de cuentos','Lectura acompañada',40],['Ciencias','Las plantas','Proyecto grupal de huerta',50],['Historia','La colonia','Exploración guiada',35],['Música','Flauta','En pausa en el plan',25]].map(([name,topic,desc,n])=>`<article class="subject"><div class="avatar" style="background:${name==='Música'?'#e9eceb':'#e8edf7'}">${name==='Matemática'?'½':name==='Ciencias'?'✿':name[0]}</div><div><h3>${name} · ${topic}</h3><p class="small muted">${desc}</p></div><div class="track"><span class="small muted">${name==='Música'?'En pausa':n+'% del tema'}</span><div class="bar" role="progressbar" aria-label="Avance en ${name}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${n}"><i style="width:${n}%"></i></div></div></article>`).join('')}</section><aside class="stack"><section class="card alert"><span class="tag amber">Cambio del plan</span><h2 style="margin-top:15px">Más bloques de Matemática</h2><p class="muted" style="margin-top:12px">El plan suma dos bloques semanales y deja Música en pausa.</p><button class="btn secondary" data-action="plan" style="margin-top:20px">Consultar el cambio</button></section><section class="card"><h3>Lo que podés hacer</h3><p class="muted small" style="margin-top:12px">Consultar el recorrido y dejar una revisión registrada. La edición directa del plan sigue pendiente de definición.</p></section></aside></div>`}

function render(focus=false){if(page==='detail'||page==='situations')page='paths';if(page==='students')page='group';document.body.classList.toggle('launch-mode',page==='launch');nav();$('#main').innerHTML=({launch,group,paths,projects}[page])();if(page==='paths'){const c=$('.pupil-carousel');if(c){c.scrollLeft=carouselPosition;c.onscroll=()=>{carouselPosition=c.scrollLeft}}}if(page==='paths'&&$('#situation-filter'))$('#situation-filter').value=situationFilter;if(focus){$('#page-title').focus();window.scrollTo(0,0)}}

function modal(title,body){$('#dialog').innerHTML=`<div class="row"><h2 id="dialog-title">${title}</h2><button class="close" data-action="close" aria-label="Cerrar">×</button></div>${body}`;$('#dialog').showModal()}
function note(){const p=pupil();modal(`Intervención · ${p.name}`,`<p class="muted" style="margin-top:12px">Registrá qué observaste y cómo acompañaste la situación.</p><form id="note-form"><label for="observation">Tu observación</label><textarea id="observation" required maxlength="2500" aria-describedby="note-error" placeholder="Por ejemplo: conversamos sobre sus intereses. Prefiere problemas con plantas y animales."></textarea><div id="note-error" class="error" role="alert"></div><label for="context">Contexto</label><select id="context"><option>Conversación presencial con el alumno</option><option>Observación durante la actividad</option><option>Conversación con la familia</option><option>Actividad grupal</option></select><label for="action">Acción realizada</label><select id="action"><option>Conversé con el alumno</option><option>Acompañé el ejercicio presencialmente</option><option>Contrasté los registros disponibles</option><option>Observé la actividad grupal</option></select><label for="followup">Seguimiento</label><select id="followup"><option>Continuar observando</option><option>Revisar adaptación con el equipo pedagógico</option><option>Retomar conversación con la familia</option></select><div class="callout">Evidencias asociadas: ${student==='tomi'?'aporte familiar del 2 nov, declaración del alumno del 9 nov y actividades del 8 al 10 nov.':'registros de actividad del alumno.'}</div><label class="check"><input type="checkbox" id="attended" checked><span>Registrar la intervención como realizada. La dificultad continúa en seguimiento.</span></label><p class="small muted">No modifica el plan ni resuelve automáticamente una discrepancia.</p><div class="actions"><button class="btn" type="submit">Guardar intervención</button><button class="btn ghost" type="button" data-action="close">Cancelar</button></div></form>`)}
const actions={close:()=>$('#dialog').close(),note,start:()=>{state.started=true;persist();render();toast('Situación en atención. Los registros originales se conservan.')},review:()=>modal('Revisar la adaptación de Tomi',`<p style="margin-top:18px">Se registrará una solicitud para contrastar los intereses utilizados y revisar la propuesta de actividades.</p><div class="callout amber">La discrepancia quedará “En revisión”. El plan actual permanece igual.</div><p class="muted small" style="margin-top:15px">Responsable y plazo de resolución: pendientes de asignación.</p><div class="actions"><button class="btn" data-action="confirm-review">Registrar solicitud</button><button class="btn ghost" data-action="close">Volver</button></div>`),'confirm-review':()=>{state.review=true;state.started=true;const ok=persist();$('#dialog').close();render();if(ok)toast('Revisión registrada. El plan no cambió.')},plan:()=>modal('Revisión del cambio de plan',`<p style="margin-top:18px">${pupil().name} · Matemática suma dos bloques y Música queda en pausa.</p><div class="callout"><strong>Explicación de Miseño</strong><p>“Se eligió el mejor camino según cómo aprende el alumno”.</p></div><p class="muted" style="margin-top:15px">No se detalla qué datos justificaron este cambio. La autoridad para aprobar o suspenderlo sigue pendiente de definición.</p><div class="actions"><button class="btn" data-action="plan-review" ${state.planReview?'disabled':''}>${state.planReview?'Solicitud registrada':'Registrar pedido de revisión'}</button></div><p class="small muted" style="margin-top:15px">La solicitud no modifica el recorrido.</p>`),'plan-review':()=>{state.planReview=true;const ok=persist();$('#dialog').close();if(ok)toast('Pedido de revisión del plan guardado.')},project:()=>modal('Organizar la huerta',`<p style="margin-top:18px">Grupo propuesto: Joaquín, Sofía y Bruno.</p><ul><li>Reunir al grupo y preparar tierra, semillas y recipientes.</li><li>Conversar cómo se repartirán las tareas.</li><li>Observar la participación y los acuerdos entre compañeros.</li></ul><p class="muted">Cambiar integrantes requiere definir primero la autoridad docente sobre los agrupamientos.</p><div class="actions"><button class="btn" data-action="project-note">Registrar observación de Joaquín</button></div>`),'project-note':()=>{$('#dialog').close();student='joaquin';note();$('#context').value='Actividad grupal';$('#action').value='Observé la actividad grupal'},reset:()=>modal('Reiniciar el ejemplo',`<p style="margin-top:18px">Se eliminarán únicamente las intervenciones y solicitudes guardadas por este prototipo de Miseño en este navegador.</p><div class="actions"><button class="btn" data-action="confirm-reset">Reiniciar demo</button><button class="btn ghost" data-action="close">Cancelar</button></div>`),'confirm-reset':()=>{state=initial();persist();$('#dialog').close();page='group';query='';groupFilter='all';situationFilter='all';render(true);toast('Demo reiniciada.') }};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render(true)}else if(b.dataset.student){openPupil(b.dataset.student)}else if(b.dataset.tab){selectJourneyTab(b.dataset.tab)}else if(b.dataset.action&&actions[b.dataset.action])actions[b.dataset.action]()});
document.addEventListener('change',e=>{if(e.target.id==='group-filter'){groupFilter=e.target.value;render()}if(e.target.id==='situation-filter'){situationFilter=e.target.value;render()}if(e.target.id==='path-student'){student=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){const pos=e.target.selectionStart;query=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)}});
document.addEventListener('keydown',e=>{if(e.target.getAttribute('role')!=='tab'||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const ids=['activities','evidence','interventions'],i=ids.indexOf(tab);tab=e.key==='Home'?ids[0]:e.key==='End'?ids[2]:ids[(i+(e.key==='ArrowRight'?1:2))%3];selectJourneyTab(tab)});
document.addEventListener('submit',e=>{if(e.target.id!=='note-form')return;e.preventDefault();const text=$('#observation').value.trim();if(!text){$('#note-error').textContent='Escribí qué observaste antes de guardar.';$('#observation').focus();return}const attended=$('#attended').checked;state.notes.unshift({student,text,context:$('#context').value,action:$('#action').value,followup:$('#followup').value,date:new Date().toISOString(),attended,evidence:student==='tomi'?'Familia 2 nov; alumno 9 nov; actividades 8–10 nov':'Registros de actividad del alumno'});if(student==='joaquin'&&attended)state.academic=true;if(student==='tomi')state.started=true;const ok=persist();$('#dialog').close();page='paths';tab='interventions';render(true);if(ok)toast('Intervención guardada en el historial. La dificultad sigue en seguimiento.')});

function recommendations(){const p=pupil();return `<section class="card" style="margin-top:22px"><div class="row"><h2>Recomendaciones de la IA</h2><span class="tag lilac">Miseño · Propuesta</span></div><p style="margin-top:14px">${student==='tomi'?'Contrastar los intereses con Tomi y probar una actividad con otra temática antes de atribuir una causa a las dificultades.':student==='joaquin'?'Retomar el ejercicio con acompañamiento presencial y registrar qué parte necesita otra explicación.':'Registrar observaciones de la actividad actual antes de proponer nuevos ajustes.'}</p><div class="callout">${student==='tomi'?'Fundamento: diferencia entre la declaración familiar y la expresión del alumno; necesidad de apoyo en las actividades.':'Fundamento: registros de la actividad actual.'} La propuesta requiere revisión docente; no se aplica automáticamente.</div><div class="actions"><button class="btn secondary" data-action="edit-adaptation">Proponer ajuste</button></div>${(state.adjustments||[]).filter(a=>a.student===student).map(a=>`<div class="callout"><strong>Propuesta docente · ${esc(a.theme)}</strong><p>${esc(a.support)}</p><span>Registrada · Plan sin modificar</span></div>`).join('')}</section>`}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.profile){e.stopImmediatePropagation();student=b.dataset.profile;selectedProfile=b.dataset.profile;page='group';render();$('#profile-heading').focus()}if(b.dataset.history){e.stopImmediatePropagation();student=b.dataset.history;page='paths';tab='interventions';render(true)}if(b.dataset.carousel){e.stopImmediatePropagation();const c=$('.pupil-carousel');if(c)c.scrollBy({left:Number(b.dataset.carousel)*260,behavior:'smooth'})}},true);

let insightTab='family',carouselPosition=0;
function compactInsights(){const d=learningData[student];return `<aside class="insight-capsule card"><div class="insight-pills" role="group" aria-label="Aportes y recomendaciones"><button data-insight="family" aria-pressed="${insightTab==='family'}">Familia</button><button data-insight="ai" aria-pressed="${insightTab==='ai'}">${icon('paths')} IA</button></div>${insightTab==='family'?`<div class="capsule-content"><span class="tag green">Familia · ${d.date}</span><blockquote>${esc(d.family)}</blockquote><p class="small muted">Aporte conservado con su fuente y fecha.</p><div class="capsule-divider"></div><span class="tag lilac">Alumno · Declaración explícita</span><blockquote>${esc(d.child)}</blockquote><p class="small muted">${esc(d.context)}</p></div>`:`<div class="capsule-content"><span class="tag lilac">Interpretación de Miseño</span><p style="margin-top:12px">${esc(d.finding)}</p><h3 style="margin-top:22px">Recomendación</h3><p style="margin-top:10px">${esc(d.recommend)}</p>${recommendationActions()}<div class="capsule-divider"></div><h3>Conversar con Miseño</h3><p class="small muted" style="margin-top:6px">Conversación simulada sobre ${pupil().name}.</p><div class="chat-log" role="log" aria-label="Conversación sobre ${pupil().name}">${(state.chats?.[student]||[]).map(m=>`<div class="chat-message ${m.role}"><strong>${m.role==='user'?'Vos':'Miseño'}</strong><p>${esc(m.text)}</p></div>`).join('')||'<p class="small muted">Consultá los registros o pedí un cambio en la propuesta.</p>'}</div><div class="chat-suggestions"><button data-prompt="¿Qué le está costando?">¿Qué le cuesta?</button><button data-prompt="¿Por qué recomendás esta actividad?">¿Por qué?</button><button data-prompt="Quiero cambiar la temática">Pedir un cambio</button></div><form id="chat-form"><label for="chat-input" class="small">Mensaje para Miseño</label><textarea id="chat-input" maxlength="1500" rows="2" required placeholder="Preguntá por el alumno o pedí un cambio…"></textarea><div id="chat-error" class="error" role="alert"></div><button class="btn" style="margin-top:10px" type="submit">Enviar ${icon('paths')}</button></form>${(state.chatRequests||[]).filter(r=>r.student===student).map(r=>`<div class="callout"><strong>Pedido de cambio registrado</strong><p>${esc(r.text)}</p><span class="small">Pendiente de revisión · Plan sin modificar</span></div>`).join('')}</div>`}</aside>`}

function paths(){return `<h1 id="page-title" tabindex="-1" class="sr-only">Recorridos</h1><div class="carousel-row"><button class="btn ghost" data-carousel="-1" aria-label="Desplazar alumnos hacia la izquierda">←</button><div class="pupil-carousel" tabindex="0" aria-label="Carrusel de alumnos">${pupils.map(p=>`<button data-student="${p.id}" aria-pressed="${student===p.id}" class="pupil-choice">${avatar(p)}<span>${p.name}</span></button>`).join('')}</div><button class="btn ghost" data-carousel="1" aria-label="Desplazar alumnos hacia la derecha">→</button></div><div class="journey-layout"><div><div class="tabs" role="tablist" aria-label="Detalle del alumno">${[['activities','Actividades'],['evidence','Contexto y fuentes'],['interventions','Intervenciones']].map(([id,t])=>`<button role="tab" id="tab-${id}" aria-controls="detail-panel" aria-selected="${tab===id}" tabindex="${tab===id?0:-1}" data-tab="${id}">${t}</button>`).join('')}</div><div id="detail-panel" role="tabpanel" aria-labelledby="tab-${tab}">${studentRecords()}</div>${(state.adjustments||[]).filter(a=>a.student===student).map(a=>`<div class="callout"><strong>Propuesta docente · ${esc(a.theme)}</strong><p>${esc(a.support)}</p><span>Registrada · Plan sin modificar</span></div>`).join('')}</div>${compactInsights()}</div>`}
function sendChat(text){text=text.trim();if(!text)return false;const d=learningData[student], normalized=text.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');let answer;
if(/cambi|modific|ajust|reemplaz|agreg|quita|mas tiempo|menos tiempo|aument|reduc|prefier|usar |usemos|quiero que/.test(normalized)){state.chatRequests=state.chatRequests||[];state.chatRequests.unshift({student,text,date:new Date().toISOString()});answer=`Registré tu pedido para ${pupil().name}: “${text}”. La propuesta actual es trabajar ${d.theme.toLowerCase()} con ${d.support.toLowerCase()}. Podemos usar este pedido para preparar una revisión; el plan todavía no se modificó.`}
else if(/famil|casa|padre|madre/.test(normalized))answer=`La familia informó el ${d.date}: ${d.family} El alumno expresó: ${d.child} Conviene considerar ambos contextos antes de decidir un ajuste.`;
else if(/por que|recom|actividad|ayud|apoyo/.test(normalized))answer=`Recomiendo: ${d.recommend} Me baso en estos registros: ${d.finding} Es una propuesta para revisar con tu observación docente.`;
else if(/historial|avan|progres|ultim/.test(normalized))answer=`En los últimos registros: ${d.sessions.map(s=>s[0]+': '+s[2]).join('; ')}. La observación docente más reciente dice: ${d.observations[0][1]}`;
else if(/cuesta|dific|como|que|situacion/.test(normalized))answer=`Sobre ${pupil().name}: ${d.finding} Propongo ${d.recommend.charAt(0).toLowerCase()+d.recommend.slice(1)}`;
else answer=`Puedo consultar los registros de ${pupil().name}, explicar la recomendación o registrar un pedido de cambio. Para esta consulta no tengo más información que las actividades, las observaciones y los aportes que aparecen en su ficha.`;
state.chats=state.chats||{};state.chats[student]=state.chats[student]||[];state.chats[student].push({role:'user',text},{role:'assistant',text:answer});persist();insightTab='ai';render();const log=$('.chat-log');if(log)log.scrollTop=log.scrollHeight;return true;}
document.addEventListener('wheel',e=>{const c=e.target.closest('.pupil-carousel');if(!c||e.ctrlKey)return;const delta=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;const pixels=delta*(e.deltaMode===1?20:e.deltaMode===2?c.clientWidth:1);const canMove=pixels<0?c.scrollLeft>0:c.scrollLeft<c.scrollWidth-c.clientWidth-1;if(canMove){e.preventDefault();c.scrollLeft+=pixels;carouselPosition=c.scrollLeft}},{passive:false});
document.addEventListener('keydown',e=>{if(!e.target.classList?.contains('pupil-carousel'))return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();e.target.scrollBy({left:e.key==='ArrowRight'?220:-220,behavior:'smooth'})}});

function selectJourneyTab(next){if(!['activities','evidence','interventions'].includes(next))return;tab=next;const panel=$('#detail-panel');if(!panel)return;panel.innerHTML=studentRecords();panel.setAttribute('aria-labelledby','tab-'+tab);for(const id of ['activities','evidence','interventions']){const button=$('#tab-'+id);button.setAttribute('aria-selected',String(id===tab));button.tabIndex=id===tab?0:-1}$('#tab-'+tab).focus()}
function selectInsight(next){insightTab=next;const capsule=$('.insight-capsule');if(!capsule)return;const template=document.createElement('template');template.innerHTML=compactInsights();const nextCapsule=template.content.firstElementChild;capsule.querySelector('.capsule-content').replaceWith(nextCapsule.querySelector('.capsule-content'));capsule.querySelectorAll('[data-insight]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.insight===next)));capsule.querySelector('[data-insight="'+next+'"]').focus()}

function activityProposal(id=student){const d=learningData[id];return id==='joaquin'?{title:'Repartimos piezas en partes iguales',objective:'Reconocer que el denominador indica en cuántas partes iguales se divide el entero.',instruction:'Armá un entero con 12 piezas. Dividilo en 3 grupos iguales. Señalá un tercio y explicá qué indica el 3. Después repartí las mismas piezas en 4 grupos y compará un tercio con un cuarto.',duration:12,support:'12 piezas manipulables, barra de fracciones y preguntas guiadas.',reason:'En dos registros Joaquín confundió numerador y denominador. Las respuestas mejoraron al utilizar piezas y apoyos visuales.',slot:'Próximo bloque de Matemática'}:{title:'Práctica guiada · '+d.theme,objective:'Retomar el aspecto observado en '+pupil(id).subject+' con apoyo específico.',instruction:d.recommend,duration:15,support:d.support,reason:d.finding,slot:'Próximo bloque de '+pupil(id).subject}}
function proposedActivityCard(){const proposal=activityProposal(),accepted=state.nextActivities?.[student];return `<section class="card next-activity"><div class="row"><div><span class="tag ${accepted?'green':'lilac'}">${accepted?'Próxima actividad':'Propuesta de Miseño'}</span><h2 style="margin-top:12px">${esc(accepted?accepted.title:proposal.title)}</h2></div><span class="small muted">${proposal.duration} min</span></div><p class="muted" style="margin-top:12px">${esc(proposal.objective)}</p>${accepted?`<p class="small muted" style="margin-top:12px">${esc(accepted.slot)} · Aceptada por Clara López<br>${esc(new Date(accepted.acceptedAt).toLocaleString('es-AR'))}</p>`:'<p class="small muted" style="margin-top:12px">Todavía no forma parte de la secuencia del alumno.</p>'}<div class="actions"><button class="btn secondary" data-action="preview-activity">${accepted?'Revisar próxima actividad':'Ver actividad sugerida'}</button></div></section>`}
function recommendationActions(){return `<div class="actions"><button class="btn" data-action="preview-activity">${state.nextActivities?.[student]?'Ver próxima actividad':'Ver actividad sugerida'}</button><button class="btn secondary" data-action="check-activities">Revisar actividades</button></div><p class="small muted" style="margin-top:10px">${state.nextActivities?.[student]?'Aceptada por Clara López para el próximo bloque.':'Propuesta pendiente de decisión docente.'}</p>`}
function activitiesWithRecords(){const d=learningData[student],reviewed=state.reviewedRecords?.[student]||[];return proposedActivityCard()+`<section class="card" style="margin-top:22px"><h2>Actividades realizadas</h2><p class="small muted" style="margin-top:10px">Consultá las respuestas y los apoyos antes de decidir la próxima práctica.</p><div class="table-wrap"><table><thead><tr><th>Fecha y actividad</th><th>Resultado registrado</th><th>Apoyos</th><th>Detalle</th></tr></thead><tbody>${d.sessions.map(([date,name,result,support],i)=>`<tr><td>${date}<br>${esc(name)}</td><td>${esc(result)}</td><td>${esc(support)}</td><td><button class="link" data-record="${i}">Ver registro</button>${reviewed.includes(i)?'<span class="tag green">Consultado</span>':''}</td></tr>`).join('')}</tbody></table></div></section><section class="card embedded-history"><h2>Seguimiento de actividades</h2><div class="timeline">${d.sessions.map(([date,name,result,support])=>`<article class="event"><span class="small muted">${date} · ${esc(name)}</span><p>${esc(result)}</p><p class="small muted">Apoyo: ${esc(support)}</p></article>`).join('')}</div></section>`}
function showActivityRecord(index){const row=learningData[student].sessions[index];if(!row)return;state.reviewedRecords=state.reviewedRecords||{};state.reviewedRecords[student]=state.reviewedRecords[student]||[];if(!state.reviewedRecords[student].includes(index))state.reviewedRecords[student].push(index);persist();selectJourneyTab('activities');let details;
if(student==='joaquin'&&index===0)details='<h3 style="margin-top:20px">Consigna presentada</h3><p>Hay 12 piezas divididas en 3 grupos iguales. ¿Qué indica el 3 de la fracción 1/3?</p><h3 style="margin-top:20px">Respuesta del alumno</h3><p>“Las piezas que me quedo”. Confundió la cantidad de grupos con la parte seleccionada.</p><h3 style="margin-top:20px">Después del apoyo</h3><p>Al repartir las piezas presencialmente, reconoció los tres grupos. Todavía necesitó una pregunta guiada para explicar el denominador.</p>';
else if(student==='joaquin'&&index===2)details='<h3 style="margin-top:20px">Consigna presentada</h3><p>Señalá una mitad en una barra dividida en dos partes iguales y explicá qué representa el 2.</p><h3 style="margin-top:20px">Respuesta del alumno</h3><p>Señaló una mitad, pero explicó el 2 como “lo que tomo”.</p><h3 style="margin-top:20px">Después del apoyo</h3><p>Identificó las dos partes al señalarlas. Necesitó acompañamiento para distinguirlas de la parte elegida.</p>';
else details=`<h3 style="margin-top:20px">Registro de la actividad</h3><p>${esc(row[2])}</p><p class="muted" style="margin-top:10px">${esc(learningData[student].finding)}</p>`;
modal('Registro · '+pupil().name,`<p class="small muted" style="margin-top:12px">${esc(row[0])} · ${esc(row[1])}</p>${details}<div class="callout"><strong>Apoyo utilizado</strong><p>${esc(row[3])}</p></div><div class="actions"><button class="btn secondary" data-action="close">Volver a las actividades</button><button class="btn" data-action="record-to-proposal">Ver sugerencia de la IA</button></div>`)}

function acceptNextActivity(){if(state.nextActivities?.[student])return false;const p=activityProposal(),date=new Date().toISOString();state.nextActivities=state.nextActivities||{};state.nextActivities[student]={...p,acceptedAt:date,teacher:'Clara López'};state.notes.unshift({student,text:'Se contrastaron los registros de actividades y se aceptó la propuesta de Miseño “'+p.title+'” como próxima actividad. Objetivo: '+p.objective,context:'Revisión de actividades y recomendación de Miseño',action:'Aceptación de próxima actividad',followup:'Observar el resultado en el próximo bloque de '+pupil().subject,date,attended:true,evidence:(state.reviewedRecords?.[student]||[]).map(i=>learningData[student].sessions[i].slice(0,2).join(' · ')).join('; ')||'Revisión declarada por la docente'});const ok=persist();$('#dialog').close();tab='activities';page='paths';render();toast(ok?'Próxima actividad programada · Aceptada por Clara López.':'Actividad programada durante esta sesión; no se pudo guardar en el navegador.');return true}

ron la misma regla al mismo tiempo. No quedó acordado cómo compartir el material.',status:'followup',recommendation:'Reunir a los representantes de ambos equipos, acordar un orden de uso y verificarlo al cierre.'}];}

function projectNavigation(){return `<div class="tabs project-tabs" role="group" aria-label="Secciones del proyecto">${[['teams','Grupos'],['follow','Seguimiento'],['coexist','Convivencia']].map(([id,label])=>`<button data-project-tab="${id}" aria-pressed="${projectTab===id}">${label}</button>`).join('')}</div>`}
function groupProjectPanel(){const team=chosenTeam();const unassigned=pupils.filter(p=>!projectTeams().some(t=>t.members.includes(p.id)));return `<div class="project-columns"><aside class="card"><div class="row"><h2>Equipos</h2><button class="link" data-project-action="new-team">Crear grupo</button></div>${projectRoster()}${unassigned.length?`<div class="callout amber"><strong>Sin asignar</strong><p>${esc(memberNames(unassigned.map(p=>p.id)))}</p></div>`:''}</aside><div class="stack"><section class="card"><div class="row"><h2>${esc(team.name)}</h2><button class="btn secondary" data-project-action="edit-team">Editar integrantes</button></div><div class="project-member-cards">${team.members.map(id=>`<button class="student" data-student="${id}"><div class="split">${avatar(pupil(id))}<div><strong>${pupil(id).name}</strong><div class="small muted">Ver recorrido</div></div></div><p>${esc(learningData[id].theme)}</p></button>`).join('')}</div><h3 style="margin-top:22px">Criterio del agrupamiento</h3><p class="muted" style="margin-top:10px">${esc(team.criterion)}</p><div class="callout">Roles a rotar: materiales, observación, registro y puesta en común.</div></section><section class="card"><span class="tag lilac">Propuesta de Miseño</span><h2 style="margin-top:14px">Explorar otra organización</h2><p class="muted" style="margin-top:12px">Preparar equipos a partir de los intereses registrados y distribuir oportunidades de participación. Podés revisar la propuesta antes de confirmarla.</p><div class="actions"><button class="btn secondary" data-project-action="suggest">Pedir propuesta de grupos</button></div></section></div></div>`}
function followProjectPanel(){const team=chosenTeam(),events=state.projectEvents.filter(e=>e.project===projectId&&e.studentIds.some(id=>team.members.includes(id)));return `<div class="project-columns"><aside class="card"><h2>Seleccionar equipo</h2>${projectRoster()}</aside><section class="card"><div class="row"><h2>Seguimiento · ${esc(team.name)}</h2><button class="btn" data-project-action="observe">Registrar observación</button></div><p class="muted" style="margin-top:12px">${esc(memberNames(team.members))}</p><div class="project-checkpoints"><div><strong>Participación</strong><p class="small muted">Quién propone, escucha y toma la palabra.</p></div><div><strong>Organización</strong><p class="small muted">Acuerdos sobre roles y materiales.</p></div><div><strong>Aprendizaje</strong><p class="small muted">Qué se pudo hacer y dónde hizo falta apoyo.</p></div></div><div class="timeline">${events.length?events.map(projectEventCard).join(''):'<p class="empty">Todavía no hay observaciones registradas para este equipo.</p>'}</div></section></div>`}
const incidentLabels={open:'Pendiente de intervención',followup:'En seguimiento',resolved:'Cerrada por la docente'};
function coexistProjectPanel(){const incidents=state.projectIncidents.filter(i=>i.project===projectId);return `<section class="card"><div class="row"><div><h2>Convivencia en el proyecto</h2><p class="muted" style="margin-top:10px">Situaciones dentro de un equipo o entre equipos.</p></div><button class="btn" data-project-action="new-incident">Registrar situación</button></div><div class="incident-list">${incidents.map(i=>`<article class="incident-card"><div class="row"><h3>${esc(i.title)}</h3><span class="tag ${i.status==='resolved'?'green':'amber'}">${incidentLabels[i.status]}</span></div><p class="small muted">${esc(i.source)} · ${esc(i.date)}</p><p style="margin-top:12px">${esc(i.description)}</p><p class="small muted" style="margin-top:10px">Involucrados: ${esc(memberNames(i.studentIds))}</p><div class="callout"><span class="tag lilac">Sugerencia de Miseño</span><p>${esc(i.recommendation)}</p></div><div class="actions"><button class="btn secondary" data-incident="${i.id}">${i.status==='resolved'?'Ver acuerdos o retomar':'Preparar intervención'}</button></div><div class="timeline">${state.projectEvents.filter(e=>e.incidentId===i.id).map(projectEventCard).join('')}</div></article>`).join('')||'<p class="empty">No hay situaciones de convivencia registradas para este proyecto.</p>'}</div></section>`}
function projects(){ensureProjects();return title('Proyectos','Organización de equipos, seguimiento y convivencia.')+`<div class="toolbar"><label for="project-select" style="margin:0">Proyecto</label><select id="project-select">${Object.entries(projectDefinitions).map(([id,d])=>`<option value="${id}" ${projectId===id?'selected':''}>${d.name}</option>`).join('')}</select><span class="tag green">${projectDefinitions[projectId].subject}</span></div><section class="card project-brief"><div><h2>${projectDefinitions[projectId].name}</h2><p class="muted">${projectDefinitions[projectId].goal}</p></div><div class="small muted">${projectDefinitions[projectId].date}<br>${projectDefinitions[projectId].materials}</div></section>${projectNavigation()}<div id="project-panel">${projectPanel()}</div>`}
function projectPanel(){return ({teams:groupProjectPanel,follow:followProjectPanel,coexist:coexistProjectPanel}[projectTab])()}
function updateProjectPanel(){const el=$('#project-panel');if(el)el.innerHTML=projectPanel();document.querySelectorAll('[data-project-tab]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.projectTab===projectTab)))}
function recordProjectEvent(data){ensureProjects();const event={id:'project-event-'+Date.now()+'-'+state.projectEvents.length,project:projectId,date:new Date().toISOString(),...data};event.studentIds=[...new Set(event.studentIds)];state.projectEvents.unshift(event);persist();return event}
function applyTeamEdit(id,name,members,criterion){const groups=projectTeams();name=name.trim();if(!name)return 'Escribí un nombre para el grupo.';if(members.length<2||members.length>6)return 'Elegí entre 2 y 6 integrantes.';if(new Set(members).size!==members.length||members.some(m=>!pupils.some(p=>p.id===m)))return 'Revisá la selección de alumnos.';const target=groups.find(t=>t.id===id);if(groups.some(t=>t.id!==id&&t.name.toLowerCase()===name.toLowerCase()))return 'Ya hay un grupo con ese nombre.';const others=groups.filter(t=>t.id!==id).map(t=>({...t,members:t.members.filter(m=>!members.includes(m))}));if(others.some(t=>t.members.length===1))return 'El cambio dejaría un equipo con un solo alumno. Elegí otra combinación o reorganizá los grupos.';const affected=[...(target?.members||[]),...members],newId=id||'team-'+Date.now();state.projectGroups[projectId]=[...others.filter(t=>t.members.length),{id:newId,name,members:[...members],criterion:criterion.trim()||'Agrupamiento definido por la docente.'}];selectedTeam=newId;recordProjectEvent({type:target?'Cambio de integrantes':'Creación de grupo',studentIds:affected,text:`${name}: ${memberNames(members)}. ${target?'Equipo anterior: '+memberNames(target.members)+'. ':''}Criterio: ${criterion.trim()||'Definición docente.'}`,followup:'Revisar participación y acuerdos durante la próxima actividad.'});return ''}
function editTeamForm(create=false){const team=create?null:chosenTeam();modal(create?'Crear grupo':'Editar · '+team.name,`<form id="team-edit-form" data-team-id="${team?.id||''}"><label for="team-name">Nombre del grupo</label><input id="team-name" maxlength="50" required value="${esc(team?.name||'')}"><label>Integrantes · Entre 2 y 6</label><div class="member-picker">${pupils.map(p=>`<label class="check"><input type="checkbox" name="team-member" value="${p.id}" ${team?.members.includes(p.id)?'checked':''}><span>${p.name}<small class="muted">${esc(projectTeams().find(t=>t.members.includes(p.id))?.name||'Sin grupo')}</small></span></label>`).join('')}</div><p class="small muted">Al confirmar, los alumnos seleccionados pasan a este equipo. Quienes retires quedan disponibles para reasignar. No se permiten equipos con un solo integrante.</p><label for="team-criterion">Criterio de organización</label><textarea id="team-criterion" maxlength="1000">${esc(team?.criterion||'')}</textarea><div id="team-error" class="error" role="alert"></div><div class="actions"><button class="btn" type="submit">Confirmar integrantes</button><button class="btn ghost" type="button" data-action="close">Cancelar</button></div></form>`)}
function suggestedTeams(){const order=projectId==='huerta'?['sofia','mateo','valentina','isabella','joaquin','nicolas','benjamin','tomasp','bruno','lucia','catalina','felipe','emma','santino','olivia','tomi']:pupils.map(p=>p.id);return [0,1,2,3].map(i=>({id:'suggested-'+projectId+'-'+i,name:['Exploración','Construcción','Comunicación','Organización'][i],members:order.slice(i*4,i*4+4),criterion:['Intereses registrados sobre plantas, animales y experimentos.','Intereses registrados sobre medidas, construcciones y formas.','Narración, lectura y descripción como oportunidades de registro compartido.','Preguntas sobre el entorno, recorridos y tareas de la comunidad.'][i]}))}
function showTeamProposal(){modal('Revisar propuesta de Miseño',`<p class="muted" style="margin-top:14px">La propuesta usa los intereses de las fichas y distribuye roles a rotar. No evalúa compatibilidad personal ni resuelve conflictos.</p>${suggestedTeams().map(t=>`<div class="callout"><h3>${t.name}</h3><p>${esc(memberNames(t.members))}</p><p class="small muted">${esc(t.criterion)}</p></div>`).join('')}<p style="margin-top:16px">Al confirmar, reemplaza los equipos actuales de este proyecto. Las observaciones y situaciones anteriores se conservan.</p><div class="actions"><button class="btn" data-project-action="accept-teams">Confirmar propuesta</button><button class="btn ghost" data-action="close">Conservar grupos actuales</button></div>`)}
function acceptTeamProposal(){const proposal=suggestedTeams();state.projectGroups[projectId]=proposal;selectedTeam=proposal[0].id;recordProjectEvent({type:'Agrupamiento propuesto por Miseño y confirmado por la docente',studentIds:proposal.flatMap(t=>t.members),text:proposal.map(t=>t.name+': '+memberNames(t.members)).join(' · '),followup:'Rotar roles y revisar la participación al cierre.'});$('#dialog').close();updateProjectPanel();toast('Grupos confirmados. Los registros anteriores se conservan.')}
function projectObservation(incidentId=null){const incident=state.projectIncidents.find(i=>i.id===incidentId),team=chosenTeam();modal(incident?'Intervención de convivencia':'Observación · '+team.name,`<p class="muted" style="margin-top:12px">${esc(memberNames(incident?incident.studentIds:team.members))}</p>${incident?`<div class="callout"><strong>${esc(incident.title)}</strong><p>${esc(incident.description)}</p><p><strong>Propuesta de Miseño:</strong> ${esc(incident.recommendation)}</p></div>`:''}<form id="project-observation-form" data-incident-id="${incidentId||''}"><label for="project-observation">${incident?'Qué hiciste y qué acuerdos se alcanzaron':'Qué observaste y qué apoyo diste'}</label><textarea id="project-observation" required maxlength="2000" placeholder="Describí lo observado sin atribuir intenciones."></textarea><label for="project-followup">Próximo seguimiento</label><textarea id="project-followup" required maxlength="1000" placeholder="Cuándo lo retomarás y qué vas a observar."></textarea>${incident?`<label for="incident-status">Estado de la situación</label><select id="incident-status"><option value="followup" selected>En seguimiento</option><option value="open">Pendiente de intervención</option><option value="resolved">Cerrar con acuerdos registrados</option></select><p class="small muted">Registrar una intervención no cierra automáticamente la situación.</p>`:''}<div id="project-observation-error" class="error" role="alert"></div><div class="actions"><button class="btn" type="submit">Guardar intervención</button><button class="btn ghost" type="button" data-action="close">Cancelar</button></div></form>`)}
function saveProjectObservation(text,followup,incidentId=null,status='followup'){text=text.trim();followup=followup.trim();if(!text||!followup)return 'Completá la observación y el próximo seguimiento.';const incident=state.projectIncidents.find(i=>i.id===incidentId);if(incidentId&&!incident)return 'La situación no está disponible.';if(incident&&!Object.keys(incidentLabels).includes(status))return 'Elegí un estado válido.';recordProjectEvent({type:incident?'Intervención de convivencia':'Observación de equipo',text,followup,studentIds:incident?incident.studentIds:chosenTeam().members,incidentId:incident?.id||null,status:incident?status:null});if(incident){incident.status=status;persist()}return ''}
function newIncidentForm(){modal('Registrar situación de convivencia',`<form id="new-incident-form"><label for="incident-title">Título</label><input id="incident-title" required maxlength="100" placeholder="Por ejemplo: desacuerdo en el uso de materiales"><label>Alumnos involucrados</label><div class="member-picker">${pupils.map(p=>`<label class="check"><input type="checkbox" name="incident-member" value="${p.id}"><span>${p.name}</span></label>`).join('')}</div><label for="incident-description">Qué ocurrió</label><textarea id="incident-description" required maxlength="2000"></textarea><div id="incident-error" class="error" role="alert"></div><div class="actions"><button class="btn" type="submit">Registrar situación</button><button class="btn ghost" type="button" data-action="close">Cancelar</button></div></form>`)}
function saveIncident(title,text,ids){title=title.trim();text=text.trim();if(!title||!text||ids.length<2)return 'Completá el título, lo ocurrido y al menos dos alumnos.';if(ids.some(id=>!pupils.some(p=>p.id===id)))return 'Revisá los alumnos seleccionados.';const incident={id:'incident-'+Date.now(),project:projectId,title,description:text,studentIds:[...new Set(ids)],date:new Date().toLocaleString('es-AR'),source:'Docente · Clara López',status:'open',recommendation:'Escuchar a las personas involucradas por separado si hace falta, reconstruir lo ocurrido y acordar una acción concreta con seguimiento.'};state.projectIncidents.unshift(incident);recordProjectEvent({type:'Situación de convivencia registrada',studentIds:incident.studentIds,text:title+': '+text,followup:'Preparar una intervención docente.',incidentId:incident.id});return ''}
// Link one project event into each involved student's intervention view.
const individualInterventions=interventionRecords;
interventionRecords=function(){ensureProjects();const events=state.projectEvents.filter(e=>e.studentIds.includes(student));return individualInterventions()+`<section class="card embedded-history"><h2>Intervenciones en proyectos</h2><div class="timeline">${events.map(e=>projectEventCard(e)+`<button class="link" data-open-project="${e.project}">Ver proyecto →</button>`).join('')||'<p class="empty">No hay intervenciones en proyectos registradas para este alumno.</p>'}</div></section>`};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.projectTab){projectTab=b.dataset.projectTab;updateProjectPanel();b.focus()}if(b.dataset.team){selectedTeam=b.dataset.team;updateProjectPanel()}if(b.dataset.incident)projectObservation(b.dataset.incident);if(b.dataset.openProject){projectId=b.dataset.openProject;projectTab='follow';selectedTeam=state.projectGroups[projectId].find(t=>t.members.includes(student))?.id||state.projectGroups[projectId][0].id;page='projects';render(true)}const a=b.dataset.projectAction;if(a==='new-team')editTeamForm(true);if(a==='edit-team')editTeamForm();if(a==='suggest')showTeamProposal();if(a==='accept-teams')acceptTeamProposal();if(a==='observe')projectObservation();if(a==='new-incident')newIncidentForm()});
document.addEventListener('change',e=>{if(e.target.id==='project-select'){projectId=e.target.value;selectedTeam=projectTeams()[0].id;render()}});
document.addEventListener('submit',e=>{const f=e.target;if(!['team-edit-form','project-observation-form','new-incident-form'].includes(f.id))return;e.preventDefault();let error='';if(f.id==='team-edit-form')error=applyTeamEdit(f.dataset.teamId||null,$('#team-name').value,[...f.querySelectorAll('[name="team-member"]:checked')].map(x=>x.value),$('#team-criterion').value);if(f.id==='project-observation-form')error=saveProjectObservation($('#project-observation').value,$('#project-followup').value,f.dataset.incidentId||null,$('#incident-status')?.value||'followup');if(f.id==='new-incident-form')error=saveIncident($('#incident-title').value,$('#incident-description').value,[...f.querySelectorAll('[name="incident-member"]:checked')].map(x=>x.value));if(error){$(f.id==='team-edit-form'?'#team-error':f.id==='project-observation-form'?'#project-observation-error':'#incident-error').textContent=error;return}$('#dialog').close();updateProjectPanel();toast('Guardado en el proyecto y vinculado a los alumnos.')});

render();
setTimeout(()=>{const splash=$('#splash');splash.hidden=true;},1400);
</script>
</body>
</html>
